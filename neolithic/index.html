  syncDrawUi();
  fit();
}
function toolIcon(k) {
  const s = `fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
  const p = {
    move: `<path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/>`,
    pen: `<path d="M4 20l4-1 11-11-3-3L5 16z"/>`,
    eraser: `<path d="M7 20h10M5 15l8-9 6 6-6 7H8z"/>`,
    line: `<path d="M5 19L19 5"/>`, rect: `<rect x="4" y="5" width="16" height="14" rx="1"/>`, ellipse: `<circle cx="12" cy="12" r="8"/>`,
    tri: `<path d="M12 4l9 16H3z"/>`, star: `<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>`,
    heart: `<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>`,
    arrow: `<path d="M4 12h15M14 6l6 6-6 6"/>`
  }[k];
  return `<svg viewBox="0 0 24 24" ${s} aria-hidden="true">${p}</svg>`;
}
function setColor(c) {
  DR.color = c;
  const pick = document.getElementById("dr-pick"); if (pick && /^#[0-9a-f]{6}$/i.test(c)) pick.value = c;
  const o = DR.objs[DR.sel];
  if (o) { pushUndo(); o.color = c; saveDraw(); }
  syncDrawUi(); drawAll();
}
function syncDrawUi() {
  $app.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === DR.tool));
  $app.querySelectorAll("[data-color]").forEach(b => b.setAttribute("aria-pressed", b.dataset.color === DR.color));
  const has = DR.sel >= 0;
  ["dr-del", "dr-dup", "dr-front"].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = !has; });
  const help = document.getElementById("dr-help");
  if (help) help.textContent = {
    move: has ? "Drag it to move it. Drag the yellow corner to resize it. Tap a color to recolor it." : "Tap anything you drew to pick it up and move it.",
    pen: "Draw with your finger or mouse.",
    eraser: "Touch anything to erase it."
  }[DR.tool] || "Drag on the canvas to make the shape. Then use Move to slide it around.";
}
function pushUndo() { DR.undo.push(JSON.stringify(DR.objs)); if (DR.undo.length > 60) DR.undo.shift(); }
function undoDraw() { if (!DR.undo.length) return; DR.objs = JSON.parse(DR.undo.pop()); DR.sel = -1; saveDraw(); syncDrawUi(); drawAll(); }
function deleteSel() { if (DR.sel < 0) return; pushUndo(); DR.objs.splice(DR.sel, 1); DR.sel = -1; saveDraw(); syncDrawUi(); drawAll(); }
function saveDraw() { store.set("drawing", DR.objs); }

function bbox(o) {
  if (o.type === "path") {
    const xs = o.pts.map(p => p[0]), ys = o.pts.map(p => p[1]);
    return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
  }
  return { x: Math.min(o.x, o.x + o.w), y: Math.min(o.y, o.y + o.h), w: Math.abs(o.w), h: Math.abs(o.h) };
}
function moveObj(o, dx, dy) {
  if (o.type === "path") o.pts = o.pts.map(([x, y]) => [x + dx, y + dy]);
  else { o.x += dx; o.y += dy; }
}
function hitObj(o, x, y) {
  const pad = o.size / 2 + 8 * (DR.k || 1);
  if (o.type === "path" || o.type === "line" || o.type === "arrow") {
    const pts = o.type === "path" ? o.pts : [[o.x, o.y], [o.x + o.w, o.y + o.h]];
    if (pts.length === 1) return Math.hypot(x - pts[0][0], y - pts[0][1]) < pad;
    for (let i = 1; i < pts.length; i++) if (segDist(x, y, { x: pts[i - 1][0], y: pts[i - 1][1] }, { x: pts[i][0], y: pts[i][1] }) < pad) return true;
    return false;
  }
  const b = bbox(o);
  return x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad && y < b.y + b.h + pad;
}
function onHandle(x, y) {
  const o = DR.objs[DR.sel];
  if (!o) return false;
  const b = bbox(o);
  const r = 18 * (DR.k || 1);
  return Math.abs(x - (b.x + b.w)) < r && Math.abs(y - (b.y + b.h)) < r;
}
function drawDown([x, y]) {
  const t = DR.tool;
  if (t === "move") {
    if (onHandle(x, y)) { pushUndo(); const o = DR.objs[DR.sel]; DR.act = { kind: "resize", start: [x, y], orig: JSON.parse(JSON.stringify(o)), box: bbox(o) }; return; }
    let hit = -1;
    for (let i = DR.objs.length - 1; i >= 0; i--) if (hitObj(DR.objs[i], x, y)) { hit = i; break; }
    DR.sel = hit;
    if (hit >= 0) { pushUndo(); DR.act = { kind: "drag", last: [x, y] }; const o = DR.objs[hit]; DR.color = o.color; }
    syncDrawUi(); drawAll();
    return;
  }
  if (t === "eraser") { DR.act = { kind: "erase", pushed: false }; eraseAt(x, y); return; }
  pushUndo();
  const o = t === "pen" ? { type: "path", pts: [[x, y]], color: DR.color, size: DR.size } : { type: t, x, y, w: 0, h: 0, color: DR.color, size: DR.size, fill: DR.fill };
  DR.objs.push(o);
  DR.act = { kind: "make", o };
  drawAll();
}
function eraseAt(x, y) {
  for (let i = DR.objs.length - 1; i >= 0; i--) if (hitObj(DR.objs[i], x, y)) {
    if (!DR.act.pushed) { pushUndo(); DR.act.pushed = true; }
    DR.objs.splice(i, 1);
  }
  drawAll();
}
function drawMove([x, y]) {
  const a = DR.act;
  if (a.kind === "make") {
    if (a.o.type === "path") a.o.pts.push([x, y]);
    else { a.o.w = x - a.o.x; a.o.h = y - a.o.y; }
  } else if (a.kind === "drag") {
    moveObj(DR.objs[DR.sel], x - a.last[0], y - a.last[1]); a.last = [x, y];
  } else if (a.kind === "resize") {
    const o = DR.objs[DR.sel], b = a.box;
    const nw = Math.max(10, b.w + (x - a.start[0])), nh = Math.max(10, b.h + (y - a.start[1]));
    if (o.type === "path") {
      const sx = b.w ? nw / b.w : 1, sy = b.h ? nh / b.h : 1;
      o.pts = a.orig.pts.map(([px, py]) => [b.x + (px - b.x) * sx, b.y + (py - b.y) * sy]);
    } else if (o.type === "line" || o.type === "arrow") {
      o.w = a.orig.w + (x - a.start[0]) * Math.sign(a.orig.w || 1); o.h = a.orig.h + (y - a.start[1]) * Math.sign(a.orig.h || 1);
    } else { o.x = b.x; o.y = b.y; o.w = nw; o.h = nh; }
  } else if (a.kind === "erase") eraseAt(x, y);
  drawAll();
}
function drawUp() {
  const a = DR.act;
  if (!a) return;
  DR.act = null;
  if (a.kind === "make") {
    const o = a.o;
    if (o.type !== "path" && Math.abs(o.w) < 4 && Math.abs(o.h) < 4) { o.w = 80; o.h = o.type === "line" || o.type === "arrow" ? 0 : 80; }
    if (o.type !== "path" && o.type !== "line" && o.type !== "arrow") { const b = bbox(o); Object.assign(o, b); }
  }
  saveDraw(); syncDrawUi(); drawAll();
}
function shapePath(c, o) {
  const { x, y, w, h } = o.type === "line" || o.type === "arrow" ? o : bbox(o);
  c.beginPath();
  if (o.type === "rect") c.rect(x, y, w, h);
  else if (o.type === "ellipse") c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  else if (o.type === "tri") { c.moveTo(x + w / 2, y); c.lineTo(x + w, y + h); c.lineTo(x, y + h); c.closePath(); }
  else if (o.type === "star") {
    for (let i = 0; i < 10; i++) { const r = i % 2 ? .4 : 1, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(x + w / 2 + Math.cos(a) * w / 2 * r, y + h / 2 + Math.sin(a) * h / 2 * r); }
    c.closePath();
  } else if (o.type === "heart") {
    c.moveTo(x + w / 2, y + h);
    c.bezierCurveTo(x - w * .1, y + h * .55, x + w * .05, y - h * .1, x + w / 2, y + h * .28);
    c.bezierCurveTo(x + w * .95, y - h * .1, x + w * 1.1, y + h * .55, x + w / 2, y + h);
    c.closePath();
  } else if (o.type === "line" || o.type === "arrow") {
    c.moveTo(x, y); c.lineTo(x + w, y + h);
    if (o.type === "arrow") {
      const ang = Math.atan2(h, w), L = Math.max(14, o.size * 2.5);
      c.moveTo(x + w, y + h); c.lineTo(x + w - Math.cos(ang - .5) * L, y + h - Math.sin(ang - .5) * L);
      c.moveTo(x + w, y + h); c.lineTo(x + w - Math.cos(ang + .5) * L, y + h - Math.sin(ang + .5) * L);

}
function drawAll() {
  const c = DR?.ctx;
  if (!c) return;
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, DW, DH);
  c.lineCap = "round"; c.lineJoin = "round";
  DR.objs.forEach(o => {
    c.strokeStyle = o.color; c.fillStyle = o.color; c.lineWidth = o.size;
    if (o.type === "path") {
      if (o.pts.length === 1) { c.beginPath(); c.arc(o.pts[0][0], o.pts[0][1], o.size / 2, 0, 7); c.fill(); return; }
      c.beginPath(); c.moveTo(...o.pts[0]); o.pts.slice(1).forEach(p => c.lineTo(...p)); c.stroke();
      return;
    }
    shapePath(c, o);
    if (o.fill && o.type !== "line" && o.type !== "arrow") c.fill(); else c.stroke();
  });
  const o = DR.objs[DR.sel];
  if (o && DR.tool === "move") {
    const b = bbox(o), p = o.size / 2 + 6;
    c.strokeStyle = "#5b4bd6"; c.lineWidth = 2; c.setLineDash([8, 6]); c.strokeRect(b.x - p, b.y - p, b.w + p * 2, b.h + p * 2); c.setLineDash([]);
    c.fillStyle = "#ffc93c"; c.strokeStyle = "#3a2600"; c.lineWidth = 2;
    c.beginPath(); c.arc(b.x + b.w, b.y + b.h, 11 * Math.max(1, (DR.k || 1) * .8), 0, 7); c.fill(); c.stroke();
  }
}

/* ---------- Timeline ---------- */
function startTimeline() {
  keyHandler = null;
  const st = { next: 0, mistakes: 0, missesHere: 0, pool: shuffle(TIMELINE.map((t, i) => ({ t, i }))) };
  const render = () => {
    if (st.next === TIMELINE.length) return timelineDone(st);
    $app.innerHTML = `
      <div class="panel">
        <div class="topline"><span class="label">Timeline</span><span id="tl-count">${st.next} of ${TIMELINE.length} placed · ${st.mistakes} mistakes</span></div>
        <h2>${st.next === 0 ? "What happened first?" : "What happened next?"}</h2>
        ${st.next ? `<ol class="placed">${TIMELINE.slice(0, st.next).map((t, i) => `<li><b>${i + 1}.</b><span>${esc(t)}</span></li>`).join("")}</ol>` : ""}
        <div class="pool">${st.pool.map(p => `<button data-i="${p.i}" class="${st.missesHere >= 2 && p.i === st.next ? "hint" : ""}">${esc(p.t)}</button>`).join("")}</div>
        ${st.missesHere >= 2 ? `<p class="soft">Hint: the gold card comes next.</p>` : ""}
        <button class="btn" id="home">Back to menu</button>
      </div>`;
    document.getElementById("home").addEventListener("click", showHome);
    $app.querySelectorAll(".pool button").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      if (i === st.next) {
        sfx.right();
        st.pool = st.pool.filter(p => p.i !== i);
        st.next++; st.missesHere = 0;
        render();
      } else {
        sfx.wrong();
        st.mistakes++; st.missesHere++;
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        if (st.missesHere === 2) render();
        else document.getElementById("tl-count").textContent = `${st.next} of ${TIMELINE.length} placed · ${st.mistakes} mistakes`;
      }
    }));
  };
  render();
}
function timelineDone(st) {
  $app.innerHTML = `
    <div class="panel">
      <span class="label">Timeline complete</span>
      <div class="big">${st.mistakes} ${st.mistakes === 1 ? "mistake" : "mistakes"}</div>
      <p>${st.mistakes === 0 ? "Perfect order! You know how the story goes." : "Read the full order once more, then try for zero mistakes."}</p>
      <ol class="placed">${TIMELINE.map((t, i) => `<li><b>${i + 1}.</b><span>${esc(t)}</span></li>`).join("")}</ol>
      <div class="row"><button class="btn go" id="again">Try again</button><button class="btn" id="home">Back to menu</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startTimeline);
  document.getElementById("home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Focus question flashcards ---------- */
function startFocus() {
  keyHandler = null;
  const st = { i: 0, got: 0, practice: [] };
  const render = () => {
    if (st.i === FOCUS.length) return focusDone(st);
    const f = FOCUS[st.i];
    $app.innerHTML = `
      <div class="panel flash">
        <div class="topline"><span class="label">Focus Question ${st.i + 1} of ${FOCUS.length}</span></div>
        <h2>${esc(f.q)}</h2>
        <p class="soft" id="say">Say your answer out loud (or tell a parent), then check it.</p>
        <div id="ans" hidden><h3>A strong answer includes:</h3><ul>${f.a.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="row" id="ctl"><button class="btn gold" id="show">Show answer</button><button class="btn" id="home">Back to menu</button></div>
      </div>`;
    document.getElementById("home").addEventListener("click", showHome);
    document.getElementById("show").addEventListener("click", () => {
      document.getElementById("ans").hidden = false;
      document.getElementById("say").hidden = true;
      document.getElementById("ctl").innerHTML = `<button class="btn go" id="got">I got it</button><button class="btn" id="more">I need more practice</button>`;
      document.getElementById("got").addEventListener("click", () => { st.got++; st.i++; render(); });
      document.getElementById("more").addEventListener("click", () => { st.practice.push(f); st.i++; render(); });
    });
  };
  render();
}
function focusDone(st) {
  $app.innerHTML = `
    <div class="panel">
      <span class="label">Focus Questions</span>
      <div class="big">${st.got} / ${FOCUS.length}</div>
      <p>${st.practice.length ? "Study these again. Try writing each answer in your own words:" : "You can answer every focus question. Great preparation!"}</p>
      ${st.practice.length ? `<div class="missed">${st.practice.map(f => `<div class="miss"><b>${esc(f.q)}</b>${f.a.map(esc).join(" ")}</div>`).join("")}</div>` : ""}
      <div class="row"><button class="btn go" id="again">Go through them again</button><button class="btn" id="home">Back to menu</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startFocus);
  document.getElementById("home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Easy / Hard: every game asks for a level at the start of each round ---------- */
let GDIFF = store.get("diff", "easy");
if (GDIFF !== "easy" && GDIFF !== "hard") GDIFF = "easy";
const hard = () => GDIFF === "hard";
const bestKey = id => hard() ? id + "_hard" : id;
function setDiff(d) {
  GDIFF = d; store.set("diff", d);
  const lab = document.querySelector("#app .slope-wrap .topline .label");
  if (lab) { lab.dataset.base ??= lab.textContent; lab.textContent = `${lab.dataset.base} · ${d === "hard" ? "Hard" : "Easy"}`; }
}
// Each game's start and "Play again" buttons (#m-go, #s-go, #a-go) are swapped for an Easy and a Hard button.
function wrapDiffButtons() {
  document.querySelectorAll("#m-go, #s-go, #a-go").forEach(orig => {
    if (orig.dataset.diffwrapped) return;
    orig.dataset.diffwrapped = "1";
    orig.classList.add("diff-orig");
    const t = orig.textContent.trim();
    const plain = /^(Start|Play again|Try again)$/i.test(t);
    const box = document.createElement("div");
    box.className = "diffrow";
    box.innerHTML = `<span class="diff-q">${plain ? "Pick a level:" : esc(t) + ":"}</span><button class="btn go" data-diff="easy">Easy</button><button class="btn diff-hard" data-diff="hard">Hard</button>`;
    orig.after(box);
    box.querySelectorAll("[data-diff]").forEach(b => b.addEventListener("click", () => { setDiff(b.dataset.diff); orig.click(); }));
    box.querySelector(`[data-diff="${GDIFF}"]`).focus({ preventScroll: true });
  });
}
new MutationObserver(wrapDiffButtons).observe(document.body, { childList: true, subtree: true });
// Dig It Up and Cash Race start straight from the menu, so they get their own level screen first.
function pickLevel(title, easyTxt, hardTxt, start) {
  document.querySelectorAll(".shop").forEach(el => el.remove());
  stopSlope(); stopArchers(); stopMini();
  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  if (G && !G.over) { G.over = true; clearInterval(G.timer); }
  keyHandler = null;
  $app.innerHTML = `
    <div class="panel" style="text-align:center;align-items:center">
      <span class="label">${title}</span>
      <h2>Pick a level</h2>
      <div class="levelpick">
        <button class="levelbtn lv-easy" data-level="easy"><b>Easy</b><span>${easyTxt}</span></button>
        <button class="levelbtn lv-hard" data-level="hard"><b>Hard</b><span>${hardTxt}</span></button>
      </div>
    </div>`;
  $app.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => { setDiff(b.dataset.level); start(); }));
  $app.querySelector(`[data-level="${GDIFF}"]`).focus();
}
const pickDig = () => pickLevel("Dig It Up", "Softer dirt and more resources to find.", "Tougher rock and fewer resources.", startDig);
const pickCash = () => pickLevel("Cash Race", "Normal earnings. Wrong answers cost a little.", "You earn less, and wrong answers cost double.", startGame);

/* ---------- Exit: one button on every screen that stops everything and goes home ---------- */
const exitBtn = document.getElementById("exit-all");
function exitAll() {
  document.querySelectorAll(".shop, .toast").forEach(el => el.remove());
  if (G && !G.over) { G.over = true; clearInterval(G.timer); }
  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  stopSlope(); stopArchers(); stopMini();
  showHome();
  window.scrollTo({ top: 0 });
}
exitBtn.addEventListener("click", exitAll);
// Show the button everywhere except the main page (the main page is the one with the games menu).
new MutationObserver(() => {
  const home = !!document.getElementById("gamesmenu");
  exitBtn.hidden = home;
  document.body.classList.toggle("has-exit", !home);
}).observe($app, { childList: true });

showHome();
</script>
