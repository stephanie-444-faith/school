<title>Study Arcade</title>
<meta name="description" content="Study games: Dig It Up, Cash Race, Slope City, Ragdoll Archers, and two mystery games, with Social Studies, Math, Science, Health, Reading and Writing, and Art questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: game-show screen. Money HUD pinned on top, question in the middle, big colored answer tiles below.
     Deliberately single-theme (dark, like a classroom game on a projector). */
  :root {
    color-scheme: dark;
    --bg: #1a1240;
    --panel: #281d5a;
    --panel-2: #36297a;
    --line: #4a3c94;
    --ink: #f7f4ff;
    --ink-soft: #bdb3e6;
    --money: #42e392;
    --gold: #ffc93c;
    --bad: #ff6070;
    --t1: #d7334a; --t2: #2f6fe4; --t3: #14966a; --t4: #c9670f; --t5: #8a46d8; --t6: #0a8f9a;
    --display: "Rowdies", "Trebuchet MS", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; }
  .wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }
  .soft { color: var(--ink-soft); }
  .money { color: var(--money); font-family: var(--display); font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 700; background: var(--panel-2); box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .btn.go { background: var(--money); color: #06301b; font-family: var(--display); font-size: 1.3rem; }
  .btn.gold { background: var(--gold); color: #3a2600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Home */
  .hero { text-align: center; display: flex; flex-direction: column; gap: 6px; padding-block: 10px; }
  .hero h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); letter-spacing: .01em; }
  .hero h1 span { color: var(--gold); }
  .label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .chip { text-align: left; border: 3px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .chip b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
  .chip span { font-size: .85rem; color: var(--ink-soft); }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: #4a3a1a; }
  .best { text-align: center; font-size: .95rem; }
  .extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .extras .btn { text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .extras .btn span { font-weight: 400; font-size: .85rem; color: var(--ink-soft); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; font-size: .9rem; }
  .legend div { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
  .legend b { font-family: var(--display); font-weight: 400; color: var(--gold); }
  details summary { cursor: pointer; font-weight: 700; color: var(--gold); }
  details[open] summary { margin-bottom: 10px; }

  /* HUD */
  .hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-radius: 18px; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .hud .money { font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; }
  .hud .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .hud .stats b { color: var(--ink); }
  .hud .streak b { color: var(--gold); }
  .hud .shopbtn { grid-row: span 2; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: var(--display); font-size: 1.15rem; background: var(--gold); color: #3a2600; padding: 10px 18px; }
  .hud .shopbtn small { font-family: var(--body); font-size: .72rem; font-weight: 700; }
  .goalbar { grid-column: 1 / -1; height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .goalbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--money), var(--gold)); transition: width .4s; }
  .active-pu { grid-column: 1 / -1; font-size: .82rem; color: var(--gold); font-weight: 700; }
  .active-pu:empty { display: none; }

  /* Question */
  .qcard { background: var(--ink); color: #1a1240; border-radius: 18px; padding: 22px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
  .qcard .tag { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6a5bb0; }
  .qcard .q { font-size: clamp(1.15rem, 3.6vw, 1.45rem); font-weight: 700; }
  .qcard .def { font-weight: 400; }
  .qcard .term { font-family: var(--display); font-weight: 400; color: var(--t2); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tiles.six { grid-template-columns: repeat(3, 1fr); }
  .tile { border: 0; border-radius: 16px; padding: 18px 14px; min-height: 96px; color: #fff; font-weight: 700; font-size: 1.02rem; text-align: left; display: flex; gap: 10px; align-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, filter .15s; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .tile:hover { filter: brightness(1.12); }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .tile .k { flex: none; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: .85rem; }
  .tiles.six .tile { flex-direction: column; justify-content: center; text-align: center; gap: 4px; min-height: 90px; }
  .tiles.six .tile b { font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1; }
  .tiles.six .tile span { font-size: .85rem; }
  .c1 { background: var(--t1); } .c2 { background: var(--t2); } .c3 { background: var(--t3); }
  .c4 { background: var(--t4); } .c5 { background: var(--t5); } .c6 { background: var(--t6); }

  /* Result splash */
  .splash { border-radius: 18px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: pop .25s ease-out; }
  .splash.good { background: #0f5d3a; }
  .splash.bad { background: #6e1f2a; }
  .splash h2 { font-size: 1.8rem; }
  .splash .delta { font-family: var(--display); font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
  .splash.good .delta { color: var(--money); }
  .splash.bad .delta { color: var(--bad); }
  .splash .ans { background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 14px; max-width: 60ch; }
  .splash .why { max-width: 60ch; color: #e6e0ff; }
  .splash .note { font-size: .9rem; color: var(--gold); font-weight: 700; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  /* Shop */
  .shop { position: fixed; inset: 0; z-index: 20; background: rgba(10, 6, 30, .82); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .shop-inner { width: 100%; max-width: 760px; background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .shop-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .shop-top .money { font-size: 1.8rem; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { border: 0; border-radius: 99px; padding: 8px 16px; font-weight: 700; background: var(--panel-2); color: var(--ink-soft); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #1a1240; }
  .items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .item { background: var(--panel-2); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .item h3 { font-size: 1.1rem; }
  .item p { font-size: .88rem; color: var(--ink-soft); }
  .lvl { display: flex; gap: 4px; }
  .lvl i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
  .lvl i.on { background: var(--gold); }
  .item .now { font-size: .9rem; font-variant-numeric: tabular-nums; }
  .item .now b { color: var(--money); }
  .item .btn { margin-top: auto; background: var(--money); color: #06301b; }
  .item .btn:disabled { background: var(--line); color: var(--ink-soft); box-shadow: none; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--gold); color: #3a2600; font-weight: 700; padding: 10px 18px; border-radius: 99px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

  /* End screen */
  .big { font-family: var(--display); font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--panel-2); border-radius: 12px; padding: 10px 14px; }
  .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .missed { display: flex; flex-direction: column; gap: 10px; }
  .miss { border-left: 4px solid var(--bad); padding: 8px 12px; background: var(--panel-2); border-radius: 0 10px 10px 0; font-size: .95rem; }
  .miss b { display: block; }

  /* Timeline + focus extras */
  .placed { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
  .placed li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 10px; background: #0f5d3a; font-size: .95rem; }
  .placed li b { flex: none; min-width: 1.4em; color: var(--money); font-variant-numeric: tabular-nums; }
  .pool { display: grid; gap: 8px; }
  .pool button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 3px solid var(--line); background: var(--panel-2); }
  .pool button:hover { border-color: var(--ink-soft); }
  .pool button.hint { border-color: var(--gold); }
  .shake { animation: shake .35s; border-color: var(--bad) !important; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .flash ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-soft); }

  .iconbtn { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font-size: .85rem; }
  footer { text-align: center; }

  /* Dig It Up */
  .feature-dig { background: linear-gradient(160deg, #3b2a14, var(--panel) 70%); }
  .dighud { grid-template-columns: 1fr; position: static; }
  .dstats { display: flex; gap: 8px 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .dstats b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--ink); }
  .dstats .energy b, .energy-big b { color: var(--money); }
  .dstats .coins b, .coins-big b { color: var(--gold); }
  .energy-big b, .coins-big b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
  .dbtns .btn { flex: 1; padding: 10px 14px; }
  .where { font-size: .9rem; }
  .inv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .invslot { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 6px 8px; min-width: 0; }
  .invslot svg { grid-row: span 2; width: 26px; height: 26px; }
  .invslot b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .invslot small { font-size: .7rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }
  .qclock { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
  .qclock .goalbar div { background: linear-gradient(90deg, var(--bad), var(--gold)); transition: width 1s linear; }
  .toolnow { font-size: .9rem; color: var(--ink-soft); }
  .toolnow b { color: var(--gold); }
  .dbtns .btn { flex: 0 1 auto; }
  .cracked { filter: brightness(.75); background-image: linear-gradient(135deg, transparent 45%, rgba(0,0,0,.55) 47%, transparent 52%), linear-gradient(45deg, transparent 60%, rgba(0,0,0,.45) 62%, transparent 66%); }
  .recipe { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
  .need { display: flex; align-items: center; gap: 6px; color: var(--bad); }
  .need.ok { color: var(--money); }
  .need svg { width: 18px; height: 18px; }
  .item.owned { outline: 2px solid var(--money); }
  .gold-t { color: var(--gold); font-weight: 700; }
  .site { max-height: 62vh; overflow-y: auto; border-radius: 16px; background: #1d120a; padding: 8px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .layer-label { grid-column: 1 / -1; font-family: var(--display); font-size: .85rem; color: var(--gold); padding: 6px 4px 2px; }
  .layer-label span { font-family: var(--body); color: #c9ad8c; font-size: .78rem; }
  .cell { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 6px; padding: 3px; display: grid; place-items: center; }
  .cell svg { width: 100%; height: 100%; }
  .sky { background: #4f86c6; }
  .dug { background: #2b1b10; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
  .dirt { box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .dirt:hover { filter: brightness(1.2); }
  .l0 { background: #9a6a3c; } .l1 { background: #85572f; } .l2 { background: #6f4626; } .l3 { background: #5a381f; } .l4 { background: #7fa7bd; }
  .boulder { background-image: radial-gradient(circle at 40% 40%, #a7a29c, #6b6560 70%); }
  .glint { outline: 2px solid var(--gold); outline-offset: -2px; }
  .glint svg { width: 70%; opacity: .9; }
  .me { background: #3a2716; }
  .sky.me { background: #4f86c6; }
  .museum { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; font-size: .85rem; }
  .museum li { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 6px 10px; min-height: 36px; }
  .museum li svg { width: 18px; height: 18px; flex: none; }
  .find { max-width: 560px; }
  .findcard { display: flex; gap: 14px; align-items: flex-start; background: var(--panel-2); border-radius: 14px; padding: 14px; }
  .findcard > svg { width: 44px; height: 44px; flex: none; }
  .findcard div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .good-l { border-left-color: var(--money); }
  .qover .shop-inner { gap: 12px; }
  .qover .splash { padding: 18px 10px; }
  .qover .delta { font-size: clamp(1.8rem, 7vw, 2.6rem); }

  .inv { grid-template-columns: repeat(6, 1fr); }
  .slope-over[hidden] { display: none; }
  .site { position: relative; max-height: 64vh; overflow: auto; overscroll-behavior: contain; }
  .grid { grid-template-columns: repeat(25, 40px) !important; width: max-content; }
  .cell { width: 40px; height: 40px; aspect-ratio: auto; }
  .layer-label { position: relative; }
  .layer-label .ll { position: sticky; left: 4px; display: inline-block; }
  .l5 { background: #565b66; } .l6 { background: #45397a; } .l7 { background: #6b2618; box-shadow: inset 0 -3px 0 rgba(255,120,40,.35); }
  .hint { font-size: .85rem; text-align: center; }
  .slope-card { background: linear-gradient(160deg, #0b3a24, var(--panel) 70%); }
  .slope-stage { position: relative; border-radius: 14px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
  .slope-stage canvas { display: block; width: 100%; }
  .slope-over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: rgba(0,0,0,.6); padding: 16px; }
  .steer .btn { flex: 1; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 1.1rem; padding: 16px; }

  .topbar { position: relative; }
  .gamesmenu { position: absolute; top: 0; right: 0; z-index: 10; }
  .gamesmenu summary { list-style: none; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-soft); opacity: .45; font-size: 1.3rem; line-height: 1; }
  .gamesmenu summary::-webkit-details-marker { display: none; }
  .gamesmenu summary:hover, .gamesmenu[open] summary { opacity: 1; background: var(--panel); }
  .gamesmenu summary:focus-visible { outline: 3px solid var(--gold); opacity: 1; }
  .gm-panel { position: absolute; right: 0; top: 42px; width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .gm-item { text-align: left; background: var(--panel-2); border: 0; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .gm-item:hover { filter: brightness(1.15); }
  .gm-item b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
  .gm-item span { font-size: .82rem; color: var(--ink-soft); }
  .gm-best { font-size: .75rem; color: var(--gold); font-weight: 700; }
  .gm-cash { gap: 6px; }
  .gm-cash button { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .gm-cash select { font: inherit; font-size: .85rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .archer-stage { touch-action: none; }

  .mini-stage { display: flex; justify-content: center; touch-action: none; }
  .mini-stage canvas { width: auto; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; margin-top: 4px; }
  .dpad .btn { padding: 0; font-size: 1.3rem; touch-action: none; }
  .dpad [data-d="0,-1"] { grid-column: 2; grid-row: 1; }
  .dpad [data-d="-1,0"] { grid-column: 1; grid-row: 2; }
  .dpad [data-d="0,1"] { grid-column: 2; grid-row: 2; }
  .dpad [data-d="1,0"] { grid-column: 3; grid-row: 2; }
  .gm-mystery b { color: var(--gold); }

  .tile.right { outline: 4px solid var(--money); outline-offset: 2px; }
  .tile.wrong { outline: 4px solid var(--bad); outline-offset: 2px; }
  .tile.dim { opacity: .35; }
  .tile:disabled { cursor: default; }

  .draw-wrap { gap: 12px; }
  .dr-tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .dr-tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; min-width: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); font-size: .78rem; }
  .dr-tool svg { width: 22px; height: 22px; }
  .dr-tool[aria-pressed="true"] { border-color: var(--gold); background: #4a3a1a; }
  .dr-colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dr-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; }
  .dr-swatch[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
  .dr-custom { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--ink-soft); cursor: pointer; }
  .dr-custom input { width: 36px; height: 32px; border: 0; padding: 0; background: none; cursor: pointer; }
  .dr-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: .9rem; }
  .dr-size { display: flex; align-items: center; gap: 8px; }
  .dr-size input { width: 160px; }
  .dr-fill { display: flex; align-items: center; gap: 6px; }
  .dr-fill input { width: 18px; height: 18px; }

function tone(freqs, dur = .12, type = "triangle", vol = .12) {

function sourceFor(set) {
  const v = VOCAB.map(x => () => vocabQuestion(x));
  const q = QUIZ.map(x => () => quizQuestion(x));
  const g = [...GRAPES_FACTS, ...GRAPES_DEF_QS].map(x => () => grapesQuestion(x));
  const math = [...MATH_GENS, ...MATH_GENS].map(gen => () => mathQuestion(gen));
  const mathhard = [...MATH_HARD_GENS, ...MATH_HARD_GENS].map(gen => () => mathQuestion(gen));
  const sci = SCIENCE.map(x => () => bankQuestion("Science")(x));
  const health = HEALTH.map(x => () => bankQuestion("Health")(x));
  const ela = ELA.map(x => () => bankQuestion("Reading & Writing")(x));
  const art = ART.map(x => () => bankQuestion("Art")(x));
  return { all: [...v, ...q, ...g], vocab: v, quiz: q, grapes: g, math, mathhard, science: sci, health, ela, art,
    mix: [...v, ...q, ...g, ...math, ...mathhard, ...sci, ...health, ...ela, ...art] }[set];
}

function makeDeck(set) {
  const src = sourceFor(set);
  const deck = { queue: shuffle(src) };
  deck.next = () => { if (!deck.queue.length) deck.queue = shuffle(src); return deck.queue.shift(); };
  // A missed question comes back a few questions later so it sticks.
  deck.retry = maker => deck.queue.splice(Math.min(deck.queue.length, 3 + Math.floor(Math.random() * 3)), 0, maker);
  return deck;
}

function startDig() {

  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const t = { dug: r === 0, boulder: r > 0 && Math.random() < .07, res: null, art: -1 };
      t.hp = fullHp(r, t);
      grid[r].push(t);
    }
  }
  const startC = Math.floor(COLS / 2);
  const freeCell = L => {
    const rows = layerRows(L);
    let r, c, n = 0;
    do { r = rows[rnd(0, rows.length - 1)]; c = rnd(0, COLS - 1); n++; }
    while ((grid[r][c].res || grid[r][c].art >= 0 || (r === 1 && c === startC)) && n < 500);
    return grid[r][c];
  };
  ARTIFACTS.forEach((a, i) => { freeCell(a.layer).art = i; });
  Object.entries(RES).forEach(([k, R]) => {
    const total = R.layers.reduce((a, b) => a + b, 0);
    for (let i = 0; i < Math.round(R.count * (hard() ? .7 : 1)); i++) {
      let roll = Math.random() * total, L = 0;
      while (roll >= R.layers[L]) { roll -= R.layers[L]; L++; }

  document.getElementById("dgrid").addEventListener("click", e => { const b = e.target.closest(".cell"); if (b) tapTile(+b.dataset.r, +b.dataset.c); });

function ensureVisible(force) {

  if (!site || !me) return;
  const x = me.offsetLeft, y = me.offsetTop, m = 70;
  if (force || x < site.scrollLeft + m || x > site.scrollLeft + site.clientWidth - m) site.scrollLeft = x - site.clientWidth / 2;

function moveTo(r, c) {

}

function reachable(tr, tc) {
  const seen = new Set([D.pos.join()]), q = [D.pos];
  while (q.length) {
    const [r, c] = q.shift();
    if (r === tr && c === tc) return true;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && D.grid[nr][nc].dug && !seen.has(nr + "," + nc)) { seen.add(nr + "," + nc); q.push([nr, nc]); }
    });
  }
  return false;
}

function tapTile(r, c) {
  if (D.over || D.asking || r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  const t = D.grid[r][c];
  if (t.dug) { if (reachable(r, c)) moveTo(r, c); return; }
  if (Math.abs(r - D.pos[0]) + Math.abs(c - D.pos[1]) !== 1) return toast("Dig a tile right next to your Gim.");
  if (t.res && RES[t.res].tier > D.tier) return toast(`${RES[t.res].name} is too hard. Craft a ${TOOLS[RES[t.res].tier].name} first!`);
  t.hp -= tool().power;
  tone([300, 240], .05, "square", .04);
  if (t.hp > 0) return paintCell(r, c);
  t.dug = true;
  if (t.res) { D.inv[t.res]++; sfx.right(); toast(`+1 ${RES[t.res].name}`); }
  moveTo(r, c);
  if (t.art >= 0) { D.found.push(t.art); updateMuseum(); showFind(t.art); }
}

// A little seeded random so each building keeps the same windows every frame.
const srand = seed => () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
function slopeSeg(i) {
  if (i < 0) return { gaps: [], blocks: [], bars: [], glass: false, crystals: [] };
  while (S.segs.length <= i) {
    const n = S.segs.length, d = Math.min(1, n / 700 + (S.hard ? .35 : 0));
    const seg = { gaps: [], blocks: [], bars: [], glass: false, crystals: [] };
    // City buildings on both sides of the road, every few segments
    if (n % 3 === 0) {
      const r = srand(n * 7919 + 13);
      seg.bld = [-1, 1].map(side => ({ side, w: 1.4 + r() * 2.2, h: 2.5 + r() * 9, hue: 190 + r() * 120, seed: Math.floor(r() * 1e6) + 1, depth: 2 + Math.floor(r() * 2) }));
    }
    const spacing = d > .6 ? 3 : 4;
    if (n > 25 && n - S.lastObs >= spacing && Math.random() < (S.hard ? .3 : .18) + .32 * d) {
      S.lastObs = n;
      const roll = Math.random();
      if (roll < .4) { // walls: steer around
        const w = .8 + Math.random() * (.6 + .6 * d), x0 = -HW + Math.random() * (2 * HW - w);
        seg.blocks.push([x0, x0 + w]);
        if (d > .4 && Math.random() < .35) { const x1 = x0 > 0 ? -HW + Math.random() * .6 : HW - .6 - Math.random() * .6; seg.blocks.push([x1, x1 + .6]); }
      } else if (roll < .6) { // low barrier across the road: jump!
        seg.bars.push([-HW, HW]);
      } else if (roll < .82) { // gaps: go around or jump
        const kind = Math.random();
        if (kind < .3 + .3 * d) seg.gaps.push([-HW - 1, HW + 1]);
        else { const w = 1 + Math.random() * (.8 + .6 * d); seg.gaps.push(kind < .65 ? [-HW - 1, -HW + w] : [HW - w, HW + 1]); }
      } else seg.glass = true; // glass gate: smash right through it
    } else if (n > 15 && Math.random() < .22) {
      const x = -HW + .5 + Math.random() * (2 * HW - 1);
      seg.crystals.push({ x, got: false });
    }
    S.segs.push(seg);
  }
  return S.segs[i];
}

  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  keyHandler = null;
  const seen = store.get("seen", {}); seen[id] = true; store.set("seen", seen);
  $app.innerHTML = `
    <div class="panel slope-wrap">
      <div class="topline"><span class="label">${title}</span><span class="soft" id="m-score"></span><button class="iconbtn" id="m-home">Back to menu</button></div>
      <div class="slope-stage mini-stage" id="m-stage"><canvas id="m-cv"></canvas>
        <div class="slope-over" id="m-over"><h2>${title}</h2><p>${help}</p><button class="btn go" id="m-go">Start</button></div>
      </div>
      <div id="m-pad"></div>
    </div>`;
  document.getElementById("m-home").addEventListener("click", showHome);
  M = { raf: 0, running: false };
  const cv = document.getElementById("m-cv"), stage = document.getElementById("m-stage");
  return { cv, stage };
}
function miniOver(id, title, score, unit) {
  M.running = false;
  id = bestKey(id);
  const best = store.get("best", {}), nb = !best[id] || score > best[id];
  if (nb) { best[id] = score; store.set("best", best); }
  const o = document.getElementById("m-over");
  o.innerHTML = `<h2>${title}</h2><p class="big money">${score}</p><p>${unit} · ${nb ? "New best!" : `Best: ${best[id]}`}</p><div class="row" style="justify-content:center"><button class="btn go" id="m-go">Play again</button><button class="btn" id="m-menu">Menu</button></div>`;
  o.hidden = false;
  document.getElementById("m-menu").addEventListener("click", showHome);
  return document.getElementById("m-go");
}

/* Neon Snake */
function startSnake() {
  const { cv, stage } = miniShell("snake", "Neon Snake", "Use the arrow keys or WASD, swipe on the board, or tap the arrow buttons.<br>It speeds up as you grow! On Easy you can go through the walls.");
  const N = 20;
  document.getElementById("m-pad").innerHTML = `<div class="dpad"><button class="btn" data-d="0,-1" aria-label="Up">▲</button><button class="btn" data-d="-1,0" aria-label="Left">◀</button><button class="btn" data-d="1,0" aria-label="Right">▶</button><button class="btn" data-d="0,1" aria-label="Down">▼</button></div>`;
  M.rs = () => {
    const w = Math.min(stage.clientWidth, 520), dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = w * dpr; cv.style.width = w + "px"; cv.style.height = w + "px";
    M.cell = w / N; M.ctx = cv.getContext("2d"); M.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  };
  const turn = (dx, dy) => { const [cx, cy] = M.dirQ.at(-1) || M.dir; if (cx === -dx && cy === -dy) return; if (M.dirQ.length < 3) M.dirQ.push([dx, dy]); };
  M.kd = e => {
    const k = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (k) { e.preventDefault(); if (M.running) turn(...k); }
    if ((e.key === " " || e.key === "Enter") && !M.running) { e.preventDefault(); go(); }
  };
  window.addEventListener("keydown", M.kd);
  window.addEventListener("resize", M.rs);
  document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); if (M.running) turn(...b.dataset.d.split(",").map(Number)); }));
  let sw = null;
  cv.addEventListener("pointerdown", e => { sw = [e.clientX, e.clientY]; });
  cv.addEventListener("pointerup", e => {
    if (!sw || !M.running) return;
    const dx = e.clientX - sw[0], dy = e.clientY - sw[1]; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  });
  const food = () => { let f; do { f = [rnd(0, N - 1), rnd(0, N - 1)]; } while (M.snake.some(([x, y]) => x === f[0] && y === f[1])); return f; };
  const reset = () => { M.snake = [[9, 10], [8, 10], [7, 10]]; M.dir = [1, 0]; M.dirQ = []; M.food = food(); M.score = 0; M.t = 0; M.dead = false; };
  function draw() {
    const c = M.ctx, s = M.cell, W = s * N;
    if (!c || !M.snake) return;
    c.fillStyle = "#07051a"; c.fillRect(0, 0, W, W);
    c.strokeStyle = "rgba(120,100,255,.08)";
    for (let i = 0; i <= N; i++) { c.beginPath(); c.moveTo(i * s, 0); c.lineTo(i * s, W); c.moveTo(0, i * s); c.lineTo(W, i * s); c.stroke(); }
    c.shadowBlur = 14; c.shadowColor = "#ff3b6b"; c.fillStyle = "#ff3b6b";
    c.beginPath(); c.arc((M.food[0] + .5) * s, (M.food[1] + .5) * s, s * .38, 0, 7); c.fill();
    c.shadowColor = "#42e392";
    M.snake.forEach(([x, y], i) => { c.fillStyle = i === 0 ? "#b8ffd8" : `hsl(${150 - i * 2},80%,${60 - Math.min(i, 20)}%)`; c.fillRect(x * s + 1.5, y * s + 1.5, s - 3, s - 3); });
    c.shadowBlur = 0;
    document.getElementById("m-score").textContent = `Length ${M.snake.length} · Score ${M.score}`;
  }
  function go() {
    reset(); M.running = true; document.getElementById("m-over").hidden = true; M.last = performance.now();
    const loop = t => {
      if (!M || !M.running) return;
      M.t += t - M.last; M.last = t;
      const step = hard() ? Math.max(45, 105 - M.score * 5) : Math.max(85, 160 - M.score * 3);
      while (M.t >= step && M.running) { M.t -= step; tick(); }
      draw();
      if (M && M.running) M.raf = requestAnimationFrame(loop);
    };
    M.raf = requestAnimationFrame(loop);
  }
  function tick() {
    if (M.dirQ.length) M.dir = M.dirQ.shift();
    let [hx, hy] = M.snake[0], nx = hx + M.dir[0], ny = hy + M.dir[1];
    if (!hard()) { nx = (nx + N) % N; ny = (ny + N) % N; }
    const eat = nx === M.food[0] && ny === M.food[1];
    const body = eat ? M.snake : M.snake.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || body.some(([x, y]) => x === nx && y === ny)) {
      sfx.wrong(); draw();
      miniOver("snake", "Game over!", M.score, "food eaten").addEventListener("click", go);
      return;
    }
    M.snake.unshift([nx, ny]);
    if (eat) { M.score++; M.food = food(); tone([880, 1175], .05, "square", .05); }
    else M.snake.pop();
  }
  reset();
  M.rs();
  document.getElementById("m-go").addEventListener("click", go);
}

/* Sky Stack */
function startStack() {
  const { cv, stage } = miniShell("stack", "Sky Stack", "A block slides back and forth. Tap, click, or press Space to drop it.<br>Whatever hangs over the edge gets chopped off. Line it up perfectly to keep it wide!");
  M.rs = () => {
    const w = Math.min(stage.clientWidth, 520), h = Math.round(Math.min(620, Math.max(380, window.innerHeight * .65))), dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
    M.W = w; M.H = h; M.ctx = cv.getContext("2d"); M.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  };
  const BH = 26, me = M;
  const reset = () => {
    const w = (M.W || 400) * .5;
    M.blocks = [{ x: ((M.W || 400) - w) / 2, w, hue: 260 }];
    M.cur = null; M.falling = []; M.score = 0; M.camY = 0; M.perfect = 0;
    spawn();
  };
  const spawn = () => {
    const top = M.blocks.at(-1), fromLeft = M.score % 2 === 0;
    M.cur = { x: fromLeft ? 0 : M.W - top.w, w: top.w, dir: fromLeft ? 1 : -1, speed: hard() ? Math.min(600, 240 + M.score * 15) : Math.min(420, 130 + M.score * 8), hue: (top.hue + 12) % 360 };
  };
  const drop = () => {
    if (!M.running || !M.cur) return;
    const top = M.blocks.at(-1), cur = M.cur;
    const l = Math.max(top.x, cur.x), r = Math.min(top.x + top.w, cur.x + cur.w);
    if (r - l <= 2) { M.falling.push({ ...cur, y: M.blocks.length, vy: 0 }); M.cur = null; sfx.wrong(); return setTimeout(() => { if (M === me) miniOver("stack", "The tower is done!", M.score, "blocks stacked").addEventListener("click", go); }, 700); }
    if (Math.abs(cur.x - top.x) < (hard() ? 4 : 9)) { cur.x = top.x; M.perfect++; tone([660 + M.perfect * 60, 990 + M.perfect * 60], .06, "triangle", .07); if (M.perfect >= 3) cur.w = Math.min(M.W * .6, cur.w + 6); M.blocks.push({ x: cur.x, w: cur.w, hue: cur.hue }); }
    else {
      M.perfect = 0;
      if (cur.x < l) M.falling.push({ x: cur.x, w: l - cur.x, hue: cur.hue, y: M.blocks.length, vy: 0 });
      if (cur.x + cur.w > r) M.falling.push({ x: r, w: cur.x + cur.w - r, hue: cur.hue, y: M.blocks.length, vy: 0 });
      M.blocks.push({ x: l, w: r - l, hue: cur.hue });
      tone([440, 520], .05, "triangle", .06);
    }
    M.score++;
    spawn();
  };
  M.kd = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); M.running ? drop() : go(); } };
  window.addEventListener("keydown", M.kd);
  window.addEventListener("resize", M.rs);
  cv.addEventListener("pointerdown", e => { e.preventDefault(); drop(); });
  function draw() {
    const c = M.ctx;
    if (!c || !M.blocks) return;
    const g = c.createLinearGradient(0, 0, 0, M.H);
    const sky = Math.min(1, M.score / 40);
    g.addColorStop(0, `hsl(${230 + sky * 40},60%,${30 - sky * 22}%)`); g.addColorStop(1, `hsl(${200 + sky * 60},60%,${55 - sky * 35}%)`);
    c.fillStyle = g; c.fillRect(0, 0, M.W, M.H);
    const baseY = M.H - 60, yOf = i => baseY - i * BH + M.camY;
    c.fillStyle = "#2f5a2f"; c.fillRect(0, baseY + BH + M.camY, M.W, M.H);
    const box = (b, y) => {
      c.fillStyle = `hsl(${b.hue},70%,55%)`; c.fillRect(b.x, y, b.w, BH - 2);
      c.fillStyle = `hsl(${b.hue},70%,68%)`; c.fillRect(b.x, y, b.w, 5);
    };
    M.blocks.forEach((b, i) => { const y = yOf(i); if (y > -BH && y < M.H) box(b, y); });
    M.falling.forEach(b => box(b, yOf(b.y) + b.dy || yOf(b.y)));
    if (M.cur) box(M.cur, yOf(M.blocks.length));
    c.fillStyle = "#fff"; c.font = "700 34px Rowdies, system-ui, sans-serif"; c.textAlign = "center";
    c.fillText(M.score, M.W / 2, 50); c.textAlign = "left";
    if (M.perfect >= 2) { c.fillStyle = "#ffd700"; c.font = "700 16px system-ui, sans-serif"; c.textAlign = "center"; c.fillText(`PERFECT ×${M.perfect}`, M.W / 2, 74); c.textAlign = "left"; }
    document.getElementById("m-score").textContent = `Height ${M.score}`;
  }
  function go() {
    reset(); M.running = true; document.getElementById("m-over").hidden = true; M.last = performance.now();
    cancelAnimationFrame(M.raf);
    const loop = t => {
      if (!M) return;
      const dt = Math.min(.05, (t - M.last) / 1000); M.last = t;
      if (M.cur && M.running) {
        M.cur.x += M.cur.dir * M.cur.speed * dt;
        if (M.cur.x > M.W - M.cur.w) M.cur.dir = -1;
        if (M.cur.x < 0) M.cur.dir = 1;
      }
      M.falling.forEach(b => { b.vy = (b.vy || 0) + 1400 * dt; b.dy = (b.dy || 0) + b.vy * dt; });
      M.falling = M.falling.filter(b => b.dy < M.H);
      const want = Math.max(0, (M.blocks.length - 8) * BH);
      M.camY += (want - M.camY) * Math.min(1, dt * 6);
      draw();
      M.raf = requestAnimationFrame(loop);
    };
    M.raf = requestAnimationFrame(loop);
  }
  M.W = Math.min(stage.clientWidth, 520);
  reset();
  M.rs();
  document.getElementById("m-go").addEventListener("click", go);
}

/* ---------- Study mode: a plain 10-question practice round ---------- */
const STUDY_LEN = 10;
function studyTitle() {
  if (choice.subject === "math") return `Math · ${MATH_LEVELS[choice.mlevel].name}`;
  return choice.subject === "ss" ? `Social Studies · ${SETS[choice.set].name}` : SUBJECTS[choice.subject].name;
}
function startStudy() {
  stopSlope(); stopArchers(); stopMini(); closeShop();
  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  const st = { deck: makeDeck(currentSet()), i: 0, right: 0, missed: [] };
  showStudyQuestion(st);
}
function showStudyQuestion(st) {
  const maker = st.deck.next(), q = maker();
  q.maker = maker;
  $app.innerHTML = `
    <div class="panel">
      <div class="topline"><span class="label">${studyTitle()}</span><button class="iconbtn" id="st-home">Back to subjects</button></div>
      <div class="topline"><span>Question ${st.i + 1} of ${STUDY_LEN}</span><span>${st.right} right</span></div>
      <div class="progress"><div style="width:${st.i / STUDY_LEN * 100}%"></div></div>
      ${questionHtml(q)}
      <div id="st-fb"></div>
    </div>`;
  document.getElementById("st-home").addEventListener("click", showHome);
  const tiles = [...$app.querySelectorAll(".tile")];
  const answer = (picked, btn) => {
    const ok = picked === q.a;
    if (ok) { st.right++; sfx.right(); } else { st.missed.push(q); sfx.wrong(); }
    tiles.forEach(t => { t.disabled = true; t.classList.add(t.dataset.v === q.a ? "right" : t === btn ? "wrong" : "dim"); });
    const answerText = q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a);
    const last = st.i === STUDY_LEN - 1;
    document.getElementById("st-fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <strong>${ok ? pick(["Correct!", "Nice work!", "You got it!", "Exactly right!"]) : "Not quite."}</strong>
        ${ok ? "" : `<p>The answer is <b>${answerText}</b>.</p>`}
        <p>${q.why}</p>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn go" id="st-next">${last ? "See results" : "Next question"}</button></div>`;
    const next = document.getElementById("st-next");
    next.focus();
    next.addEventListener("click", () => { st.i++; st.i < STUDY_LEN ? showStudyQuestion(st) : studyResults(st); });
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); next.click(); } };
  };
  tiles.forEach(t => t.addEventListener("click", () => answer(t.dataset.v, t)));
  keyHandler = e => {
    if (q.kind === "mc" && /^[1-4]$/.test(e.key) && tiles[+e.key - 1] && !tiles[0].disabled) tiles[+e.key - 1].click();
    if (q.kind === "grapes") { const t = tiles.find(t => t.dataset.v === e.key.toUpperCase()); if (t && !t.disabled) t.click(); }
  };
  window.scrollTo({ top: 0 });
}
function studyResults(st) {
  keyHandler = null;
  const pct = Math.round(st.right / STUDY_LEN * 100);
  const msg = pct >= 90 ? "Excellent! You really know this." : pct >= 70 ? "Good work. Look over the ones you missed." : "Keep going. Read the missed answers below, then try another round.";
  const missed = st.missed.map(q => `<div class="miss"><b>${q.kind === "grapes" ? q.prompt : q.prompt.replace(/<br>/g, " ")}</b>Answer: ${q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a)}</div>`).join("");
  $app.innerHTML = `
    <div class="panel" style="text-align:center;align-items:center">
      <span class="label">${studyTitle()}</span>
      <div class="big money">${st.right} / ${STUDY_LEN}</div>
      <p>${msg}</p>
    </div>
    <div class="panel">
      ${missed ? `<h3>Study these again</h3><div class="missed">${missed}</div>` : `<h3>Perfect round!</h3>`}
      <div class="row"><button class="btn go" id="st-again">Study 10 more</button><button class="btn" id="st-home">Pick another subject</button></div>
    </div>`;
  document.getElementById("st-again").addEventListener("click", startStudy);
  document.getElementById("st-home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Records where a bigger score is better, or (low = true) where smaller is better.
function record(id, score, low) {
  id = bestKey(id);
  const best = store.get("best", {});
  const nb = best[id] == null || (low ? score < best[id] : score > best[id]);
  if (nb) { best[id] = score; store.set("best", best); }
  return { nb, best: best[id] };
}
function swipe(el, fn) {
  let s = null;
  el.addEventListener("pointerdown", e => { s = [e.clientX, e.clientY]; });
  el.addEventListener("pointerup", e => {
    if (!s) return;
    const dx = e.clientX - s[0], dy = e.clientY - s[1]; s = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    Math.abs(dx) > Math.abs(dy) ? fn(dx > 0 ? "right" : "left") : fn(dy > 0 ? "down" : "up");
  });
}

/* 2048 */
function start2048() {
  const { board } = gameShell("2048", "Use the arrow keys or WASD, or swipe on the board.<br>When two tiles with the same number touch, they join into one!", true);
  board.classList.add("b2048");
  const empty = () => M.grid.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const add = () => { const e = empty(); if (e.length) M.grid[e[rnd(0, e.length - 1)]] = Math.random() < (hard() ? .65 : .9) ? 2 : 4; };
  const LINES = {
    left: [0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => r * 4 + c)),
    right: [0, 1, 2, 3].map(r => [3, 2, 1, 0].map(c => r * 4 + c)),
    up: [0, 1, 2, 3].map(c => [0, 1, 2, 3].map(r => r * 4 + c)),
    down: [0, 1, 2, 3].map(c => [3, 2, 1, 0].map(r => r * 4 + c))
  };
  const canMove = () => empty().length || M.grid.some((v, i) => (i % 4 < 3 && v === M.grid[i + 1]) || (i < 12 && v === M.grid[i + 4]));
  const render = () => {
    board.innerHTML = M.grid.map(v => `<div class="t2048" style="${v ? `background:hsl(${(Math.log2(v) * 28 + 20) % 360},70%,${Math.max(35, 70 - Math.log2(v) * 3)}%);color:${v <= 4 ? "#2a1a40" : "#fff"}` : ""}">${v || ""}</div>`).join("");
    document.getElementById("m-score").textContent = `Score ${M.score} · Best ${store.get("best", {}).g2048 || 0}`;
  };
  const move = dir => {
    if (!M.running) return;
    let moved = false;
    LINES[dir].forEach(line => {
      const vals = line.map(i => M.grid[i]).filter(Boolean), out = [];
      for (let i = 0; i < vals.length; i++) {
        if (vals[i] === vals[i + 1]) { out.push(vals[i] * 2); M.score += vals[i] * 2; if (vals[i] * 2 === 2048 && !M.won) { M.won = true; toast("You made 2048! Keep going!"); } i++; }
        else out.push(vals[i]);
      }
      while (out.length < 4) out.push(0);
      line.forEach((idx, k) => { if (M.grid[idx] !== out[k]) moved = true; M.grid[idx] = out[k]; });
    });
    if (!moved) return;
    tone([520, 660], .04, "triangle", .04);
    add();
    if (hard() && ++M.mv % 4 === 0) add(); // Hard: an extra tile drops in every 4th move
    render();

/* Minesweeper */
function startMines() {
  const { board } = gameShell("Minesweeper", "Tap a square to dig it. Numbers tell you how many mines touch that square.<br>Flag mines with a long press, a right-click, or Flag mode. Clear every safe square to win!", true);
  board.classList.add("bmines");
  const N = 9;
  let MINES = 10;
  document.getElementById("m-pad").innerHTML = `<div class="row" style="justify-content:center"><button class="btn" id="flagmode" aria-pressed="false">Flag mode: off</button></div>`;
  const fm = document.getElementById("flagmode");
  fm.addEventListener("click", () => { M.flagMode = !M.flagMode; fm.textContent = `Flag mode: ${M.flagMode ? "on" : "off"}`; fm.setAttribute("aria-pressed", M.flagMode); });
  const nbrs = i => { const r = Math.floor(i / N), c = i % N, out = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const nr = r + dr, nc = c + dc; if ((dr || dc) && nr >= 0 && nr < N && nc >= 0 && nc < N) out.push(nr * N + nc); } return out; };
  const plant = safe => {
    const avoid = new Set([safe, ...nbrs(safe)]);
    let placed = 0;
    while (placed < MINES) { const i = rnd(0, N * N - 1); if (!M.cells[i].mine && !avoid.has(i)) { M.cells[i].mine = true; placed++; } }
    M.cells.forEach((c, i) => { c.n = nbrs(i).filter(j => M.cells[j].mine).length; });
  };
  const COLORS = ["", "#5aa9ff", "#42e392", "#ff5a6e", "#c94cff", "#ffb02e", "#00e5ff", "#fff", "#aaa"];
  const render = () => {
    board.innerHTML = M.cells.map((c, i) => {
      const txt = c.open ? (c.mine ? "✸" : c.n || "") : c.flag ? "⚑" : "";
      return `<button class="mcell${c.open ? " open" : ""}${c.open && c.mine ? " boom" : ""}${c.flag && !c.open ? " flag" : ""}" data-i="${i}" style="${c.open && c.n && !c.mine ? `color:${COLORS[c.n]}` : ""}">${txt}</button>`;
    }).join("");
    const flags = M.cells.filter(c => c.flag).length;
    document.getElementById("m-score").textContent = `Mines ${MINES - flags} · Time ${M.secs}s`;
    board.querySelectorAll(".mcell").forEach(b => {
      const i = +b.dataset.i;
      let t = null, longed = false;
      b.addEventListener("pointerdown", () => { longed = false; t = setTimeout(() => { longed = true; toggleFlag(i); }, 450); });
      b.addEventListener("pointerup", () => { clearTimeout(t); if (!longed) (M.flagMode ? toggleFlag : dig)(i); });
      b.addEventListener("pointerleave", () => clearTimeout(t));
      b.addEventListener("contextmenu", e => { e.preventDefault(); clearTimeout(t); if (!longed) toggleFlag(i); longed = true; });
    });
  };
  const toggleFlag = i => { const c = M.cells[i]; if (!M.running || c.open) return; c.flag = !c.flag; tone([400], .04, "square", .04); render(); };
  const dig = i => {
    const c = M.cells[i];
    if (!M.running || c.open || c.flag) return;
    if (!M.started) { M.started = true; plant(i); M.timer = setInterval(() => { if (M) { M.secs++; document.getElementById("m-score").textContent = `Mines ${MINES - M.cells.filter(c => c.flag).length} · Time ${M.secs}s`; } }, 1000); }
    if (c.mine) { M.cells.forEach(x => { if (x.mine) x.open = true; }); sfx.wrong(); render(); return overScreen("Boom!", M.secs + "s", "You hit a mine. Try again!", go); }
    const stack = [i];
    while (stack.length) { const j = stack.pop(), x = M.cells[j]; if (x.open || x.flag) continue; x.open = true; if (!x.n) stack.push(...nbrs(j)); }
    tone([700], .03, "triangle", .04);
    render();
    if (M.cells.every(x => x.mine || x.open)) { sfx.buy(); const r = record("mines", M.secs, true); overScreen("You cleared the field!", M.secs + "s", r.nb ? "New fastest time!" : `Best: ${r.best}s`, go); }
  };
  function go() { MINES = hard() ? 18 : 10; clearInterval(M.timer); M.cells = [...Array(N * N)].map(() => ({ mine: false, n: 0, open: false, flag: false })); M.started = false; M.secs = 0; M.running = true; document.getElementById("m-over").hidden = true; render(); }
  M.cells = [...Array(N * N)].map(() => ({ mine: false, n: 0, open: false, flag: false })); M.secs = 0; render();
  document.getElementById("m-go").addEventListener("click", go);
}

/* Brick Breaker */
function startBricks() {
  const { cv, stage } = gameShell("Brick Breaker", "Move the paddle with your mouse, your finger, or the arrow keys.<br>Don't let the ball fall! Easy gives you a wide paddle and 5 lives. Hard is faster with a small paddle.");
  const W = 480, H = 640, COLS = 8, ROWS = 6, BW = W / COLS, BH = 22;
  M.rs = () => {
    const w = Math.min(stage.clientWidth, 480), h = w * H / W, dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
    M.ctx = cv.getContext("2d"); M.ctx.setTransform(dpr * w / W, 0, 0, dpr * w / W, 0, 0); M.k = W / w;
    draw();
  };
  window.addEventListener("resize", M.rs);
  const keys = { l: false, r: false };
  M.kd = e => {
    if (["ArrowLeft", "a", "A"].includes(e.key)) { keys.l = e.type === "keydown"; e.preventDefault(); }
    if (["ArrowRight", "d", "D"].includes(e.key)) { keys.r = e.type === "keydown"; e.preventDefault(); }
    if (e.type === "keydown" && e.key === " " && M.stuck) { e.preventDefault(); launch(); }
  };
  window.addEventListener("keydown", M.kd);
  M.ku = e => M.kd(e);
  window.addEventListener("keyup", M.ku);
  cv.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(); M.px = Math.max(M.phw, Math.min(W - M.phw, (e.clientX - r.left) * W / r.width)); });
  cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect(); M.px = (e.clientX - r.left) * W / r.width; if (M.stuck) launch(); });
  const level = n => {
    M.bricks = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (n === 1 || Math.random() < .85) M.bricks.push({ x: c * BW + 2, y: 70 + r * (BH + 4), hp: r < Math.min(3, n - 1) ? 2 : 1, hue: r * 40 + n * 25 });
    M.speed = hard() ? 380 + n * 50 : 250 + n * 30; M.stuck = true;
  };
  const launch = () => { M.stuck = false; const a = -Math.PI / 2 + (Math.random() - .5) * .8; M.bvx = Math.cos(a) * M.speed; M.bvy = Math.sin(a) * M.speed; };
  function draw() {
    const c = M.ctx; if (!c || !M.bricks) return;
    c.fillStyle = "#0b0820"; c.fillRect(0, 0, W, H);
    M.bricks.forEach(b => { c.fillStyle = `hsl(${b.hue % 360},75%,${b.hp > 1 ? 40 : 58}%)`; c.fillRect(b.x, b.y, BW - 4, BH); });
    c.fillStyle = "#e7f2ff"; c.fillRect(M.px - M.phw, H - 40, M.phw * 2, 12);
    c.fillStyle = "#ffc93c"; c.beginPath(); c.arc(M.bx, M.by, 7, 0, 7); c.fill();
    c.fillStyle = "#fff"; c.font = "16px system-ui, sans-serif"; c.fillText(`Score ${M.score}   Lives ${M.lives}   Level ${M.lvl}`, 12, 26);
    if (M.stuck && M.running) { c.textAlign = "center"; c.fillText("Tap or press Space to launch", W / 2, H / 2); c.textAlign = "left"; }
  }
  function step(dt) {
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (dir) M.px = Math.max(M.phw, Math.min(W - M.phw, M.px + dir * 420 * dt));
    if (M.stuck) { M.bx = M.px; M.by = H - 48; return; }
    M.bx += M.bvx * dt; M.by += M.bvy * dt;
    if (M.bx < 7) { M.bx = 7; M.bvx = Math.abs(M.bvx); }
    if (M.bx > W - 7) { M.bx = W - 7; M.bvx = -Math.abs(M.bvx); }
    if (M.by < 7) { M.by = 7; M.bvy = Math.abs(M.bvy); }
    if (M.bvy > 0 && M.by > H - 47 && M.by < H - 28 && Math.abs(M.bx - M.px) < M.phw + 7) {
      const off = (M.bx - M.px) / (M.phw + 7), a = -Math.PI / 2 + off * 1.05, sp = Math.hypot(M.bvx, M.bvy);
      M.bvx = Math.cos(a) * sp; M.bvy = Math.sin(a) * sp; tone([440], .03, "square", .04);
    }
    for (const b of M.bricks) {
      if (M.bx + 7 > b.x && M.bx - 7 < b.x + BW - 4 && M.by + 7 > b.y && M.by - 7 < b.y + BH) {
        const ox = Math.min(M.bx + 7 - b.x, b.x + BW - 4 - (M.bx - 7)), oy = Math.min(M.by + 7 - b.y, b.y + BH - (M.by - 7));
        if (ox < oy) M.bvx = -M.bvx; else M.bvy = -M.bvy;
        b.hp--; if (b.hp <= 0) { M.score += 10 * M.lvl; } tone([880], .03, "triangle", .05);
        break;
      }
    }
    M.bricks = M.bricks.filter(b => b.hp > 0);
    if (!M.bricks.length) { M.lvl++; sfx.buy(); level(M.lvl); }
    if (M.by > H + 10) {
      M.lives--; sfx.wrong();
      if (M.lives <= 0) { const r = record("bricks", M.score); return overScreen("Game over!", M.score, r.nb ? "New best score!" : `Best: ${r.best}`, go); }
      M.stuck = true;
    }
  }
  function go() {
    M.phw = hard() ? 32 : 55; M.score = 0; M.lives = hard() ? 3 : 5; M.lvl = 1; M.px = W / 2; level(1); M.running = true; document.getElementById("m-over").hidden = true;
    M.last = performance.now(); cancelAnimationFrame(M.raf);
    const loop = t => { if (!M || !M.running) return; const dt = Math.min(.03, (t - M.last) / 1000); M.last = t; step(dt); draw(); if (M && M.running) M.raf = requestAnimationFrame(loop); };
    M.raf = requestAnimationFrame(loop);
  }
  M.phw = 55; M.px = W / 2; M.bx = W / 2; M.by = H - 48; M.score = 0; M.lives = 3; M.lvl = 1; level(1);
  M.rs();
  document.getElementById("m-go").addEventListener("click", go);
}

    c.fillStyle = "rgba(255,255,255,.7)"; [[60, 90], [250, 150], [330, 60]].forEach(([x, y]) => { const cx = ((x - M.t * 20) % (W + 120) + W + 120) % (W + 120) - 60; c.beginPath(); c.ellipse(cx, y, 40, 14, 0, 0, 7); c.fill(); });

    c.fillStyle = "#ff7a3d"; c.beginPath(); c.moveTo(14, 1); c.lineTo(26, 5); c.lineTo(14, 9); c.fill();

function canvasFit(cv, stage, W, H, maxW) {

  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr * w / W, 0, 0, dpr * w / W, 0, 0);
  return ctx;
}
function runLoop(step, draw) {
  M.last = performance.now(); cancelAnimationFrame(M.raf);
  const loop = t => { if (!M || !M.running) return; const dt = Math.min(.03, (t - M.last) / 1000); M.last = t; step(dt); if (!M) return; draw(); if (M.running) M.raf = requestAnimationFrame(loop); };

    stars.forEach(s => { c.fillStyle = `rgba(255,255,255,${s[2] / 2})`; c.fillRect(s[0], s[1], s[2], s[2]); });
    M.aliens.forEach(a => {
      c.fillStyle = `hsl(${a.hue},80%,${a.hp > 1 ? 45 : 62}%)`;
      c.beginPath(); c.ellipse(a.x, a.y, 18, 11, 0, 0, 7); c.fill();
      c.fillRect(a.x - 16, a.y + 4, 6, 9); c.fillRect(a.x + 10, a.y + 4, 6, 9);
      c.fillStyle = "#050314"; c.fillRect(a.x - 8, a.y - 4, 5, 5); c.fillRect(a.x + 3, a.y - 4, 5, 5);
    });
    c.fillStyle = "#7df9ff"; M.shots.forEach(s => c.fillRect(s.x - 2, s.y - 10, 4, 12));
    c.fillStyle = "#ff5a6e"; M.bombs.forEach(b => { c.beginPath(); c.arc(b.x, b.y, 5, 0, 7); c.fill(); });
    if (!(M.hurt > 0 && Math.floor(M.hurt * 10) % 2)) {
      c.fillStyle = "#e7f2ff"; c.beginPath(); c.moveTo(M.sx, H - 70); c.lineTo(M.sx + 22, H - 34); c.lineTo(M.sx - 22, H - 34); c.closePath(); c.fill();
      c.fillStyle = "#ffc93c"; c.fillRect(M.sx - 4, H - 34, 8, 6);
    }
    M.booms.forEach(b => { c.strokeStyle = `rgba(255,200,80,${1 - b.t / .4})`; c.lineWidth = 3; c.beginPath(); c.arc(b.x, b.y, 8 + b.t * 60, 0, 7); c.stroke(); });
    c.fillStyle = "#fff"; c.font = "16px system-ui, sans-serif"; c.fillText(`Score ${M.score}   Lives ${M.lives}   Wave ${M.wave}`, 12, 26);
  }
  function step(dt) {
    stars.forEach(s => { s[1] += s[2] * 30 * dt; if (s[1] > H) s[1] = 0; });
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (dir) M.sx = Math.max(20, Math.min(W - 20, M.sx + dir * 360 * dt));
    M.hurt = Math.max(0, M.hurt - dt);
    if ((M.cool -= dt) <= 0) { M.shots.push({ x: M.sx, y: H - 72 }); M.cool = .28; }
    M.shots.forEach(s => { s.y -= 600 * dt; });
    let edge = false;
    M.aliens.forEach(a => { a.x += M.dir * M.aSpeed * dt; if (a.x > W - 22 || a.x < 22) edge = true; });
    if (edge) { M.dir *= -1; M.aliens.forEach(a => { a.y += 18; }); }
    if ((M.fireT -= dt) <= 0 && M.aliens.length) { const a = M.aliens[rnd(0, M.aliens.length - 1)]; M.bombs.push({ x: a.x, y: a.y + 12 }); M.fireT = M.fireRate * (.5 + Math.random()); }
    M.bombs.forEach(b => { b.y += (220 + M.wave * 15) * dt; });
    M.shots = M.shots.filter(s => {
      if (s.y < -20) return false;
      const a = M.aliens.find(a => Math.abs(a.x - s.x) < 20 && Math.abs(a.y - s.y) < 14);
      if (!a) return true;
      a.hp--; if (a.hp <= 0) { M.score += 10 * M.wave; M.booms.push({ x: a.x, y: a.y, t: 0 }); tone([300, 150], .04, "square", .04); }
      return false;
    });
    M.aliens = M.aliens.filter(a => a.hp > 0);
    M.booms = M.booms.filter(b => (b.t += dt) < .4);
    const hitShip = b => Math.abs(b.x - M.sx) < 20 && b.y > H - 70 && b.y < H - 30;
    if (M.hurt <= 0 && (M.bombs.some(hitShip) || M.aliens.some(a => a.y > H - 90))) {
      M.lives--; M.hurt = 1.5; sfx.wrong(); M.bombs = [];
      if (M.aliens.some(a => a.y > H - 90)) M.aliens.forEach(a => { a.y -= 120; });
      if (M.lives <= 0) { const r = record("galaxy", M.score); return overScreen("Game over!", M.score, r.nb ? "New best score!" : `Best: ${r.best}`, go); }
    }
    M.bombs = M.bombs.filter(b => b.y < H + 10 && !(M.hurt === 1.5 && hitShip(b)));
    if (!M.aliens.length) { M.wave++; sfx.buy(); wave(M.wave); }
  }
  function go() {
    Object.assign(M, { sx: W / 2, score: 0, lives: hard() ? 3 : 5, wave: 1, shots: [], bombs: [], booms: [], cool: 0, fireT: 1, hurt: 0, running: true });
    wave(1); document.getElementById("m-over").hidden = true; runLoop(step, draw);
  }
  Object.assign(M, { sx: W / 2, score: 0, lives: 3, wave: 1, shots: [], bombs: [], booms: [], hurt: 0 }); wave(1);
  M.rs();
  document.getElementById("m-go").addEventListener("click", go);
}

/* Whack-a-Mole */
function startWhack() {
  const { board } = gameShell("Whack-a-Mole", "Tap the moles as fast as you can before they hide! You have 30 seconds.<br>Don't tap the bombs. They cost you 3 points.", true);
  board.classList.add("bwhack");
  board.innerHTML = [...Array(9)].map((_, i) => `<button class="hole" data-i="${i}" aria-label="Hole ${i + 1}"><span class="mole"></span></button>`).join("");
  const holes = [...board.querySelectorAll(".hole")];
  const setHud = () => { document.getElementById("m-score").textContent = `Score ${M.score} · Time ${Math.ceil(M.left)}s`; };
  holes.forEach((h, i) => h.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!M.running || !M.up[i]) return;
    const kind = M.up[i].kind; M.up[i] = null; h.className = "hole bonk";
    if (kind === "bomb") { M.score = Math.max(0, M.score - 3); sfx.wrong(); } else { M.score += kind === "gold" ? 3 : 1; tone([kind === "gold" ? 1046 : 784], .05, "square", .05); }
    setTimeout(() => { if (h.className === "hole bonk") h.className = "hole"; }, 180);
    setHud();
  }));
  function step(dt) {
    M.left -= dt; M.spawn -= dt;
    M.up.forEach((u, i) => { if (u && (u.t -= dt) <= 0) { M.up[i] = null; holes[i].className = "hole"; } });
    if (M.spawn <= 0) {
      const free = M.up.map((u, i) => u ? -1 : i).filter(i => i >= 0);
      if (free.length) {
        const i = free[rnd(0, free.length - 1)], roll = Math.random();
        const kind = roll < (hard() ? .2 : .07) ? "bomb" : roll < (hard() ? .28 : .2) ? "gold" : "mole";
        const stay = hard() ? Math.max(.35, .85 - (30 - M.left) * .02) : Math.max(.75, 1.45 - (30 - M.left) * .02);
        M.up[i] = { kind, t: stay }; holes[i].className = `hole up ${kind}`;
      }
      M.spawn = hard() ? Math.max(.22, .6 - (30 - M.left) * .015) : Math.max(.45, .9 - (30 - M.left) * .012);
    }
    setHud();
    if (M.left <= 0) { M.left = 0; holes.forEach(h => { h.className = "hole"; }); const r = record("whack", M.score); overScreen("Time's up!", M.score, r.nb ? "New best score!" : `Best: ${r.best}`, go); }
  }
  function go() { Object.assign(M, { score: 0, left: 30, spawn: .4, up: Array(9).fill(null), running: true }); holes.forEach(h => { h.className = "hole"; }); document.getElementById("m-over").hidden = true; runLoop(step, () => {}); }
  M.score = 0; M.left = 30;
  setHud();
  document.getElementById("m-go").addEventListener("click", go);
}

/* Connect Four vs the computer */
function startConnect4() {
  const { board } = gameShell("Connect Four", "Drop pieces and get four in a row to win!<br>Play the computer, or a friend on this device.", true);
  document.getElementById("m-go").outerHTML = `<div class="row" style="justify-content:center"><button class="btn go" id="m-go">vs Computer</button><button class="btn gold" id="m-go2">2 players</button></div>`;
  M.mode = "cpu";
  board.classList.add("bc4");
  const me = M;
  const C = 7, R = 6;
  const winner = (g, p) => {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      let k = 0; while (k < 4) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= R || cc < 0 || cc >= C || g[rr][cc] !== p) break; k++; }
      if (k === 4) return [...Array(4)].map((_, j) => [r + dr * j, c + dc * j]);
    }
    return null;
  };
  const drop = (g, c, p) => { for (let r = R - 1; r >= 0; r--) if (!g[r][c]) { g[r][c] = p; return r; } return -1; };
  const valid = g => [...Array(C).keys()].filter(c => !g[0][c]);
  const cpuMove = () => {
    const g = M.g, cols = valid(g);
    const tryCol = (c, p) => { const cp = g.map(r => r.slice()); drop(cp, c, p); return cp; };
    for (const c of cols) if (winner(tryCol(c, 2), 2)) return c;
    if (!hard() && Math.random() < .55) return cols[rnd(0, cols.length - 1)];
    for (const c of cols) if (winner(tryCol(c, 1), 1)) return c;
    const safe = cols.filter(c => { const cp = tryCol(c, 2); return !valid(cp).some(c2 => { const cp2 = cp.map(r => r.slice()); drop(cp2, c2, 1); return winner(cp2, 1); }); });
    const pool = safe.length ? safe : cols;
    const score = c => 4 - Math.abs(3 - c) + Math.random() * 2.5;
    return pool.sort((a, b) => score(b) - score(a))[0];
  };
  const render = () => {
    const win = M.win || [];
    board.innerHTML = [...Array(C).keys()].map(c => `<button class="c4col" data-c="${c}" aria-label="Drop in column ${c + 1}">${[...Array(R).keys()].map(r => `<span class="c4cell ${M.g[r][c] === 1 ? "red" : M.g[r][c] === 2 ? "yellow" : ""}${win.some(([wr, wc]) => wr === r && wc === c) ? " win" : ""}"></span>`).join("")}</button>`).join("");
    const st = store.get("best", {});
    document.getElementById("m-score").textContent = `${M.win || !valid(M.g).length ? "Game over" : M.mode === "2p" ? (M.turn === 1 ? "Red's turn" : "Yellow's turn") : M.turn === 1 ? "Your turn" : "Computer is thinking…"}${M.mode === "2p" ? " · 2 players" : ` · Wins ${st.connect4 || 0}`}`;
    board.querySelectorAll(".c4col").forEach(b => b.addEventListener("click", () => play(+b.dataset.c)));
  };
  const finish = (title, line) => setTimeout(() => { if (M === me) overScreen(title, "", line, go); }, 900);
  const play = c => {
    if (M.mode === "2p") return play2(c);
    if (!M.running || M.turn !== 1 || M.g[0][c]) return;
    drop(M.g, c, 1); tone([523], .05, "triangle", .05);
    if ((M.win = winner(M.g, 1))) { M.running = false; render(); sfx.buy(); const best = store.get("best", {}); best.connect4 = (best.connect4 || 0) + 1; store.set("best", best); return finish("You win!", `Total wins: ${best.connect4}`); }
    if (!valid(M.g).length) { M.running = false; render(); return finish("It's a tie!", "Nobody got four in a row."); }
    M.turn = 2; render();
    setTimeout(() => {
      if (M !== me || !M.running) return;
      drop(M.g, cpuMove(), 2); tone([392], .05, "triangle", .05);
      if ((M.win = winner(M.g, 2))) { M.running = false; render(); sfx.wrong(); return finish("The computer wins!", "Try blocking its lines next time."); }
      if (!valid(M.g).length) { M.running = false; render(); return finish("It's a tie!", "Nobody got four in a row."); }
      M.turn = 1; render();
    }, 550);
  };
  // Two players on one device: red and yellow take turns, no computer.
  const play2 = c => {
    if (!M.running || M.g[0][c]) return;
    const p = M.turn;
    drop(M.g, c, p); tone([p === 1 ? 523 : 392], .05, "triangle", .05);
    if ((M.win = winner(M.g, p))) { M.running = false; render(); sfx.buy(); return finish(p === 1 ? "Red wins!" : "Yellow wins!", "Great game! Play again to see who wins next."); }
    if (!valid(M.g).length) { M.running = false; render(); return finish("It's a tie!", "Nobody got four in a row."); }
    M.turn = p === 1 ? 2 : 1; render();
  };
  function go(mode) {
    if (mode === "cpu" || mode === "2p") M.mode = mode;
    M.g = [...Array(R)].map(() => Array(C).fill(0)); M.turn = 1; M.win = null; M.running = true; document.getElementById("m-over").hidden = true; render();
  }
  M.g = [...Array(R)].map(() => Array(C).fill(0)); M.turn = 1; render();
  document.getElementById("m-go").addEventListener("click", () => go("cpu"));
  document.getElementById("m-go2").addEventListener("click", () => go("2p"));
}

/* Simon Says */
function startSimon() {
  const { board } = gameShell("Simon Says", "Watch the colors light up, then tap them back in the same order.<br>Every round adds one more. How long a pattern can you remember?", true);
  board.classList.add("bsimon");
  const me = M;
  const NOTES = [330, 392, 494, 587];
  board.innerHTML = [0, 1, 2, 3].map(i => `<button class="pad p${i}" data-i="${i}" aria-label="${["Green", "Red", "Yellow", "Blue"][i]}"></button>`).join("");
  const pads = [...board.querySelectorAll(".pad")];
  const flash = (i, ms = 380) => { pads[i].classList.add("lit"); tone([NOTES[i]], ms / 1000 * .6, "sine", .1); setTimeout(() => pads[i].classList.remove("lit"), ms); };
  const hud = txt => { document.getElementById("m-score").textContent = txt; };
  const showSeq = () => {
    M.input = false; M.pos = 0;
    hud(`Round ${M.seq.length} · Watch…`);
    const speed = hard() ? Math.max(170, 400 - M.seq.length * 25) : Math.max(320, 650 - M.seq.length * 15);
    M.seq.forEach((p, k) => setTimeout(() => { if (M === me && M.running) flash(p, speed * .8); }, 600 + k * speed));
    setTimeout(() => { if (M === me && M.running) { M.input = true; hud(`Round ${M.seq.length} · Your turn!`); } }, 600 + M.seq.length * speed);
  };
  pads.forEach((pd, i) => pd.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!M.running || !M.input) return;
    flash(i, 220);
    if (i !== M.seq[M.pos]) {
      M.input = false; sfx.wrong();
      const score = M.seq.length - 1, r = record("simon", score);
      return setTimeout(() => M === me && overScreen("Oops!", score, `rounds completed · ${r.nb ? "New best!" : `Best: ${r.best}`}`, go), 500);
    }
    M.pos++;
    if (M.pos === M.seq.length) { M.input = false; M.seq.push(rnd(0, 3)); setTimeout(() => { if (M === me) showSeq(); }, 500); }
  }));
  function go() { M.seq = [rnd(0, 3)]; M.running = true; document.getElementById("m-over").hidden = true; showSeq(); }
  hud("Press Start");
  document.getElementById("m-go").addEventListener("click", go);
}

/* Pong */
function startPong() {
  const { cv, stage } = gameShell("Pong", "Move your paddle (on the left) with your finger, the mouse, or the up and down arrow keys.<br>First to 7 points wins!");
  const W = 640, H = 400, PH = 70, WIN = 7;
  M.rs = () => { M.ctx = canvasFit(cv, stage, W, H, 640); draw(); };
  window.addEventListener("resize", M.rs);
  const keys = { u: false, d: false };
  M.kd = e => { if (["ArrowUp", "w", "W"].includes(e.key)) { keys.u = e.type === "keydown"; e.preventDefault(); } if (["ArrowDown", "s", "S"].includes(e.key)) { keys.d = e.type === "keydown"; e.preventDefault(); } };
  M.ku = e => M.kd(e);
  window.addEventListener("keydown", M.kd); window.addEventListener("keyup", M.ku);
  const aim = e => { const r = cv.getBoundingClientRect(); M.py = Math.max(PH / 2, Math.min(H - PH / 2, (e.clientY - r.top) * H / r.height)); };
  cv.addEventListener("pointermove", aim); cv.addEventListener("pointerdown", aim);
  const serve = dir => { M.bx = W / 2; M.by = H / 2; const a = (Math.random() - .5) * .8; M.sp = hard() ? 380 : 280; M.bvx = Math.cos(a) * M.sp * dir; M.bvy = Math.sin(a) * M.sp; M.wait = .8; };
  function draw() {
    const c = M.ctx; if (!c) return;
    c.fillStyle = "#06121f"; c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(255,255,255,.2)"; for (let y = 10; y < H; y += 30) c.fillRect(W / 2 - 2, y, 4, 16);
    c.fillStyle = "#fff"; c.font = "700 44px Rowdies, system-ui, sans-serif"; c.textAlign = "center";
    c.fillText(M.ps, W / 2 - 70, 60); c.fillText(M.cs, W / 2 + 70, 60); c.textAlign = "left";
    c.fillStyle = "#5aa9ff"; c.fillRect(20, M.py - PH / 2, 12, PH);
    c.fillStyle = "#ff5a6e"; c.fillRect(W - 32, M.cy - PH / 2, 12, PH);
    c.fillStyle = "#ffc93c"; c.fillRect(M.bx - 7, M.by - 7, 14, 14);
  }
  function step(dt) {
    const dir = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    if (dir) M.py = Math.max(PH / 2, Math.min(H - PH / 2, M.py + dir * 420 * dt));
    // the computer follows the ball, but not perfectly
    const target = M.bvx > 0 ? M.by : H / 2, cpuSpeed = hard() ? 340 + (M.ps + M.cs) * 10 : 175 + (M.ps + M.cs) * 6;
    M.cy += Math.max(-cpuSpeed * dt, Math.min(cpuSpeed * dt, target - M.cy));
    if (M.wait > 0) { M.wait -= dt; return; }
    M.bx += M.bvx * dt; M.by += M.bvy * dt;
    if (M.by < 7 || M.by > H - 7) { M.bvy = -M.bvy; M.by = Math.max(7, Math.min(H - 7, M.by)); }
    const bounce = (py, side) => {
      const off = (M.by - py) / (PH / 2), a = off * .9; M.sp = Math.min(hard() ? 820 : 600, M.sp * 1.06);
      M.bvx = Math.cos(a) * M.sp * side; M.bvy = Math.sin(a) * M.sp; tone([side > 0 ? 660 : 520], .03, "square", .04);
    };
    if (M.bvx < 0 && M.bx < 39 && M.bx > 18 && Math.abs(M.by - M.py) < PH / 2 + 7) { M.bx = 39; bounce(M.py, 1); }
    if (M.bvx > 0 && M.bx > W - 39 && M.bx < W - 18 && Math.abs(M.by - M.cy) < PH / 2 + 7) { M.bx = W - 39; bounce(M.cy, -1); }
    if (M.bx < -20) { M.cs++; sfx.wrong(); serve(-1); }
    if (M.bx > W + 20) { M.ps++; sfx.right(); serve(1); }
    if (M.ps >= WIN || M.cs >= WIN) {
      const won = M.ps >= WIN;
      if (won) { const best = store.get("best", {}); best.pong = (best.pong || 0) + 1; store.set("best", best); }
      draw();
      overScreen(won ? "You win!" : "The computer wins!", `${M.ps} – ${M.cs}`, won ? `Total wins: ${store.get("best", {}).pong}` : "Try again!", go);
    }
  }
  function go() { Object.assign(M, { ps: 0, cs: 0, py: H / 2, cy: H / 2, running: true }); serve(1); document.getElementById("m-over").hidden = true; runLoop(step, draw); }
  Object.assign(M, { ps: 0, cs: 0, py: H / 2, cy: H / 2, bx: W / 2, by: H / 2 });
  M.rs();
  document.getElementById("m-go").addEventListener("click", go);
}

  document.getElementById("dr-fill").addEventListener("change", e => { DR.fill = e.target.checked; const o = DR.objs[DR.sel]; if (o && o.type !== "path" && o.type !== "line") { pushUndo(); o.fill = DR.fill; saveDraw(); drawAll(); } });
  document.getElementById("dr-undo").addEventListener("click", undoDraw);
  document.getElementById("dr-del").addEventListener("click", deleteSel);
  document.getElementById("dr-dup").addEventListener("click", () => { const o = DR.objs[DR.sel]; if (!o) return; pushUndo(); const c = JSON.parse(JSON.stringify(o)); moveObj(c, 30, 30); DR.objs.push(c); DR.sel = DR.objs.length - 1; saveDraw(); syncDrawUi(); drawAll(); });
  document.getElementById("dr-front").addEventListener("click", () => { const o = DR.objs[DR.sel]; if (!o) return; pushUndo(); DR.objs.splice(DR.sel, 1); DR.objs.push(o); DR.sel = DR.objs.length - 1; saveDraw(); drawAll(); });
  const clear = document.getElementById("dr-clear");
  clear.addEventListener("click", () => {
    if (!clear.dataset.armed) { clear.dataset.armed = "1"; clear.textContent = "Tap again to clear"; setTimeout(() => { if (clear.isConnected) { delete clear.dataset.armed; clear.textContent = "Clear all"; } }, 2500); return; }
    pushUndo(); DR.objs = []; DR.sel = -1; saveDraw(); syncDrawUi(); drawAll();
    delete clear.dataset.armed; clear.textContent = "Clear all";
  });
  keyHandler = e => {
    if ((e.key === "Delete" || e.key === "Backspace") && DR.sel >= 0) { e.preventDefault(); deleteSel(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoDraw(); }
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * DW / r.width, (e.clientY - r.top) * DH / r.height]; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawDown(pos(e)); });
  cv.addEventListener("pointermove", e => { if (DR.act) drawMove(pos(e)); });
