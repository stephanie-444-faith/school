const HS_HELPERS = ["a wise old tortoise", "a chatty parrot", "a friendly giant", "a team of busy ants", "a magical rainbow fish", "a grumpy but kind badger", "a cloud of dancing fireflies", "a kid named Sam", "a talking cloud", "their very best friend"];
const HS_FIXES = ["built a giant ladder out of pancakes", "sang the loudest, happiest song anyone had ever heard", "solved a tricky riddle written on a golden leaf", "followed a trail of glowing footprints", "mixed a potion of sunshine, giggles and one blueberry", "asked everyone in town to help, even the grumpy ones", "used a map, a compass and a whole lot of courage", "taught everyone a brand-new dance", "shared their lunch with a hungry bear who knew the way", "tried 99 times, and on the 100th try, it worked"];
const HS_LESSONS = ["working together makes anything possible", "a little kindness goes a long way", "you should never give up", "being yourself is your superpower", "it's okay to ask for help", "telling the truth is always brave", "being curious leads to amazing adventures", "sharing makes everyone happier", "being brave doesn't mean you aren't scared", "good friends make every day better"];
function hippoStory(q) {
  const pick = a => a[rnd(0, a.length - 1)];
  let hero = HS_HEROES.find(h => h[2].split("|").some(w => new RegExp(`\\b${w}`).test(q)));
  const about = q.match(/about (?:a |an |the )?([a-z ]{3,30})$/);
  if (!hero && about) hero = [`${/^[aeiou]/.test(about[1]) ? "an" : "a"} ${about[1]}`, "✨", ""];
  hero = hero || pick(HS_HEROES);
  const [place, pe] = pick(HS_PLACES), prob = pick(HS_PROBLEMS), helper = pick(HS_HELPERS), fix = pick(HS_FIXES), lesson = pick(HS_LESSONS);
  const Hero = hero[0].replace(/^an? /, "the ");
  const title = `The ${hero[0].replace(/^an? /, "").replace(/ who.*| named.*/, "").replace(/\b\w/g, c => c.toUpperCase())} and the Big Problem`;
  const wrong = pick(["tried shouting at the problem really loudly, but problems don't listen to shouting", "tried ignoring it and taking a nap, but it was still there when they woke up", "tried to fix it with a big pile of tape, which only made a sticky mess", "tried asking the moon for help, but the moon was busy being the moon"]);
  const trip = pick(["They crossed a wobbly rope bridge, waded through a river that tickled their toes, and climbed a hill shaped like a sleeping cat.", "They tiptoed past a snoring giant, hopped across seven stepping stones, and followed a trail of shiny pebbles through a dark forest.", "They rode on the back of a friendly whale, got lost in a field of sunflowers taller than houses, and found their way again by counting the stars.", "They squeezed through a secret tunnel, slid down a waterfall, and shared their lunch with a very hungry raccoon who pointed the way."]);
  const text0 = `Once upon a time, ${hero[0]} lived ${place}. Every day was pretty ordinary… until one morning, ${prob}! Everyone was worried. “Somebody has to do something,” said ${Hero}. So ${Hero.replace(/^the /, "the ")} set off to find ${helper}. Together they thought and thought. Finally, they ${fix}. And guess what? It worked! Everyone cheered, and the whole place threw a giant party. From that day on, ${Hero} always remembered that ${lesson}. The end! 🌟`;
  const sent = text0.split(/(?<=[.!?”])\s+/), cut = Math.ceil(sent.length / 3);
  const text = [sent.slice(0, 3).join(" ") + " It was the kind of place where everybody knew everybody, and the days were full of games and snacks and naps.", sent.slice(3, cut + 2).join(" "), `First, they ${wrong}. “Well,” said ${Hero}, “at least now we know what doesn't work.”`, `So the journey began. ${trip} It was a long way, and sometimes ${Hero} felt like giving up. But every time, ${Hero} took a deep breath and kept going.`, sent.slice(cut + 2).join(" ")].join("\n\n");
  return { title, text, pic: `<div class="hip-pic" style="background:linear-gradient(135deg,#fff3d6,#e8f7e8)"><span>${hero[1]}${pe}</span><small>${esc(title)}</small></div>` };
}
// 📜 Parodies of real classic stories (old tales that are free for everyone), retold Hippo-style
const HIPPO_PARODIES = [
  { t: "The Three Little Hippos and the Big Bad Crocodile", o: "The Three Little Pigs", e: "🦛🦛🦛🐊", k: "three little pigs|little pigs|three little hippos|big bad wolf|huff and puff", p: ["Once upon a time, there were three little hippos who decided it was time to build their very own mud houses.", "The first little hippo was in a hurry to get back to napping, so he built his house out of soggy lily pads. It took him four minutes. “Done!” he yawned.", "The second little hippo was in a hurry to get back to snacking, so she built her house out of floppy river reeds. It took her ten minutes, and she ate half the reeds while she worked.", "The third little hippo took her time. She built her house out of strong river stones and thick, sticky mud. It took her all week. The other two laughed. “You're missing all the fun!”", "That night, along came the Big Bad Crocodile. He knocked on the lily pad house. “Little hippo, little hippo, let me come in!”\n“Not by the hair on my chinny-chin-chin!” said the first hippo. (Hippos do have a few chin hairs. It's true!)\n“Then I'll SPLASH and I'll SPLOSH and I'll wash your house away!” And he did. The first little hippo ran to his sister's reed house.", "The crocodile followed. He splashed and he sploshed, and the reed house floated away like a little boat. Both hippos ran, as fast as hippos can, which is surprisingly fast, to the stone house.", "The crocodile splashed. He sploshed. He splashed and sploshed until he was completely out of breath. But the stone house didn't budge one bit.", "So the crocodile tried to sneak down the chimney. But the third little hippo had a big pot of cold, bubbly swamp soup waiting. SPLOOSH! The crocodile shot back up the chimney, sneezing bubbles, and swam away so fast that nobody in that river ever saw him again.", "After that, the two little hippos helped their sister build a whole street of stone houses, and they learned that doing a job well is worth the wait. (They still napped and snacked a lot, though. They were hippos.) The end! 🏠"] },
  { t: "Goldilocks and the Three Hippos", o: "Goldilocks and the Three Bears", e: "👧🦛🥣", k: "goldilocks|three bears|porridge", p: ["Once upon a time, in a muddy house by the river, there lived three hippos: a great big Papa Hippo, a medium-sized Mama Hippo, and a tiny (well, tiny for a hippo) Baby Hippo.", "One morning, Mama Hippo made three bowls of watermelon porridge. It was too hot to eat, so the family went for a swim while it cooled.", "Just then, a girl named Goldilocks came skipping by. She saw the door open, sniffed the air, and walked right in. (That was not very polite, Goldilocks.)", "She tasted the porridge in the great big bowl. “Too squishy!” She tasted the medium bowl. “Too seedy!” She tasted the tiny bowl. “Just right!” And she ate it all up, seeds and all.", "Then she wanted to sit down. Papa Hippo's chair was a giant rock. “Too hard!” Mama Hippo's chair was a mud puddle. “Too gooey!” Baby Hippo's chair was a soft little log. “Just right!” But when she sat down, CRACK! It broke into pieces.", "Feeling sleepy, Goldilocks went to find a bed. Papa Hippo's bed was at the bottom of the river. “Too wet!” Mama Hippo's bed was a pile of reeds. “Too itchy!” Baby Hippo's bed was a soft bed of moss. “Just right!” And she fell fast asleep.", "Soon the hippos came home. “Someone's been eating my porridge,” rumbled Papa Hippo. “Someone's been sitting in my chair,” said Mama Hippo. “Someone's been sleeping in my bed,” squeaked Baby Hippo, “and SHE'S STILL THERE!”", "Goldilocks woke up and saw three enormous hippos staring at her. She was about to run, but Baby Hippo just said, “Hi! Want to go swimming?”", "So Goldilocks said sorry, helped Papa Hippo fix the little chair, and spent the whole afternoon learning to float like a hippo. And from then on, she always knocked before she went into anyone's house. The end! 🥣"] },
  { t: "The Hippo and the Hare", o: "The Tortoise and the Hare", e: "🦛🐇🏁", k: "tortoise and the hare|tortoise|hare|race|slow and steady", p: ["Once upon a time, there was a hare who was very fast, and very, very proud of it. “Nobody can beat me!” he bragged to everyone at the river. “I'm the fastest animal in the whole world!”", "A hippo named Henrietta was floating nearby. “I'll race you,” she said calmly.", "The hare laughed so hard he fell over. “YOU? A hippo? You're the size of a bus!”\n“Do you want to race or not?” asked Henrietta.", "So the whole river gathered to watch. The course went all the way around the lake and back. The frog shouted, “Ready… set… GO!”", "The hare zoomed off in a cloud of dust. Henrietta started walking. Thump. Thump. Thump. Slow and steady.", "Halfway around the lake, the hare looked back. He couldn't even see Henrietta. “This is too easy,” he said. “I'll take a little nap under this tree.” He curled up and was snoring in seconds.", "Henrietta kept walking. Thump. Thump. Thump. She walked past the sleeping hare. She didn't stop for snacks (well, only one small watermelon). She just kept going.", "The hare woke up when the sun was setting. He heard cheering in the distance. “Oh no!” He ran faster than he had ever run in his life, but it was too late. Henrietta stepped over the finish line, and the whole river went wild.", "The hare was very embarrassed. “How did you win?” he panted.\n“I didn't stop,” said Henrietta. “Slow and steady wins the race.”\nThe hare learned to stop bragging, and the two became great friends. They still race every summer, and now the hare never, ever takes a nap. The end! 🏁"] },
  { t: "Little Red Riding Hippo", o: "Little Red Riding Hood", e: "🦛🧺🐺", k: "red riding hood|riding hood|grandma wolf|what big teeth", p: ["Once upon a time, there was a young hippo who always wore a little red rain hat. Everyone called her Little Red Riding Hippo.", "One day, her mother packed a basket full of watermelons, mangoes and lily-pad cookies. “Take these to Grandma Hippo on the other side of the forest,” she said. “And stay on the path!”", "Little Red Riding Hippo set off, swinging her basket. Halfway through the forest she met a wolf. “Where are you going, little hippo?” he asked, with a sneaky smile.\n“To Grandma's house!” she said. (Oops. Never tell strangers where you're going.)", "The wolf raced ahead by a shortcut, knocked on Grandma Hippo's door, and pretended to be Little Red. But Grandma Hippo was not home. She was at her water-aerobics class. So the wolf put on her nightcap and climbed into her bed to wait.", "When Little Red Riding Hippo arrived, she looked at the bed. Something seemed strange.\n“Grandma, what big ears you have!”\n“The better to hear you with,” said the wolf.\n“Grandma, what big eyes you have!”\n“The better to see you with.”\n“Grandma… what SMALL teeth you have!”", "The wolf blinked. “Small?”\n“Hippos have the biggest teeth of almost any animal,” said Little Red. “Grandma's teeth are as long as my arm. You're not my grandma!”", "Just then, the real Grandma Hippo came home from class. She saw the wolf in her bed, opened her mouth in a great big hippo YAWN, showing every one of her giant teeth, and said, “Excuse me. That is MY bed.”", "The wolf jumped out the window so fast that he left the nightcap behind. He ran all the way to the next country and became a vegetarian.", "Grandma Hippo and Little Red Riding Hippo ate every watermelon in the basket. And Little Red learned to never tell a stranger where she was going. The end! 🧺"] },
  { t: "Jack and the Giant Watermelon Vine", o: "Jack and the Beanstalk", e: "🧒🌱🍉", k: "jack and the beanstalk|beanstalk|magic beans|fee fi fo", p: ["Once upon a time, a boy named Jack lived with his mother and their old hippo, Bessie. They were so poor that one day Jack's mother said, “Take Bessie to the market and trade her for food.”", "On the way, Jack met a strange old man. “I'll trade you five magic watermelon seeds for your hippo,” he said. Jack loved Bessie, but the man promised the seeds would change their lives. So Jack agreed, but only if he could visit Bessie every Sunday.", "When Jack got home, his mother was so upset that she threw the seeds out the window. But overnight, a giant watermelon vine grew all the way up into the clouds!", "Jack climbed, and climbed, and climbed. At the top was a castle where a giant lived. Jack heard a booming voice: “FEE, FI, FO, FUM, I SMELL THE SNACK OF A LITTLE ONE!”", "The giant wasn't scary at all. He was just very, very hungry, because nothing grew in the clouds. And he owned a goose that laid golden eggs, a harp that sang, and a big bag of gold, but none of it could be eaten.", "Jack had an idea. He climbed back down, picked the giant watermelons that grew from the vine, and carried them up, one by one. The giant ate one in a single bite and cried happy giant tears. “This is the best thing I have EVER tasted!”", "So Jack and the giant made a deal: Jack would bring watermelons every week, and the giant would share some of his golden eggs.", "With the gold, Jack bought back Bessie the hippo, fixed up the farm, and planted a hundred more giant vines.", "And every Saturday, the giant climbed down to have a picnic with Jack, his mother and Bessie. Everyone was well fed, and nobody had to steal anything. The end! 🍉"] },
  { t: "The Gingerbread Hippo", o: "The Gingerbread Man", e: "🍪🦛🏃", k: "gingerbread|run run as fast as you can|cookie", p: ["Once upon a time, an old baker decided to bake a cookie shaped like a hippo. She gave it raisin eyes, a candy smile and four little icing toes.", "When she opened the oven, the Gingerbread Hippo jumped right out and ran out the door! “Run, run, as fast as you can! You can't catch me, I'm the Gingerbread Hippo, man!”", "The baker chased him. The baker's dog chased him. A cow in the field chased him. “Run, run, as fast as you can!” he sang, and he ran right past them all.", "Then the Gingerbread Hippo came to a river. He stopped. He couldn't swim! Gingerbread gets soggy.", "A sneaky fox appeared. “Hop on my tail,” said the fox sweetly. “I'll carry you across.” The Gingerbread Hippo was just about to climb on…", "…when a real hippo rose up out of the water. “Don't trust that fox,” said the real hippo. “I'll carry you. Hippos don't eat cookies. We eat grass.” (This is true! Hippos are herbivores.)", "So the Gingerbread Hippo rode across on the real hippo's back, high and dry. The fox sulked on the riverbank.", "On the other side, the Gingerbread Hippo thanked his new friend. He decided he was tired of running away from everyone. So he went back to the baker's shop, said sorry, and became the official greeter, standing in the window and waving at every customer.", "And he's still there today, a little bit stale but very, very happy. The end! 🍪"] },
  { t: "The Three Billy Goats and the Hippo Under the Bridge", o: "The Three Billy Goats Gruff", e: "🐐🌉🦛", k: "billy goats|goats gruff|troll|under the bridge", p: ["Once upon a time, there were three billy goats named Gruff: Little Gruff, Middle Gruff and Big Gruff. They wanted to cross the river to eat the sweet green grass on the other side.", "But under the bridge lived a big, grumpy hippo named Grumbelina. Everyone said she was a terrible troll who would gobble up anyone who crossed.", "Trip, trap, trip, trap! Little Gruff stepped onto the bridge. “WHO'S THAT TRIPPING OVER MY BRIDGE?” roared Grumbelina.\n“J-just me, Little Gruff,” he squeaked. “Please don't eat me! Wait for my bigger brother!”", "Grumbelina looked confused. “Eat you? Why would I eat you? I eat grass. I just wanted you to be QUIET. I'm trying to sleep down here!”", "Trip, trap, trip, trap! Middle Gruff tried to sneak across. “WHO'S THAT TRIPPING?” Grumbelina roared again. “I've been trying to nap for three hundred years! Every animal stomps across this bridge like a marching band!”", "Then Big Gruff came. TRIP! TRAP! TRIP! TRAP! The bridge shook. Grumbelina burst out of the water. “THAT'S IT!” she bellowed. But Big Gruff just said, “You sound tired. Have you tried earplugs?”", "Grumbelina stopped. Nobody had ever asked how she felt before. Everyone just ran away.\n“I… I haven't,” she said. “Nobody ever talks to me.”", "So the three goats made her a pair of fluffy earplugs out of cattail fluff. Grumbelina put them in, lay back in the water, and slept for the first time in three hundred years. She snored so loudly that fish bounced.", "After that, everyone crossed the bridge on tiptoe, and on Sundays the goats brought Grumbelina fresh grass for lunch. Sometimes the scariest monster is just someone who needs a good nap. The end! 🌉"] },
  { t: "The Hippo Who Cried Crocodile", o: "The Boy Who Cried Wolf", e: "🦛📣🐊", k: "cried wolf|boy who cried|crying wolf", p: ["Once upon a time, a young hippo named Hubert had the job of watching the river babies while the grown-ups gathered food. It was a very important job. It was also very, very boring.", "One day Hubert had an idea. He shouted, “CROCODILE! CROCODILE! A CROCODILE IS COMING!” All the grown-up hippos came stampeding back, splashing water everywhere. But there was no crocodile.", "Hubert laughed and laughed. “I got you!” The grown-ups were not amused. “That's not funny, Hubert,” said his mother.", "The next day, Hubert was bored again. “CROCODILE! CROCODILE!” Once again, everyone came running. Once again, there was no crocodile. Once again, Hubert laughed. This time, the grown-ups were very, very cross.", "Then, on the third day, a real crocodile came sliding through the reeds, his eyes just above the water, heading straight for the river babies.", "“CROCODILE!” Hubert screamed. “A REAL ONE THIS TIME! PLEASE COME!” But the grown-ups just shook their heads. “Not again, Hubert,” they said, and kept eating.", "Hubert was terrified. But he knew the babies needed him. So he stood in front of them and opened his mouth as wide as a hippo can (very wide!) and bellowed the loudest hippo HONK ever heard. The crocodile was so startled he swam backward into a tree.", "The grown-ups heard the honk and came running. They saw the crocodile and chased it far, far away.", "That night, Hubert said sorry to everyone. “I learned that if you tell fibs, nobody believes you when you tell the truth,” he said. From then on, Hubert always told the truth, and everyone trusted him again. The end! 📣"] },
  { t: "The Ugly Hippoling", o: "The Ugly Duckling", e: "🦢🦛✨", k: "ugly duckling|duckling|swan", p: ["Once upon a time, a mother duck sat on her eggs by the river. One by one they hatched: crack, crack, crack, and out came little yellow ducklings. But the last egg was enormous. When it finally cracked open, out came… a baby hippo.", "“Well,” said Mother Duck, “you're a strange-looking duckling, but you're mine.” The other ducklings weren't so kind. “You're too big! You're too grey! You can't even quack!” they teased.", "The little hippo tried to fit in. He tried to quack (it came out as a burp). He tried to waddle in a line (he knocked everyone over). He tried to fly (that did not go well at all).", "Feeling sad and lonely, he wandered away down the river. All winter long he wandered, cold and alone, wishing he were someone else.", "When spring came, he saw a group of big, grey, wonderful creatures splashing and playing in the water. They were so strong and so happy. “I wish I could be like them,” he whispered.", "One of them swam over. “Hey, little one! Why are you all alone? Come play with us!”\n“Me?” said the little hippo. “But I'm ugly. I'm not a good duck.”", "The big creature laughed kindly. “That's because you're not a duck. Look at your reflection.” The little hippo looked down into the water and saw that he looked exactly like them. He was a hippo! A perfectly wonderful hippo.", "He joined his new family and was happier than he had ever been. But he never forgot Mother Duck, who loved him even when he was different. Every week he visited her, and gave the ducklings rides on his back across the river.", "And the ducklings said sorry for teasing him, because it turns out a hippo makes an excellent boat. The end! 🦢"] },
  { t: "Hippo-rella", o: "Cinderella", e: "🦛👠🎃", k: "cinderella|glass slipper|fairy godmother|stepsisters", p: ["Once upon a time, there was a kind young hippo named Hippo-rella. She lived with her grumpy stepmother and two stepsisters, who made her scrub every pond, polish every rock and fluff every lily pad.", "One day, an invitation arrived: the Prince of the River was throwing a grand Mud Ball! Every hippo in the land was invited. But the stepsisters laughed. “You can't go, Hippo-rella. You have to stay home and clean.”", "When they left, Hippo-rella sat down and cried. Suddenly, POOF! A sparkly heron appeared. “I'm your Fairy God-Heron,” she said. “And you SHALL go to the ball!”", "With a wave of her feather, she turned a watermelon into a carriage, four frogs into horses, and Hippo-rella's old apron into a shimmering gown. On Hippo-rella's feet were two glass slippers. (Size 48. They were very strong glass.)", "“But remember,” said the Fairy God-Heron, “the magic ends at midnight!”", "At the ball, Hippo-rella danced with the Prince all night. He thought she was the most wonderful hippo he had ever met, because she laughed at his jokes and asked him questions about himself.", "BONG! The clock struck midnight. Hippo-rella ran, and one enormous glass slipper fell off on the stairs.", "The next day, the Prince tried the slipper on every hippo in the land. The stepsisters squeezed and squished, but it didn't fit. Then Hippo-rella tried it on, and it slid right on.", "The Prince asked her to be his friend forever, and she said yes. And instead of being mean back to her stepfamily, Hippo-rella invited them to the castle too, where they learned to be kinder and even started doing their own chores. The end! 👠"] },
  { t: "Hansel and Gretel and the Watermelon House", o: "Hansel and Gretel", e: "👧👦🍉🏠", k: "hansel|gretel|candy house|breadcrumbs", p: ["Once upon a time, two hippo siblings named Hansel and Gretel went exploring deep in the forest. Hansel dropped breadcrumbs behind them so they could find the way home.", "But the birds ate every single crumb. (Of course they did. They're birds.) Hansel and Gretel were lost.", "Just as they were getting very hungry, they found a house made entirely of watermelon! The walls were watermelon. The roof was watermelon rind. The door handle was a little watermelon seed. “WOW,” said Hansel, and took a big bite of the porch.", "The door creaked open, and out came an old witch. “Who's nibbling on my house?” she said. She smiled a strange smile. “Come in, come in, you must be hungry.”", "But the witch had a plan. She wanted the hippos to eat until they were too full to move, so she could put them to work in her garden forever.", "Gretel was clever. She noticed that the witch never went near the river. “I bet she's afraid of water,” she whispered.", "So when the witch told Gretel to fetch water for the soup, Gretel came back with a giant bucket and accidentally-on-purpose spilled it all. The witch shrieked, “Not WATER!” and ran off into the woods, never to be seen again.", "Hansel and Gretel found a map in the witch's kitchen that led them home. And this time, instead of breadcrumbs, they marked the trail with watermelon seeds, which grew into a line of watermelon plants that anyone could follow.", "Now that path is called Watermelon Way, and everyone in the forest has all the watermelon they can eat. The end! 🍉"] },
  { t: "Hippunzel", o: "Rapunzel", e: "🦛🏰🪢", k: "rapunzel|long hair|let down your hair|tower", p: ["Once upon a time, a hippo named Hippunzel lived at the top of a very tall tower. The tower had no stairs and no door, just one window at the very top.", "Here's the problem: hippos don't have long hair. Hippos are almost completely bald.", "So when the prince came by and called, “Hippunzel, Hippunzel, let down your hair!” Hippunzel leaned out the window and said, “I can't. I don't have any hair.”", "The prince scratched his head. “Then how do you get up and down?”\n“I don't,” said Hippunzel. “I've been stuck up here for years. A grumpy wizard put me here because I sang too loudly in the morning.”", "So the prince and Hippunzel came up with a plan. Hippunzel tied together all her bedsheets, curtains and tablecloths into one long rope. But hippos weigh about as much as a car. The rope snapped right away. RIIIP!", "Next, the prince tried to build a ladder. It was too short. Then he tried a trampoline. Hippunzel decided not to jump.", "Finally, Hippunzel had an idea. “Hippos are amazing swimmers. What if we fill the moat with water and I make a giant splash?” So the prince dug a channel from the river, the moat filled up, and Hippunzel jumped out of the window with a mighty SPLOOOOSH that soaked the whole kingdom.", "She was free! The grumpy wizard was so wet that he gave up being grumpy and moved to the desert to dry off.", "And Hippunzel sang as loudly as she liked, every single morning, and everyone in the kingdom learned to like it (or at least bought earplugs). The end! 🏰"] },
  { t: "The Emperor's New Swimsuit", o: "The Emperor's New Clothes", e: "👑🦛🩱", k: "emperor|new clothes|invisible clothes", p: ["Once upon a time, there was a Hippo Emperor who loved fancy clothes more than anything. He had a different swimsuit for every hour of the day.", "One day, two tricky tailors came to the palace. “We can make you the most amazing swimsuit ever made,” they said. “It's so special that only clever hippos can see it. Foolish hippos can't see it at all!”", "The Emperor gave them a big bag of gold. The tailors pretended to sew and sew, but there was nothing on their needles at all.", "The Emperor's advisor came to look. He saw nothing. But he didn't want anyone to think he was foolish, so he said, “Oh, it's beautiful! What lovely colors!”", "Then the Emperor came to look. He saw nothing either. But he didn't want anyone to think HE was foolish. “Magnificent!” he said. “I'll wear it in the Grand River Parade!”", "So the Emperor marched through the town in his “new swimsuit.” Everyone in the crowd saw nothing at all, but they all clapped and cheered and said, “How wonderful!” because nobody wanted to look foolish.", "Then a little hippo in the crowd said, very loudly, “But he's not wearing ANYTHING!”", "Everyone gasped. Then everyone started laughing, because it was true! (Luckily, hippos don't really wear clothes anyway, so it wasn't that embarrassing.) The Emperor laughed hardest of all.", "The Emperor learned that it's better to tell the truth than to pretend, and he made the little hippo his new Royal Truth Teller. And the tricky tailors? They had to give all the gold back. The end! 👑"] },
  { t: "The Lion and the Tiny Hippo", o: "The Lion and the Mouse", e: "🦁🦛🕸️", k: "lion and the mouse|lion|mouse|net", p: ["Once upon a time, a mighty lion was sleeping under a tree when a tiny baby hippo, chasing a butterfly, tripped right over his tail.", "ROAR! The lion woke up and grabbed the little hippo. “How dare you wake me up?” he growled.", "“I'm so sorry!” squeaked the baby hippo. “Please let me go! Maybe one day I can help you!”\nThe lion laughed so hard his mane shook. “YOU? Help ME? I'm the king of the jungle!” But he thought it was so funny that he let the little hippo go.", "A few weeks later, the lion was walking by the river when WHOOSH! He got caught in a hunter's net. He roared and pulled and twisted, but the net only got tighter.", "The baby hippo heard the roaring and came running. “Don't worry, Mister Lion! I'll help!”\n“What can a baby do?” groaned the lion.", "The baby hippo opened her mouth. Even baby hippos have big, strong teeth. Chomp, chomp, chomp! She chewed through the ropes, one by one, until the lion was free.", "The lion stared at her in amazement. “You saved my life,” he said. “I was wrong to laugh at you.”", "“That's okay,” said the baby hippo. “Everybody can help somebody, no matter how small they are.”", "From that day on, the lion and the little hippo were the best of friends. The lion gave her rides on his back, and she kept him company at the river. And nobody in the jungle ever laughed at small creatures again. The end! 🦁"] },
  { t: "The Ant and the Hippo", o: "The Ant and the Grasshopper", e: "🐜🦛❄️", k: "ant and the grasshopper|grasshopper|ant", p: ["Once upon a time, all summer long, a little ant worked hard, carrying seeds and crumbs into her home under the ground.", "Meanwhile, a hippo named Harold spent every single day floating in the river, singing songs and blowing bubbles. “Why are you working so hard?” he asked the ant. “It's summer! Come float with me!”", "“I'm getting ready for winter,” said the ant. “When the cold comes, there won't be any food.”\n“Winter is ages away!” laughed Harold, and floated off.", "But summer ended. Then autumn came. The grass turned brown. Then winter arrived, and the river grew cold, and there was nothing left to eat.", "Harold was very hungry. He knocked on the ant's tiny door (very gently, with one toe). “Please,” he said, “do you have any food to share?”", "The ant looked at him. “I told you to get ready,” she said. Harold looked down at his feet, ashamed. “You were right. I should have listened.”", "The ant thought for a moment. “Well, I do have extra. But an ant's store won't fill a hippo for long. Tell you what: I'll share now, and next summer, you help me gather food. Your big mouth could carry a hundred times more than I can!”", "So that's what they did. The next summer, Harold worked with the ant every morning and floated every afternoon. By winter, they had enough food for the whole river.", "They learned that hard work and fun can go together, and that it's always better to get ready before things get hard. The end! 🐜"] },
  { t: "Hippo-cchio", o: "Pinocchio", e: "🪵🦛👃", k: "pinocchio|wooden puppet|nose grows|nose grew", p: ["Once upon a time, an old woodcarver named Geppetto carved a puppet shaped like a little hippo. That night, a blue fairy waved her wand, and the puppet came alive!", "“I'll call you Hippo-cchio,” said Geppetto, laughing with joy. “Be good, be brave, and always tell the truth, and one day you might become a real hippo.”", "But there was something strange about Hippo-cchio. Whenever he told a fib, his nose grew. And since hippo noses are already big, it got VERY big, very fast.", "“Did you eat the last cookie?” asked Geppetto.\n“No,” said Hippo-cchio. BOING! His nose grew so long that it knocked a vase off the shelf.", "“Did you do your homework?”\n“Yes!” BOING! His nose grew out the window and into the neighbor's garden, where a bird started building a nest on it.", "Hippo-cchio realized that every fib just made things worse. He couldn't even fit through the door anymore! So he took a deep breath and said, “I ate the cookie. And I didn't do my homework. I'm sorry.”", "Shoop! His nose shrank right back to normal. (The bird was a little annoyed.)", "From then on, Hippo-cchio always told the truth, even when it was hard. He helped Geppetto in the workshop, did his homework, and was kind to everyone.", "And one morning, he woke up and found that he wasn't made of wood anymore. He was a real, warm, wiggly hippo, the happiest one in the whole world. The end! 🪵"] },
  { t: "Hippo Little and the Falling Sky", o: "Chicken Little (Henny Penny)", e: "🦛🌰☁️", k: "chicken little|henny penny|sky is falling", p: ["Once upon a time, a young hippo named Hippo Little was napping under an oak tree when an acorn fell and BONK! landed right on her head.", "“THE SKY IS FALLING!” she shouted. “THE SKY IS FALLING! I must tell the king!”", "She ran down the road and met Ducky Lucky. “The sky is falling!” she cried. “A piece of it hit me on the head!” Ducky Lucky was terrified, so she ran along too.", "They met Goosey Loosey, Turkey Lurkey and Froggy Woggy. Soon a whole parade of panicking animals was running down the road shouting, “THE SKY IS FALLING!”", "Then they met Foxy Loxy. “The sky is falling?” he said with a sly grin. “Follow me! I know a safe place.” And he started to lead them toward his den.", "But Hippo Little stopped. She looked up. The sky was still right there, blue and sunny, exactly where it always was. She looked down at the thing that had hit her. It was… an acorn.", "“Wait!” she shouted. “Everybody stop! It wasn't the sky. It was an ACORN!” All the animals looked up. Then they looked at the acorn. Then they looked at Foxy Loxy, who was trying to tiptoe away.", "“Hmm,” said Turkey Lurkey. “I don't think we should follow him after all.” And they all went home safe and sound.", "Hippo Little learned to stop, look and think before getting scared, and before believing everything she heard. And she planted the acorn, which grew into a big oak tree, perfect for napping under (with a helmet). The end! 🌰"] },
  { t: "The Little Red Hippo", o: "The Little Red Hen", e: "🦛🌾🍞", k: "little red hen|red hen|who will help me", p: ["Once upon a time, a little red hippo found some grains of wheat. “Who will help me plant this wheat?” she asked.\n“Not I,” said the lazy cat.\n“Not I,” said the sleepy dog.\n“Not I,” said the snoozing duck.\n“Then I'll do it myself,” said the little red hippo. And she did.", "The wheat grew tall and golden. “Who will help me cut the wheat?” she asked.\n“Not I,” said the cat, the dog and the duck. So she did it herself.", "“Who will help me take the wheat to the mill?”\n“Not I.” So she did it herself.", "“Who will help me bake the flour into bread?”\n“Not I.” So she did it herself. And soon the smell of warm, fresh bread drifted over the whole farm.", "“Who will help me EAT the bread?” asked the little red hippo.\n“I will!” said the cat. “I will!” said the dog. “I will!” said the duck.", "The little red hippo put her hands on her hips. “You didn't help plant it. You didn't help cut it. You didn't help grind it or bake it. Why should you help eat it?”", "The cat, dog and duck looked at their feet. “You're right,” said the duck. “We're sorry.”", "The little red hippo thought about it. “Okay,” she said. “You can share this loaf. But next time, everybody helps.” And the next year, they did. The cat planted, the dog cut, the duck carried and the hippo baked, and they had so much bread they shared it with the whole town.", "And they all learned that when everybody helps, everybody gets to share. The end! 🍞"] },
  { t: "The Princess and the Watermelon", o: "The Princess and the Pea", e: "👸🦛🍉", k: "princess and the pea|pea|mattresses", p: ["Once upon a time, a Hippo Prince wanted to find a true princess to be his friend. But how could he tell who was a real princess?", "One stormy night, there was a knock at the castle door. There stood a soaking-wet hippo. “I'm a princess,” she said. “Can I come in out of the rain?”", "The Queen had a secret test. She put one small pea on the bed, then piled twenty mattresses on top of it. “A real princess,” she whispered, “will feel the pea.”", "But this was a HIPPO castle. Hippo princesses are very big and very tough. So instead of a pea, the Queen used a whole watermelon. Then she stacked twenty mattresses on top, then twenty fluffy quilts.", "The princess climbed up the tall ladder and lay down. The whole tower of mattresses wobbled.", "In the morning, the Queen asked, “How did you sleep?”\n“Terribly!” said the princess. “There was a lump the size of a watermelon under me! Oh. Wait. Was it a watermelon?”", "“A real princess!” cried the Queen. The Prince was delighted. But the princess just smiled. “Actually,” she said, “anyone would feel a whole watermelon. That's not a very good test.”", "Everyone laughed, because she was right. So the Prince decided that the best way to know someone isn't to test them, but to get to know them. They spent the day playing games, and became the best of friends.", "And the watermelon? They had it for breakfast. The end! 👸"] },
  { t: "Hippo in Wonderland", o: "Alice's Adventures in Wonderland", e: "🦛🐇🎩", k: "alice|wonderland|white rabbit|mad hatter|cheshire|rabbit hole", p: ["Once upon a time, a curious hippo named Alice was sitting by the river, feeling very bored, when a white rabbit in a waistcoat ran past. “Oh dear, oh dear! I shall be late!” he said, looking at a pocket watch.", "Alice followed him to a rabbit hole. It was a very small hole, and she was a very large hippo. She squeezed, she squished, and POP! down she fell, down, down, down, past cupboards and bookshelves and floating teacups.", "She landed in a hall full of tiny doors. On a table was a bottle labeled “DRINK ME.” Alice drank it and shrank until she was the size of a pebble. “Finally!” she said. “For the first time in my life, I'm small!”", "Then she found a cake labeled “EAT ME.” She ate it and grew so big that her head bumped the ceiling. “Oh,” she sighed. “Back to normal hippo size, I suppose.”", "In a garden she found a grinning cat sitting in a tree. “Which way should I go?” asked Alice. “That depends on where you want to get to,” said the cat, and then disappeared, except for his smile.", "Next she came to a tea party with a Hatter and a March Hare. “No room! No room!” they shouted, even though there were lots of empty chairs. “Why is a raven like a writing desk?” asked the Hatter. Alice thought hard. “I have no idea.” “Neither do I!” said the Hatter happily.", "Finally she met the Queen of Hearts, who shouted “OFF WITH THEIR HEADS!” about everything. Alice, who was a very big hippo, said, “You're just a pack of cards!” and sneezed. The whole court of cards blew away like leaves.", "Alice woke up by the river. Her sister was shaking her gently. “Wake up, Alice! You've been asleep all afternoon.”", "It had all been a dream. But on the way home, Alice was sure she saw a white rabbit check his pocket watch and wink at her. The end! 🎩"] },
  { t: "The Wonderful Wizard of Mud", o: "The Wonderful Wizard of Oz", e: "🦛🌪️👠", k: "wizard of oz|oz|dorothy|yellow brick road|tin man|scarecrow", p: ["Once upon a time, a hippo named Dorothy lived on a muddy farm in Kansas with her little dog, Toto. One day, a giant twister picked up the whole farm and spun it away, all the way to the magical Land of Oz.", "“Toto,” said Dorothy, “I have a feeling we're not in the river anymore.” The little munchkins told her that the Wizard of Oz could help her get home. “Just follow the yellow brick road!”", "On the way, Dorothy met a scarecrow who wanted a brain. “I can't even figure out how to scare a crow,” he sighed. “Come with me!” said Dorothy.", "Next, she met a tin hippo who wanted a heart, and he was so rusty he couldn't move. Dorothy oiled his joints, and he cried happy tears (which made him rusty again, so she oiled him again).", "Then they met a lion who wanted courage. He was scared of everything, even his own tail. “Come with us,” said Dorothy. “We'll be brave together.”", "Along the way, the scarecrow came up with clever plans, the tin hippo cared for everyone, and the lion protected them all. They just didn't notice it.", "At last they reached the Emerald City. But the great Wizard turned out to be a little old man behind a curtain, pulling levers. “I'm not really a wizard,” he admitted. “But you didn't need me. Scarecrow, you've been clever all along. Tin Hippo, you've been kind all along. Lion, you've been brave all along.”", "“And me?” asked Dorothy. “How do I get home?” The good witch Glinda appeared. “Click your heels three times and say: there's no place like home.” Dorothy clicked her (very large) heels. Click. Click. Click.", "WHOOSH! Dorothy woke up in her own muddy pond in Kansas, with Toto licking her nose. And she knew that the best adventures always end with getting home. The end! 👠"] },
  { t: "Peter Hippo", o: "The Tale of Peter Rabbit", e: "🦛🥕🧑‍🌾", k: "peter rabbit|peter|mr mcgregor|mcgregor", p: ["Once upon a time, there were four little hippos named Flopsy, Mopsy, Cotton-tail and Peter. They lived with their mother in a mud bank under a big fig tree.", "“Now, my dears,” said Mother Hippo, “you may go into the fields or down the river, but don't go into Mr. McGregor's garden.”", "Flopsy, Mopsy and Cotton-tail were good little hippos and went to pick berries. But Peter was very naughty. He ran straight to Mr. McGregor's garden and squeezed under the gate. (It was a very tight squeeze. The gate was never the same again.)", "First he ate some lettuces. Then he ate some radishes. Then he ate some watermelons, a pumpkin and half a cucumber patch. Then, feeling rather sick, he went to look for some parsley.", "Then he turned a corner, and who should he meet but Mr. McGregor! “Stop, thief!” shouted Mr. McGregor, waving a rake.", "Peter ran. He lost one shoe among the cabbages and the other among the potatoes. He tried to hide in a watering can, but he only fit one leg in, and he got completely stuck.", "Mr. McGregor came closer. Peter wiggled and jiggled, and finally the watering can shot off like a cork. Peter dashed under the gate, which finally broke completely, and he ran all the way home.", "He was so tired and so full that his mother put him to bed with a cup of chamomile tea. Flopsy, Mopsy and Cotton-tail had berries and milk for supper.", "The next day, Peter went back and said sorry to Mr. McGregor, and helped him fix the gate. Mr. McGregor even gave him a watermelon to take home, and Peter learned that it's much better to ask than to take. The end! 🥕"] },
  { t: "Puss in Boots and the Hippo King", o: "Puss in Boots", e: "🐈🥾🦛👑", k: "puss in boots|cat in boots", p: ["Once upon a time, a poor young miller died and left his youngest son nothing but a cat. “What will I do with a cat?” sighed the son.", "“Give me a pair of boots and a bag,” said the cat, “and I'll make you the happiest person in the land.” The son was surprised that the cat could talk, but he gave him the boots.", "Puss in Boots marched off and caught the juiciest grass and fruit he could find. He brought it all to the King of the land, who happened to be a very large hippo. “A gift from my master, the Marquis of Carabas!” said Puss with a bow. (He made up the name. It sounded fancy.)", "The Hippo King loved the gifts. Every day, Puss brought more, and every day the King grew more curious about this generous Marquis.", "Meanwhile, a nasty ogre lived in a huge castle and was mean to everyone in the land. Puss went to visit him. “I hear you can turn into any animal,” said Puss. “But surely not something as big as a hippo?” The ogre turned into a giant hippo. “Impressive,” said Puss. “But surely not something as small as a mouse?”", "The ogre turned into a mouse. Puss just smiled. The mouse squeaked, ran out the door, and never came back. (Puss didn't eat him. He just chased him all the way to the next kingdom, which was much more fun.)", "So the castle was empty. When the Hippo King came by in his carriage, Puss said, “Welcome to the castle of the Marquis of Carabas!” The miller's son was very surprised to hear that.", "The King and the miller's son became great friends, and the son made sure everyone in the land who had been bullied by the ogre now had food and a home.", "As for Puss, he wore his boots every single day, and he became the most famous cat in the kingdom. The end! 🥾"] },
  { t: "The Town Hippo and the Country Hippo", o: "The Town Mouse and the Country Mouse", e: "🏙️🦛🌾", k: "town mouse|country mouse|city mouse", p: ["Once upon a time, there was a hippo who lived in the countryside, in a quiet muddy pond surrounded by grass. One day, her cousin from the big city came to visit.", "The country hippo was so happy. She served her best grass, some fresh reeds and a watermelon from the garden. But the town hippo turned up her nose. “Grass? Just grass? Cousin, you must come and see how we live in the city!”", "So off they went to the city. The town hippo lived in a fancy fountain in the middle of a park. There were bright lights, honking cars and a restaurant next door that threw out amazing leftovers: pizza crusts, salads, and fancy fruit.", "“Wow,” said the country hippo, taking a bite of a mango. “This is delicious!”", "But just then, a garbage truck came roaring by: BEEP BEEP CRASH! Then a dog barked: WOOF WOOF! Then a crowd of tourists came to take pictures: FLASH FLASH FLASH! The two hippos had to hide behind a statue.", "That night, the country hippo couldn't sleep. Sirens wailed. Lights flashed. Somebody played the drums until three in the morning.", "In the morning, the country hippo said, “Thank you, cousin. Your food is fancy and your city is exciting. But I'd rather eat plain grass in peace than fancy food in a fright.”", "So she went home to her quiet little pond and slept for two whole days. And the town hippo? She loved the city and stayed there, happy as could be.", "They both learned that there is no single best place to live. The best home is the one that makes you happy. And they still visit each other every summer. The end! 🌾"] },
  { t: "The Hippo and the North Wind", o: "The North Wind and the Sun", e: "🌬️☀️🦛", k: "north wind|wind and the sun", p: ["Once upon a time, the North Wind and the Sun had an argument about which one of them was stronger.", "“I'm stronger!” blew the North Wind. “I can knock down trees and make waves as tall as houses!”\n“Maybe,” said the Sun calmly. “Let's have a contest.”", "Just then, a hippo walked by wearing a big, cozy raincoat. “Whoever can get the hippo to take off his coat is the strongest,” said the Sun.", "The North Wind went first. He blew. He gusted. He howled. WHOOOOSH! But the colder it got, the tighter the hippo wrapped his coat around himself. “Brrr! What a windy day!” he grumbled.", "The North Wind blew so hard that leaves flew off trees and ducks flew backwards. But the hippo just held his coat even tighter. Finally, the North Wind gave up, completely out of breath.", "Then it was the Sun's turn. The Sun simply smiled and shone warmly down on the hippo.", "The hippo loosened his coat. “Ah, that's better.” The Sun shone a little warmer. The hippo unbuttoned his coat. The Sun shone warmer still. “Phew! It's a hot one!” said the hippo, and he took off his coat, dropped it on the riverbank, and jumped into the cool water with a giant SPLASH.", "“See?” said the Sun. “Being gentle and kind often works better than being rough and forceful.”", "The North Wind grumbled, but he knew the Sun was right. And the hippo spent the rest of the day floating happily, never knowing that he had settled a very big argument. The end! ☀️"] },
  { t: "Stone Soup with Hippo", o: "Stone Soup", e: "🪨🍲🦛", k: "stone soup|soup", p: ["Once upon a time, a hungry hippo traveler arrived in a village. “Could anyone spare some food?” she asked. But everyone shook their heads. “Times are hard. We barely have enough for ourselves.” And they closed their doors.", "So the hippo found a big pot, filled it with river water, built a fire, and dropped in a smooth, round stone. Then she began to stir.", "A curious child peeked out of a window. “What are you making?”\n“Stone soup!” said the hippo. “It's delicious. But it would be even better with a carrot.”\n“I have a carrot!” said the child, and ran to get one.", "Then a farmer wandered over. “Stone soup, eh?”\n“It's wonderful,” said the hippo, stirring. “But it would be even better with a few potatoes.”\n“I have potatoes!” said the farmer.", "One by one, the villagers came out. One brought onions. One brought beans. One brought salt and pepper. One brought a whole basket of tomatoes. Another brought bread to go with it.", "Soon the pot was bubbling with the most delicious soup anyone had ever smelled. The whole village sat down together and ate, and laughed, and told stories, for the first time in a long time.", "“This is the best soup I have ever tasted,” said the farmer. “And to think, it was made from a stone!”", "The hippo smiled. “It wasn't really the stone,” she said. “It was everyone sharing a little bit.”", "When she left the next morning, she gave the stone to the child. And every year after that, the village had a Stone Soup Festival, where everyone shared what they had. The end! 🍲"] }
];

      <div class="topline"><span class="label">📖 ${esc(B.t)}</span><span class="row"><button class="iconbtn" id="bk-lib">📚 Library</button><button class="iconbtn" id="bk-hip">🦛 Ask Hippo</button></span></div>

        <small class="bk-ch">Chapter ${P.ch}: ${esc(P.cht)}</small>
        ${at === 0 ? `<h2 class="bk-title">${esc(B.t)}</h2><p class="soft bk-by">A Hippo's Library book · 100 pages · 10 chapters</p>` : ""}
        <div class="bk-text">${esc(P.text).split("\n\n").map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("")}</div>
        <div class="bk-num">Page ${P.n} of ${pages.length}</div>
      </div>

      <label class="bk-jump">Go to chapter <select id="bk-ch">${Array.from({ length: 10 }, (_, i) => { const f = pages.find(x => x.ch === i + 1); return `<option value="${f.n - 1}" ${P.ch === i + 1 ? "selected" : ""}>${i + 1}. ${esc(f.cht)}</option>`; }).join("")}</select></label>

    document.getElementById("bk-ch").addEventListener("change", e => { at = +e.target.value; draw(); });

    document.getElementById("bk-hip").addEventListener("click", () => { reading = false; hippoHush(); startHippo(); });
    keyHandler = e => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); };

/* ---------- Pause: one button that freezes whatever game is running ---------- */
let PAUSED = false;

const gameRunning = () => !!((S && S.running) || (A && A.state && !["menu", "over"].includes(A.state)) || (M && M.running) || (D && !D.over) || (G && !G.over));
function setPause(on) {
  if (on && !gameRunning()) return;
  PAUSED = on;
  document.getElementById("pause-veil")?.remove();
  if (on) {
    document.activeElement?.blur?.();
    const v = document.createElement("div");
    v.id = "pause-veil"; v.className = "pause-veil"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Paused");
    v.innerHTML = `<div class="pause-card"><h2>Paused</h2><p class="soft">Take a break! Your game is frozen.</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="pause-go">Keep playing</button><button class="btn" id="pause-exit">Exit game</button></div>
      <p class="soft" style="font-size:.85rem">Tip: press P to pause and unpause.</p></div>`;
    document.body.appendChild(v);
    v.querySelector("#pause-go").addEventListener("click", () => setPause(false));
    v.querySelector("#pause-exit").addEventListener("click", () => { setPause(false); exitAll(); });
    v.querySelector("#pause-go").focus();
    tone([440, 330], .06, "triangle", .05);
  } else {
    tone([330, 440], .06, "triangle", .05);
    document.querySelector("#ty-in")?.focus();
  }

}
function updatePauseBtn() {

  pauseBtn.hidden = !show && !PAUSED;
  pauseBtn.innerHTML = PAUSED
    ? `<svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg> Play`
    : `<svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" rx="1" fill="currentColor"/><rect x="7.5" y="1" width="3" height="10" rx="1" fill="currentColor"/></svg> Pause`;
  pauseBtn.setAttribute("aria-pressed", PAUSED);
}
pauseBtn.addEventListener("click", () => setPause(!PAUSED));
// While paused, swallow game keys (so nothing moves or gets typed); P, Escape, Enter and Space unpause.
window.addEventListener("keydown", e => {
  if (PAUSED) {
    if (["p", "P", "Escape"].includes(e.key) || ((e.key === "Enter" || e.key === " ") && document.activeElement?.id !== "pause-exit")) { e.preventDefault(); setPause(false); }
    else if (e.key !== "Tab") e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  if ((e.key === "p" || e.key === "P") && gameRunning() && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) { e.preventDefault(); e.stopImmediatePropagation(); setPause(true); }
}, true);
setInterval(updatePauseBtn, 400);

/* ---------- Exit: one button on every screen that stops everything and goes home ---------- */
const exitBtn = document.getElementById("exit-all");
function exitAll() {
  PAUSED = false; document.getElementById("pause-veil")?.remove();
  document.querySelectorAll(".shop, .toast").forEach(el => el.remove());
  if (G && !G.over) { G.over = true; clearInterval(G.timer); }
  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  stopSlope(); stopArchers(); stopMini();
  showHome();
  window.scrollTo({ top: 0 });
}
exitBtn.addEventListener("click", exitAll);
// Show the button everywhere except the main page (the main page is the one with the games menu).
new MutationObserver(() => {
  const home = !!document.getElementById("gamesmenu");
  exitBtn.hidden = home;
  document.body.classList.toggle("has-exit", !home);
}).observe($app, { childList: true });

showHome();
showSaveState();
cloudConnect();
</script>
