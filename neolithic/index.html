<title>Study Arcade</title>
<meta name="description" content="Gimkit-style study games: Dig It Up, Slope Run, and Cash Race, with Social Studies, Math, Science, Health, Reading and Writing, and Art questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: game-show screen. Money HUD pinned on top, question in the middle, big colored answer tiles below.
     Deliberately single-theme (dark, like a classroom game on a projector). */
  :root {
    color-scheme: dark;
    --bg: #1a1240;
    --panel: #281d5a;
    --panel-2: #36297a;
    --line: #4a3c94;
    --ink: #f7f4ff;
    --ink-soft: #bdb3e6;
    --money: #42e392;
    --gold: #ffc93c;
    --bad: #ff6070;
    --t1: #d7334a; --t2: #2f6fe4; --t3: #14966a; --t4: #c9670f; --t5: #8a46d8; --t6: #0a8f9a;
    --display: "Rowdies", "Trebuchet MS", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; }
  .wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }
  .soft { color: var(--ink-soft); }
  .money { color: var(--money); font-family: var(--display); font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 700; background: var(--panel-2); box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .btn.go { background: var(--money); color: #06301b; font-family: var(--display); font-size: 1.3rem; }
  .btn.gold { background: var(--gold); color: #3a2600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Home */
  .hero { text-align: center; display: flex; flex-direction: column; gap: 6px; padding-block: 10px; }
  .hero h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); letter-spacing: .01em; }
  .hero h1 span { color: var(--gold); }
  .label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .chip { text-align: left; border: 3px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .chip b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
  .chip span { font-size: .85rem; color: var(--ink-soft); }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: #4a3a1a; }
  .best { text-align: center; font-size: .95rem; }
  .extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .extras .btn { text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .extras .btn span { font-weight: 400; font-size: .85rem; color: var(--ink-soft); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; font-size: .9rem; }
  .legend div { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
  .legend b { font-family: var(--display); font-weight: 400; color: var(--gold); }
  details summary { cursor: pointer; font-weight: 700; color: var(--gold); }
  details[open] summary { margin-bottom: 10px; }

  /* HUD */
  .hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-radius: 18px; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .hud .money { font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; }
  .hud .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .hud .stats b { color: var(--ink); }
  .hud .streak b { color: var(--gold); }
  .hud .shopbtn { grid-row: span 2; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: var(--display); font-size: 1.15rem; background: var(--gold); color: #3a2600; padding: 10px 18px; }
  .hud .shopbtn small { font-family: var(--body); font-size: .72rem; font-weight: 700; }
  .goalbar { grid-column: 1 / -1; height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .goalbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--money), var(--gold)); transition: width .4s; }
  .active-pu { grid-column: 1 / -1; font-size: .82rem; color: var(--gold); font-weight: 700; }
  .active-pu:empty { display: none; }

  /* Question */
  .qcard { background: var(--ink); color: #1a1240; border-radius: 18px; padding: 22px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
  .qcard .tag { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6a5bb0; }
  .qcard .q { font-size: clamp(1.15rem, 3.6vw, 1.45rem); font-weight: 700; }
  .qcard .def { font-weight: 400; }
  .qcard .term { font-family: var(--display); font-weight: 400; color: var(--t2); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tiles.six { grid-template-columns: repeat(3, 1fr); }
  .tile { border: 0; border-radius: 16px; padding: 18px 14px; min-height: 96px; color: #fff; font-weight: 700; font-size: 1.02rem; text-align: left; display: flex; gap: 10px; align-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, filter .15s; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .tile:hover { filter: brightness(1.12); }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .tile .k { flex: none; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: .85rem; }
  .tiles.six .tile { flex-direction: column; justify-content: center; text-align: center; gap: 4px; min-height: 90px; }
  .tiles.six .tile b { font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1; }
  .tiles.six .tile span { font-size: .85rem; }
  .c1 { background: var(--t1); } .c2 { background: var(--t2); } .c3 { background: var(--t3); }
  .c4 { background: var(--t4); } .c5 { background: var(--t5); } .c6 { background: var(--t6); }

  /* Result splash */
  .splash { border-radius: 18px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: pop .25s ease-out; }
  .splash.good { background: #0f5d3a; }
  .splash.bad { background: #6e1f2a; }
  .splash h2 { font-size: 1.8rem; }
  .splash .delta { font-family: var(--display); font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
  .splash.good .delta { color: var(--money); }
  .splash.bad .delta { color: var(--bad); }
  .splash .ans { background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 14px; max-width: 60ch; }
  .splash .why { max-width: 60ch; color: #e6e0ff; }
  .splash .note { font-size: .9rem; color: var(--gold); font-weight: 700; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  /* Shop */
  .shop { position: fixed; inset: 0; z-index: 20; background: rgba(10, 6, 30, .82); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .shop-inner { width: 100%; max-width: 760px; background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .shop-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .shop-top .money { font-size: 1.8rem; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { border: 0; border-radius: 99px; padding: 8px 16px; font-weight: 700; background: var(--panel-2); color: var(--ink-soft); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #1a1240; }
  .items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .item { background: var(--panel-2); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .item h3 { font-size: 1.1rem; }
  .item p { font-size: .88rem; color: var(--ink-soft); }
  .lvl { display: flex; gap: 4px; }
  .lvl i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
  .lvl i.on { background: var(--gold); }
  .item .now { font-size: .9rem; font-variant-numeric: tabular-nums; }
  .item .now b { color: var(--money); }
  .item .btn { margin-top: auto; background: var(--money); color: #06301b; }
  .item .btn:disabled { background: var(--line); color: var(--ink-soft); box-shadow: none; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--gold); color: #3a2600; font-weight: 700; padding: 10px 18px; border-radius: 99px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

  /* End screen */
  .big { font-family: var(--display); font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--panel-2); border-radius: 12px; padding: 10px 14px; }
  .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .missed { display: flex; flex-direction: column; gap: 10px; }
  .miss { border-left: 4px solid var(--bad); padding: 8px 12px; background: var(--panel-2); border-radius: 0 10px 10px 0; font-size: .95rem; }
  .miss b { display: block; }

  /* Timeline + focus extras */
  .placed { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
  .placed li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 10px; background: #0f5d3a; font-size: .95rem; }
  .placed li b { flex: none; min-width: 1.4em; color: var(--money); font-variant-numeric: tabular-nums; }
  .pool { display: grid; gap: 8px; }
  .pool button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 3px solid var(--line); background: var(--panel-2); }
  .pool button:hover { border-color: var(--ink-soft); }
  .pool button.hint { border-color: var(--gold); }
  .shake { animation: shake .35s; border-color: var(--bad) !important; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .flash ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-soft); }

  .iconbtn { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font-size: .85rem; }
  footer { text-align: center; }

  /* Dig It Up */
  .feature-dig { background: linear-gradient(160deg, #3b2a14, var(--panel) 70%); }
  .dighud { grid-template-columns: 1fr; position: static; }
  .dstats { display: flex; gap: 8px 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .dstats b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--ink); }
  .dstats .energy b, .energy-big b { color: var(--money); }
  .dstats .coins b, .coins-big b { color: var(--gold); }
  .energy-big b, .coins-big b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
  .dbtns .btn { flex: 1; padding: 10px 14px; }
  .where { font-size: .9rem; }
  .inv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .invslot { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 6px 8px; min-width: 0; }
  .invslot svg { grid-row: span 2; width: 26px; height: 26px; }
  .invslot b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .invslot small { font-size: .7rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }
  .qclock { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
  .qclock .goalbar div { background: linear-gradient(90deg, var(--bad), var(--gold)); transition: width 1s linear; }
  .toolnow { font-size: .9rem; color: var(--ink-soft); }
  .toolnow b { color: var(--gold); }
  .dbtns .btn { flex: 0 1 auto; }
  .cracked { filter: brightness(.75); background-image: linear-gradient(135deg, transparent 45%, rgba(0,0,0,.55) 47%, transparent 52%), linear-gradient(45deg, transparent 60%, rgba(0,0,0,.45) 62%, transparent 66%); }
  .recipe { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
  .need { display: flex; align-items: center; gap: 6px; color: var(--bad); }
  .need.ok { color: var(--money); }
  .need svg { width: 18px; height: 18px; }
  .item.owned { outline: 2px solid var(--money); }
  .gold-t { color: var(--gold); font-weight: 700; }
  .site { max-height: 62vh; overflow-y: auto; border-radius: 16px; background: #1d120a; padding: 8px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .layer-label { grid-column: 1 / -1; font-family: var(--display); font-size: .85rem; color: var(--gold); padding: 6px 4px 2px; }
  .layer-label span { font-family: var(--body); color: #c9ad8c; font-size: .78rem; }
  .cell { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 6px; padding: 3px; display: grid; place-items: center; }
  .cell svg { width: 100%; height: 100%; }
  .sky { background: #4f86c6; }
  .dug { background: #2b1b10; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
  .dirt { box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .dirt:hover { filter: brightness(1.2); }
  .l0 { background: #9a6a3c; } .l1 { background: #85572f; } .l2 { background: #6f4626; } .l3 { background: #5a381f; } .l4 { background: #7fa7bd; }
  .boulder { background-image: radial-gradient(circle at 40% 40%, #a7a29c, #6b6560 70%); }
  .glint { outline: 2px solid var(--gold); outline-offset: -2px; }
  .glint svg { width: 70%; opacity: .9; }
  .me { background: #3a2716; }
  .sky.me { background: #4f86c6; }
  .museum { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; font-size: .85rem; }
  .museum li { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 6px 10px; min-height: 36px; }
  .museum li svg { width: 18px; height: 18px; flex: none; }
  .find { max-width: 560px; }
  .findcard { display: flex; gap: 14px; align-items: flex-start; background: var(--panel-2); border-radius: 14px; padding: 14px; }
  .findcard > svg { width: 44px; height: 44px; flex: none; }
  .findcard div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .good-l { border-left-color: var(--money); }
  .qover .shop-inner { gap: 12px; }
  .qover .splash { padding: 18px 10px; }
  .qover .delta { font-size: clamp(1.8rem, 7vw, 2.6rem); }

  .inv { grid-template-columns: repeat(6, 1fr); }
  .slope-over[hidden] { display: none; }
  .site { position: relative; max-height: 64vh; overflow: auto; overscroll-behavior: contain; }
  .grid { grid-template-columns: repeat(25, 40px) !important; width: max-content; }
  .cell { width: 40px; height: 40px; aspect-ratio: auto; }
  .layer-label { position: relative; }
  .layer-label .ll { position: sticky; left: 4px; display: inline-block; }
  .l5 { background: #565b66; } .l6 { background: #45397a; } .l7 { background: #6b2618; box-shadow: inset 0 -3px 0 rgba(255,120,40,.35); }
  .hint { font-size: .85rem; text-align: center; }
  .slope-card { background: linear-gradient(160deg, #0b3a24, var(--panel) 70%); }
  .slope-stage { position: relative; border-radius: 14px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
  .slope-stage canvas { display: block; width: 100%; }
  .slope-over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: rgba(0,0,0,.6); padding: 16px; }
  .steer .btn { flex: 1; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 1.1rem; padding: 16px; }

  @media (max-width: 520px) {
    .tiles { grid-template-columns: 1fr; }
    .tiles.six { grid-template-columns: repeat(2, 1fr); }
    .tile { min-height: 64px; }
    .items { grid-template-columns: 1fr; }
    .invslot small { display: none; }
    .inv { grid-template-columns: repeat(3, 1fr); }
    .chips { grid-template-columns: repeat(2, 1fr); }
    .invslot { grid-template-columns: 24px 1fr; }
    .panel, .qcard { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap" id="app"></div>
<footer><button class="iconbtn" id="mute" type="button">Sound: on</button></footer>

<script>
/* ---------- Study content (from the study guide) ---------- */
const VOCAB = [
  { t: "canal", d: "A human-made waterway that carries water to crops or is used for travel.", why: "Canals let farmers irrigate fields far from the river, which helped them grow a surplus." },
  { t: "capital resource", d: "Tools, machines, and buildings people make and use to produce goods (like hoes, plows, and canals).", why: "Better capital resources helped farmers produce more food with less work." },
  { t: "consumer good", d: "A product people use to meet their needs and wants, like food, clothing, or pottery.", why: "Once there was a surplus, specialists could make more consumer goods, which raised the standard of living." },
  { t: "domesticate", d: "To tame plants or animals so people can raise them for food or work.", why: "Domesticating plants and animals is what made farming, and settled life, possible." },
  { t: "economic want", d: "Something people desire that makes life better or easier, beyond what they need to survive.", why: "People kept developing new tools and technologies to meet their economic wants." },
  { t: "Fertile Crescent", d: "A curved region of rich farmland in the Middle East, along the Tigris and Euphrates rivers, where some of the first farming began.", why: "Its rivers and fertile soil made it one of the first places people settled and farmed." },
  { t: "floodplain", d: "Flat land next to a river that floods and gets covered with rich, fertile soil (silt).", why: "Floodplains had water and fertile soil, so early farmers settled there." },
  { t: "Homo sapiens", d: "The scientific name for modern humans, who first developed in Africa.", why: "Homo sapiens migrated out of Africa and spread across the world." },
  { t: "human resource", d: "People and the work or labor they do.", why: "Workers were needed to farm, dig canals, and make goods." },
  { t: "hunter-gatherer", d: "A person who gets food by hunting animals and gathering wild plants.", why: "This was how all early humans lived before farming." },
  { t: "Ice Age", d: "A long, cold period when huge ice sheets covered much of Earth and sea levels were lower.", why: "Low seas uncovered land bridges people used to migrate. When it ended and warmed, people settled near rivers." },
  { t: "irrigation", d: "Bringing water to crops using canals, ditches, or other systems.", why: "Irrigation let farmers control water and grow more food." },
  { t: "migrate / migration", d: "To move from one place to settle in another.", why: "Early humans migrated out of Africa to Asia, Europe, Australia, and the Americas." },
  { t: "natural resource", d: "Something from nature that people use, like water, fertile soil, plants, animals, and stone.", why: "Both hunter-gatherers and farmers depended on natural resources to survive." },
  { t: "Neolithic Revolution", d: "The shift from hunting and gathering to farming and living in permanent settlements, starting about 10,000 B.C.E.", why: "It was a major turning point that led to surplus, specialization, trade, and cities." },
  { t: "nomad / nomadic", d: "People who move from place to place instead of living in one permanent home.", why: "Nomads carried few possessions because they moved so often." },
  { t: "opportunity cost", d: "The next best thing you give up when you make a choice.", why: "Settling down to farm cost people the freedom and mobility of nomadic life." },
  { t: "scarcity", d: "Not having enough resources to meet everyone's needs and wants.", why: "Scarcity forces people to make choices, and every choice has an opportunity cost." },
  { t: "social class", d: "A group of people who share a similar level of wealth, power, or status.", why: "Differences in wealth and power in bigger societies led to social classes." },
  { t: "specialization", d: "When people focus on one kind of job or skill instead of doing everything themselves.", why: "A food surplus made specialization possible, and specialization encouraged trade." },
  { t: "standard of living", d: "How well people's needs and wants are being met.", why: "Better tools, homes, pottery, and food supplies improved the standard of living over time." },
  { t: "subsistence farming", d: "Growing just enough food to feed your own family, with little or nothing left over.", why: "The first farmers were subsistence farmers before better tools helped them make a surplus." },
  { t: "surplus", d: "More than what is needed; an extra amount.", why: "A food surplus meant not everyone had to farm, so villages could grow and people could specialize." },
  { t: "urbanization", d: "The process of villages growing into cities as more people live there.", why: "It is the last big step in the path from nomad camp to city." }

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
function numChoices(ans, extra = []) {
  const set = new Set([String(ans)]);
  extra.forEach(x => { if (set.size < 4 && x !== ans && Number.isFinite(x)) set.add(String(x)); });
  let tries = 0;
  while (set.size < 4 && tries++ < 50) {
    const d = rnd(1, Math.max(3, Math.round(Math.abs(ans) * .2) || 3)) * (Math.random() < .5 ? -1 : 1);
    const v = ans + d;
    if (ans >= 0 && v < 0) continue;
    set.add(String(v));
  }
  return [...set].slice(1);
}

function tone(freqs, dur = .12, type = "triangle", vol = .12) {

  const goalTxt = G.goal.type === "race" ? `Goal <b>$${fmt(G.goal.target)}</b> · <b>${formatTime(G.secs)}</b>` : `Time left <b>${formatTime(G.secs)}</b>`;

function nextQuestion() {
  if (G.over) return;
  const maker = G.deck.next();
  const q = maker();
  q.maker = maker;
  let tiles;
  if (q.kind === "mc") {
    q.opts = shuffle([q.a, ...q.w]);
    tiles = `<div class="tiles">${q.opts.map((o, n) => `<button class="tile c${n + 1}" data-v="${esc(o)}"><span class="k">${n + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else {
    tiles = `<div class="tiles six">${Object.entries(GRAPES_CATS).map(([k, v], n) => `<button class="tile c${n + 1}" data-v="${k}"><b>${k}</b><span>${v.name}</span></button>`).join("")}</div>`;
  }
  const prompt = q.kind === "grapes" ? `Which GRAPES category?<br><span class="def">${q.prompt}</span>` : q.prompt;
  $app.innerHTML = `${hudHtml()}<div class="qcard"><span class="tag">${q.tag}</span><p class="q">${prompt}</p></div>${tiles}`;
  document.getElementById("shop").addEventListener("click", openShop);
  const tilesEls = [...$app.querySelectorAll(".tile")];
  tilesEls.forEach(b => b.addEventListener("click", () => answer(q, b.dataset.v)));
  keyHandler = e => {
    if (document.querySelector(".shop")) return;
    if (e.key === "s" || e.key === "S") return openShop();
    if (q.kind === "mc" && /^[1-4]$/.test(e.key)) tilesEls[+e.key - 1].click();
    if (q.kind === "grapes") { const t = tilesEls.find(t => t.dataset.v === e.key.toUpperCase()); if (t) t.click(); }
  };
}

function answer(q, picked) {
  if (G.over) return;
  const ok = picked === q.a;
  G.total++;
  let delta = 0, note = "";
  if (ok) {
    delta = earnFor(G.streak) * G.bonus;
    if (G.bonus > 1) note = `×${G.bonus} bonus used!`;
    G.bonus = 1;
    G.money += delta; G.right++; G.streak++;
    G.bestStreak = Math.max(G.bestStreak, G.streak);
    sfx.right();
  } else {
    if (G.saver) { G.saver = false; note = "Streak Saver protected you!"; }
    else { delta = Math.min(G.money, lossFor()); G.money -= delta; G.streak = 0; if (val("ins") > 0) note = `Insurance saved you some money.`; }
    G.missed.set(q.prompt + q.a, q);
    G.deck.retry(q.maker);
    sfx.wrong();
  }
  const answerText = q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a);
  $app.innerHTML = `${hudHtml()}
    <div class="splash ${ok ? "good" : "bad"}">
      <h2>${ok ? pick(["Correct!", "Nice!", "You got it!", "Boom!", "Nailed it!"]) : "Incorrect"}</h2>
      <div class="delta">${ok ? "+" : "−"}$${fmt(delta)}</div>
      ${note ? `<p class="note">${note}</p>` : ""}
      ${ok ? "" : `<p class="ans">Correct answer: <b>${answerText}</b></p>`}
      <p class="why">${q.why}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="cont">Continue</button><button class="btn gold" id="shop2">Shop</button></div>
    </div>`;
  document.getElementById("shop").addEventListener("click", openShop);
  document.getElementById("shop2").addEventListener("click", openShop);
  const cont = document.getElementById("cont");
  cont.focus();
  cont.addEventListener("click", nextQuestion);
  keyHandler = e => {
    if (document.querySelector(".shop")) return;
    if (e.key === "s" || e.key === "S") return openShop();
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cont.click(); }
  };
  if (G.goal.type === "race" && G.money >= G.goal.target) setTimeout(endGame, 900);
}

function endGame() {
  if (G.over) return;
  G.over = true;
  clearInterval(G.timer);
  closeShop();
  keyHandler = null;
  const race = G.goal.type === "race";
  const best = store.get("best", {});
  const prev = best[G.goalKey];
  const score = race ? G.secs : G.money;
  const newBest = prev == null || (race ? score < prev : score > prev);
  if (newBest) { best[G.goalKey] = score; store.set("best", best); }
  let rank = RANKS[0].name;
  RANKS.forEach(r => { if (G.money >= r.at) rank = r.name; });
  const acc = G.total ? Math.round(G.right / G.total * 100) : 0;
  const missed = [...G.missed.values()].map(q => `<div class="miss"><b>${q.kind === "grapes" ? q.prompt : q.prompt.replace(/<br>/g, " ")}</b>Answer: ${q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a)}</div>`).join("");
  sfx.buy();

      <div class="stat"><span>Right answers</span><b>${G.right}/${G.total}</b></div>

    </div>

  document.getElementById("again").addEventListener("click", startGame);

function startDig() {
  closeShop();
  stopSlope();
  clearInterval(D?.timer);
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const t = { dug: r === 0, boulder: r > 0 && Math.random() < .07, res: null, art: -1 };
      t.hp = fullHp(r, t);
      grid[r].push(t);
    }
  }
  const startC = Math.floor(COLS / 2);
  const freeCell = L => {
    const rows = layerRows(L);
    let r, c, n = 0;
    do { r = rows[rnd(0, rows.length - 1)]; c = rnd(0, COLS - 1); n++; }
    while ((grid[r][c].res || grid[r][c].art >= 0 || (r === 1 && c === startC)) && n < 500);
    return grid[r][c];
  };
  ARTIFACTS.forEach((a, i) => { freeCell(a.layer).art = i; });
  Object.entries(RES).forEach(([k, R]) => {
    const total = R.layers.reduce((a, b) => a + b, 0);
    for (let i = 0; i < R.count; i++) {
      let roll = Math.random() * total, L = 0;
      while (roll >= R.layers[L]) { roll -= R.layers[L]; L++; }
      const t = freeCell(L);
      t.res = k; t.boulder = false; t.hp = R.hard;
    }
  });
  D = { grid, pos: [0, startC], tier: 0, inv: Object.fromEntries(Object.keys(RES).map(k => [k, 0])), found: [], won: false,
        interval: Q_START, nextQ: Q_START, asking: false, answered: false, deepest: 0,
        streak: 0, bestStreak: 0, right: 0, total: 0, missed: new Map(), deck: makeDeck(currentSet()), secs: 0, over: false };
  D.timer = setInterval(digTick, 1000);
  renderDig();
}

function museumHtml() {
  return `<div class="topline"><span class="label">Hidden artifacts · ${D.found.length}/${ARTIFACTS.length}</span><button class="iconbtn" id="d-end">Finish game</button></div>
    <ul class="museum">${ARTIFACTS.map((a, i) => `<li>${D.found.includes(i) ? GEM + esc(a.name) : `<span class="soft">Layer ${a.layer + 1}: ???</span>`}</li>`).join("")}</ul>`;
}
function updateMuseum() {
  const m = document.getElementById("museum");
  if (!m) return;
  m.innerHTML = museumHtml();
  document.getElementById("d-end").addEventListener("click", endDig);
}
function cellClass(r, c) {
  const t = D.grid[r][c], me = D.pos[0] === r && D.pos[1] === c;
  const cls = r === 0 ? "sky" : t.dug ? "dug" : `dirt l${layerOf(r)}${t.boulder ? " boulder" : ""}`;
  return `cell ${cls}${!t.dug && t.hp < fullHp(r, t) ? " cracked" : ""}${me ? " me" : ""}`;
}
function cellInner(r, c) {
  const t = D.grid[r][c];
  if (D.pos[0] === r && D.pos[1] === c) return GIM;
  return !t.dug && t.res ? resIcon(t.res) : "";
}
function paintCell(r, c) {
  const el = D.els?.[r]?.[c];
  if (!el) return;
  el.className = cellClass(r, c);
  el.innerHTML = cellInner(r, c);
  const t = D.grid[r][c];
  el.setAttribute("aria-label", D.pos[0] === r && D.pos[1] === c ? "Your Gim" : t.dug ? "Tunnel" : t.res ? RES[t.res].name : t.boulder ? "Boulder" : "Dirt");
}

function renderDig() {
  if (D.over) return;
  keyHandler = e => {
    if (document.querySelector(".shop")) return;
    const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] };
    const d = dirs[e.key] || dirs[e.key.toLowerCase?.()];
    if (d) { e.preventDefault(); tapTile(D.pos[0] + d[0], D.pos[1] + d[1]); }
    if (e.key === "c" || e.key === "C") openCraft();
    if (e.key === "q" || e.key === "Q") openQuestion();
  };
  const old = document.getElementById("site");
  const scroll = old ? [old.scrollLeft, old.scrollTop] : null;
  let cells = "";
  for (let r = 0; r < ROWS; r++) {
    const L = layerOf(r);
    if (r > 0 && layerOf(r - 1) !== L) cells += `<div class="layer-label"><span class="ll">Layer ${L + 1} · ${LAYERS[L].name} <span>${LAYERS[L].era}</span></span></div>`;
    for (let c = 0; c < COLS; c++) cells += `<button class="${cellClass(r, c)}" data-r="${r}" data-c="${c}">${cellInner(r, c)}</button>`;
  }
  $app.innerHTML = `<div class="hud dighud" id="hud"></div>
    <div class="site" id="site"><div class="grid" id="dgrid">${cells}</div></div>
    <p class="soft hint">Tip: use the arrow keys or WASD, or tap a tile next to your Gim. Tap any tunnel you've dug to walk back to it.</p>
    <div class="panel" id="museum"></div>`;
  D.els = [];
  $app.querySelectorAll("#dgrid .cell").forEach(b => { const r = +b.dataset.r, c = +b.dataset.c; (D.els[r] ||= [])[c] = b; });
  document.getElementById("dgrid").addEventListener("click", e => { const b = e.target.closest(".cell"); if (b) tapTile(+b.dataset.r, +b.dataset.c); });
  updateHud();
  updateMuseum();
  const site = document.getElementById("site");
  if (scroll) { site.scrollLeft = scroll[0]; site.scrollTop = scroll[1]; }
  ensureVisible(!scroll);
}
function ensureVisible(force) {
  const site = document.getElementById("site"), me = D.els?.[D.pos[0]]?.[D.pos[1]];
  if (!site || !me) return;
  const x = me.offsetLeft, y = me.offsetTop, m = 70;
  if (force || x < site.scrollLeft + m || x > site.scrollLeft + site.clientWidth - m) site.scrollLeft = x - site.clientWidth / 2;
  if (force || y < site.scrollTop + m || y > site.scrollTop + site.clientHeight - m) site.scrollTop = y - site.clientHeight / 2;
}
function moveTo(r, c) {
  const [or, oc] = D.pos;
  D.pos = [r, c];
  D.deepest = Math.max(D.deepest, r);
  paintCell(or, oc); paintCell(r, c);
  updateHud();
  ensureVisible();
}

function reachable(tr, tc) {
  const seen = new Set([D.pos.join()]), q = [D.pos];
  while (q.length) {
    const [r, c] = q.shift();
    if (r === tr && c === tc) return true;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && D.grid[nr][nc].dug && !seen.has(nr + "," + nc)) { seen.add(nr + "," + nc); q.push([nr, nc]); }
    });
  }
  return false;
}

function tapTile(r, c) {
  if (D.over || D.asking || r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  const t = D.grid[r][c];
  if (t.dug) { if (reachable(r, c)) moveTo(r, c); return; }
  if (Math.abs(r - D.pos[0]) + Math.abs(c - D.pos[1]) !== 1) return toast("Dig a tile right next to your Gim.");
  if (t.res && RES[t.res].tier > D.tier) return toast(`${RES[t.res].name} is too hard. Craft a ${TOOLS[RES[t.res].tier].name} first!`);
  t.hp -= tool().power;
  tone([300, 240], .05, "square", .04);
  if (t.hp > 0) return paintCell(r, c);
  t.dug = true;
  if (t.res) { D.inv[t.res]++; sfx.right(); toast(`+1 ${RES[t.res].name}`); }
  moveTo(r, c);
  if (t.art >= 0) { D.found.push(t.art); updateMuseum(); showFind(t.art); }
}

function showFind(i) {
  sfx.buy();
  const a = ARTIFACTS[i];
  const el = document.createElement("div");
  el.className = "shop";
  el.setAttribute("role", "dialog");
  el.innerHTML = `<div class="shop-inner find">
    <span class="label">Artifact found!</span>
    <div class="findcard">${GEM}<div><h2>${esc(a.name)}</h2><p>${esc(a.fact)}</p><p class="soft">GRAPES: <b>${a.g} = ${GRAPES_CATS[a.g].name}</b> · from the ${LAYERS[a.layer].name} layer</p></div></div>
    <button class="btn go" id="f-ok">Keep digging</button></div>`;
  document.body.appendChild(el);
  const ok = el.querySelector("#f-ok");
  ok.focus();
  ok.addEventListener("click", () => el.remove());
}

/* Crafting */
const canCraft = i => Object.entries(TOOLS[i].cost).every(([k, n]) => D.inv[k] >= n);
function openCraft() {
  if (D.over || D.asking) return;
  closeShop();
  const el = document.createElement("div");
  el.className = "shop";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", "Crafting");
  document.body.appendChild(el);
  renderCraft();
}
function closeCraft() { closeShop(); updateHud(); }
function renderCraft() {
  const el = document.querySelector(".shop");
  if (!el) return;
  const items = TOOLS.map((t, i) => {
    if (i === 0) return "";
    const owned = D.tier >= i, next = D.tier === i - 1;
    const recipe = Object.entries(t.cost).map(([k, n]) => `<span class="need ${D.inv[k] >= n ? "ok" : ""}">${resIcon(k)}${D.inv[k]}/${n} ${RES[k].name}</span>`).join("");
    return `<div class="item${owned ? " owned" : ""}"><h3>${t.name}</h3><p>${t.can}</p><div class="recipe">${recipe}</div>
      <button class="btn" data-craft="${i}" ${owned || !next || !canCraft(i) ? "disabled" : ""}>${owned ? "Crafted" : !next ? `Craft the ${TOOLS[i - 1].name} first` : canCraft(i) ? "Craft it!" : "Need more resources"}</button></div>`;
  }).join("");
  const trades = TRADES.map((t, i) => `<div class="item"><h3>Market: ${t.n} ${RES[t.give].name} → 1 ${RES[t.get].name}</h3><p>${t.why}</p>
      <button class="btn" data-trade="${i}" ${D.inv[t.give] >= t.n ? "" : "disabled"}>${D.inv[t.give] >= t.n ? "Trade" : `Need ${t.n} ${RES[t.give].name}`}</button></div>`).join("");
  el.innerHTML = `<div class="shop-inner">
    <div class="shop-top"><h2>Crafting</h2><button class="btn go" id="close">Back to digging</button></div>
    ${invHtml()}
    <p class="soft" style="font-size:.9rem">Every tool needs wheat to feed the toolmaker. A food surplus is what let people specialize in jobs like toolmaking!</p>
    <div class="items">${items}</div>
    <h3>Village market</h3>
    <div class="items">${trades}</div></div>`;
  el.querySelector("#close").addEventListener("click", closeCraft);
  el.addEventListener("click", e => { if (e.target === el) closeCraft(); });
  el.querySelectorAll("[data-craft]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.craft;
    if (D.tier !== i - 1 || !canCraft(i)) return;
    Object.entries(TOOLS[i].cost).forEach(([k, n]) => { D.inv[k] -= n; });
    D.tier = i;
    sfx.buy();
    if (i === TOOLS.length - 1) return showWin();
    toast(`You crafted a ${TOOLS[i].name}!`);
    renderCraft();
  }));
  el.querySelectorAll("[data-trade]").forEach(b => b.addEventListener("click", () => {
    const t = TRADES[+b.dataset.trade];
    if (D.inv[t.give] < t.n) return;
    D.inv[t.give] -= t.n; D.inv[t.get]++; sfx.buy();
    toast(`Traded ${t.n} ${RES[t.give].name} for 1 ${RES[t.get].name}`);
    renderCraft();
  }));
  el.querySelector("#close").focus();
}
function showWin() {
  D.won = true;
  if (D.winTime == null) {
    D.winTime = D.secs;
    const best = store.get("best", {});
    if (best.dig == null || D.secs < best.dig) { best.dig = D.secs; store.set("best", best); D.newBest = true; }
  }
  const el = document.querySelector(".shop");
  el.innerHTML = `<div class="shop-inner find" style="text-align:center;align-items:center">
    <span class="label">You win!</span>
    <h2>You crafted the Titanium Pickaxe!</h2>
    <p>Time: <b>${formatTime(D.secs)}</b>${D.newBest ? " · New fastest win!" : ""}</p>
    <p class="soft">Keep exploring to find every artifact, or see your results.</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="w-keep">Keep exploring</button><button class="btn gold" id="w-end">See results</button></div></div>`;
  el.querySelector("#w-keep").addEventListener("click", closeCraft);
  el.querySelector("#w-end").addEventListener("click", endDig);
}

/* Pop-up questions: right answers stretch the time to the next one (up to 2 min), wrong answers shrink it (down to 10 s). */
function openQuestion() {
  if (D.over) return;
  closeShop();
  D.asking = true; D.answered = false;
  const el = document.createElement("div");
  el.className = "shop qover";
  el.setAttribute("role", "dialog");
  document.body.appendChild(el);
  const maker = D.deck.next(), q = maker();
  q.maker = maker;
  el.innerHTML = `<div class="shop-inner">
    <div class="shop-top"><h2>Question time!</h2><span class="soft">Streak <b class="gold-t">${D.streak}</b></span></div>
    ${questionHtml(q)}</div>`;
  tone([523, 659, 784], .08);
  const tl = [...el.querySelectorAll(".tile")];
  tl.forEach(b => b.addEventListener("click", () => answerDig(q, b.dataset.v)));
  keyHandler = e => {
    if (q.kind === "mc" && /^[1-4]$/.test(e.key) && tl[+e.key - 1]) tl[+e.key - 1].click();
    if (q.kind === "grapes") { const t = tl.find(t => t.dataset.v === e.key.toUpperCase()); if (t) t.click(); }
  };
}
function questionHtml(q) {
  let tiles;
  if (q.kind === "mc") {
    q.opts = shuffle([q.a, ...q.w]);
    tiles = `<div class="tiles">${q.opts.map((o, n) => `<button class="tile c${n + 1}" data-v="${esc(o)}"><span class="k">${n + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else {
    tiles = `<div class="tiles six">${Object.entries(GRAPES_CATS).map(([k, v], n) => `<button class="tile c${n + 1}" data-v="${k}"><b>${k}</b><span>${v.name}</span></button>`).join("")}</div>`;
  }
  const prompt = q.kind === "grapes" ? `Which GRAPES category?<br><span class="def">${q.prompt}</span>` : q.prompt;
  return `<div class="qcard"><span class="tag">${q.tag}</span><p class="q">${prompt}</p></div>${tiles}`;
}
function questionReward() {
  // Reward something useful for the next tool. Rare gems still have to be dug up.
  const want = TOOLS[Math.min(D.tier + 1, TOOLS.length - 1)].cost;
  const common = D.tier >= 3 ? ["wheat", "copper", "iron", "diamond"] : ["wheat", "copper", "iron"];
  const short = Object.keys(want).filter(k => D.inv[k] < want[k] && common.includes(k));
  const k = short.length ? pick(short) : pick(common.slice(0, 3));
  const n = k === "wheat" ? 2 : 1;
  D.inv[k] += n;
  return `+${n} ${RES[k].name}`;
}
function answerDig(q, picked) {
  if (D.answered) return;
  D.answered = true;
  const el = document.querySelector(".qover");
  const ok = picked === q.a;
  D.total++;
  let reward = "";
  if (ok) {
    D.right++; D.streak++; D.bestStreak = Math.max(D.bestStreak, D.streak);
    D.interval = Math.min(Q_MAX, Math.round(D.interval * 1.5));
    reward = questionReward();
    sfx.right();
  } else {
    D.streak = 0;
    D.interval = Math.max(Q_MIN, Math.round(D.interval / 2));
    D.missed.set(q.prompt + q.a, q);
    D.deck.retry(q.maker);
    sfx.wrong();
  }
  D.nextQ = D.interval;
  const answerText = q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a);
  el.innerHTML = `<div class="shop-inner">
    <div class="splash ${ok ? "good" : "bad"}">
      <h2>${ok ? pick(["Correct!", "Nice!", "You got it!", "Boom!", "Nailed it!"]) : "Incorrect"}</h2>
      <div class="delta">${ok ? reward : "No reward"}</div>
      ${ok ? "" : `<p class="ans">Correct answer: <b>${answerText}</b></p>`}
      <p class="why">${q.why}</p>
      <p class="note">${ok ? `Next question in ${formatTime(D.interval)}. Keep it up!` : `The next question comes sooner: ${formatTime(D.interval)}.`}</p>
      <button class="btn go" id="q-back">Back to digging</button>
    </div></div>`;
  const back = el.querySelector("#q-back");
  back.focus();
  back.addEventListener("click", closeQuestions);
  keyHandler = e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); closeQuestions(); } };
}
function closeQuestions() {
  if (!D.answered) return;
  document.querySelector(".qover")?.remove();
  D.asking = false;
  renderDig();
}

function endDig() {
  if (D.over) return;
  D.over = true;
  clearInterval(D.timer);
  closeShop();
  keyHandler = null;
  const acc = D.total ? Math.round(D.right / D.total * 100) : 0;
  const missed = [...D.missed.values()].map(q => `<div class="miss"><b>${q.kind === "grapes" ? q.prompt : q.prompt.replace(/<br>/g, " ")}</b>Answer: ${q.kind === "grapes" ? `${q.a} = ${GRAPES_CATS[q.a].name}` : esc(q.a)}</div>`).join("");
  const found = D.found.map(i => `<div class="miss good-l"><b>${esc(ARTIFACTS[i].name)}</b>${esc(ARTIFACTS[i].fact)}</div>`).join("");
  $app.innerHTML = `
    <div class="panel" style="text-align:center;align-items:center">
      <span class="label">${D.won ? "You win!" : "Dig finished"}</span>
      <h2>${D.won ? `You crafted the Titanium Pickaxe in ${formatTime(D.winTime)}!` : `Best tool: ${tool().name}`}</h2>
      <p class="soft">Deepest dig: <b>${D.deepest} m</b> · ${D.found.length}/${ARTIFACTS.length} artifacts · total time ${formatTime(D.secs)}</p>
      ${D.newBest ? `<p style="color:var(--gold);font-weight:700">New fastest win!</p>` : ""}
    </div>
    <div class="statgrid">
      <div class="stat"><span>Accuracy</span><b>${acc}%</b></div>
      <div class="stat"><span>Right answers</span><b>${D.right}/${D.total}</b></div>
      <div class="stat"><span>Best streak</span><b>${D.bestStreak}</b></div>
    </div>
    <div class="panel">
      ${missed ? `<h3>Study these again</h3><div class="missed">${missed}</div>` : D.total ? `<h3>No missed questions. Nice!</h3>` : ""}
      ${found ? `<h3>What your artifacts taught you</h3><div class="missed">${found}</div>` : ""}
      <div class="row"><button class="btn go" id="again">Dig again</button><button class="btn" id="home">Back to menu</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startDig);
  document.getElementById("home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Slope Run (brain-break game) ---------- */
let S = null;
const HW = 2.2; // half the track width
function stopSlope() {
  if (!S) return;
  cancelAnimationFrame(S.raf);
  window.removeEventListener("keydown", S.kd);
  window.removeEventListener("keyup", S.ku);
  window.removeEventListener("resize", S.rs);
  S = null;
}
function slopeSeg(i) {
  if (i < 0) return { gaps: [], blocks: [] };
  while (S.segs.length <= i) {
    const n = S.segs.length, d = Math.min(1, n / 700), seg = { gaps: [], blocks: [] };
    const spacing = d > .6 ? 2 : 3;
    if (n > 25 && n - S.lastObs >= spacing && Math.random() < .2 + .3 * d) {
      S.lastObs = n;
      if (Math.random() < .6) {
        const w = .8 + Math.random() * (.6 + .6 * d), x0 = -HW + Math.random() * (2 * HW - w);
        seg.blocks.push([x0, x0 + w]);
        if (d > .4 && Math.random() < .35) { const x1 = x0 > 0 ? -HW + Math.random() * .6 : HW - .6 - Math.random() * .6; seg.blocks.push([x1, x1 + .6]); }
      } else {
        const w = 1 + Math.random() * (.8 + .6 * d);
        const kind = Math.random();
        seg.gaps.push(kind < .4 ? [-HW - 1, -HW + w] : kind < .8 ? [HW - w, HW + 1] : [-w / 2, w / 2]);
      }
    }
    S.segs.push(seg);
  }
  return S.segs[i];
}
function startSlope() {
  stopSlope();
  closeShop();
  if (D && !D.over) { D.over = true; clearInterval(D.timer); }
  keyHandler = null;
  $app.innerHTML = `
    <div class="panel slope-wrap">
      <div class="topline"><span class="label">Slope Run</span><button class="iconbtn" id="s-home">Back to menu</button></div>
      <div class="slope-stage" id="stage"><canvas id="slope"></canvas>
        <div class="slope-over" id="s-over"><h2>Slope Run</h2><p>Steer with the arrow keys or A and D.<br>On a phone, hold the left or right side of the screen.</p><button class="btn go" id="s-go">Start</button></div>
      </div>
      <div class="row steer"><button class="btn" id="s-l" aria-label="Steer left">◀ Left</button><button class="btn" id="s-r" aria-label="Steer right">Right ▶</button></div>
    </div>`;
  document.getElementById("s-home").addEventListener("click", showHome);
  S = { segs: [], lastObs: 0, dir: 0, keys: { l: false, r: false }, raf: 0, running: false };
  const cv = document.getElementById("slope"), stage = document.getElementById("stage");
  const resize = () => {
    const w = stage.clientWidth, h = Math.min(560, Math.max(340, Math.round(window.innerHeight * .6)));
    const dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px";
    S.W = w; S.H = h; S.ctx = cv.getContext("2d"); S.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!S.running) drawSlope();
  };
  S.rs = resize;
  S.kd = e => {
    if (["ArrowLeft", "a", "A"].includes(e.key)) { S.keys.l = true; e.preventDefault(); }
    if (["ArrowRight", "d", "D"].includes(e.key)) { S.keys.r = true; e.preventDefault(); }
    if ((e.key === " " || e.key === "Enter") && !S.running) { e.preventDefault(); slopeGo(); }
  };
  S.ku = e => {
    if (["ArrowLeft", "a", "A"].includes(e.key)) S.keys.l = false;
    if (["ArrowRight", "d", "D"].includes(e.key)) S.keys.r = false;
  };
  window.addEventListener("keydown", S.kd);
  window.addEventListener("keyup", S.ku);
  window.addEventListener("resize", S.rs);
  const hold = (el, side) => {
    el.addEventListener("pointerdown", e => { e.preventDefault(); S.keys[side] = true; });
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => el.addEventListener(t, () => { if (S) S.keys[side] = false; }));
  };
  hold(document.getElementById("s-l"), "l");
  hold(document.getElementById("s-r"), "r");
  cv.addEventListener("pointerdown", e => { const left = e.offsetX < S.W / 2; S.keys[left ? "l" : "r"] = true; S.keys[left ? "r" : "l"] = false; });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => cv.addEventListener(t, () => { if (S) { S.keys.l = false; S.keys.r = false; } }));
  document.getElementById("s-go").addEventListener("click", slopeGo);
  Object.assign(S, { x: 0, vx: 0, dist: 0, speed: 9, fall: 0, dead: false });
  resize();
}
function slopeGo() {
  if (!S) return;
  Object.assign(S, { segs: [], lastObs: 0, x: 0, vx: 0, dist: 0, speed: 9, fall: 0, dead: false, deadT: 0, running: true, last: performance.now() });
  document.getElementById("s-over").hidden = true;
  tone([392, 523, 659], .08);
  const loop = t => {
    if (!S) return;
    const dt = Math.min(.05, (t - S.last) / 1000); S.last = t;
    slopeStep(dt);
    drawSlope();
    if (S && S.running) S.raf = requestAnimationFrame(loop);
  };
  S.raf = requestAnimationFrame(loop);
}
function slopeStep(dt) {
  if (S.dead) {
    S.deadT += dt;
    if (S.dead === "fall") { S.fall += dt * 9 * (1 + S.deadT * 2); S.dist += S.speed * dt * .4; }
    if (S.deadT > .9) slopeOver();
    return;
  }
  const dir = (S.keys.r ? 1 : 0) - (S.keys.l ? 1 : 0);
  S.vx += dir * 26 * dt;
  S.vx *= Math.exp(-(dir ? 2.5 : 7) * dt);
  S.vx = Math.max(-6, Math.min(6, S.vx));
  S.x += S.vx * dt;
  S.speed = Math.min(26, 9 + S.dist * .012);
  S.dist += S.speed * dt;
  const seg = slopeSeg(Math.floor(S.dist));
  if (Math.abs(S.x) > HW + .15 || seg.gaps.some(([a, b]) => S.x > a && S.x < b)) { S.dead = "fall"; sfx.wrong(); }
  else if (seg.blocks.some(([a, b]) => S.x + .3 > a && S.x - .3 < b)) { S.dead = "crash"; sfx.wrong(); }
}
function drawSlope() {
  const { ctx, W, H } = S;
  if (!ctx) return;
  const camH = 1.5, F = H * .62, hor = H * .26, camZ = S.dist - 3, camX = S.x * .55;
  const X = (x, z) => W / 2 + (x - camX) * F / (z - camZ);
  const Y = (y, z) => hor + (camH - y) * F / (z - camZ);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#05030f"); sky.addColorStop(.26, "#1a0f3d"); sky.addColorStop(.27, "#04020a"); sky.addColorStop(1, "#000");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(57,255,136,.15)"; ctx.fillRect(0, hor - 2, W, 3);
  const far = Math.floor(S.dist) + 70, near = Math.floor(camZ + .5);
  const drawSeg = i => {
    const seg = slopeSeg(i);
    const z0 = Math.max(i, camZ + .35), z1 = i + 1;
    if (z1 <= z0) return;
    const fog = Math.max(0, 1 - (z0 - camZ) / 72);
    let pieces = [[-HW, HW]];
    seg.gaps.forEach(([a, b]) => { pieces = pieces.flatMap(([p, q]) => [[p, Math.min(q, a)], [Math.max(p, b), q]]).filter(([p, q]) => q - p > .01); });
    pieces.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(X(a, z0), Y(0, z0)); ctx.lineTo(X(b, z0), Y(0, z0)); ctx.lineTo(X(b, z1), Y(0, z1)); ctx.lineTo(X(a, z1), Y(0, z1)); ctx.closePath();
      ctx.fillStyle = i % 2 ? `rgba(14,48,30,${fog})` : `rgba(9,34,22,${fog})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(57,255,136,${.85 * fog})`; ctx.lineWidth = 1.2; ctx.stroke();
    });
    seg.blocks.forEach(([a, b]) => {
      const h = .75;
      ctx.beginPath();
      ctx.moveTo(X(a, z0), Y(h, z0)); ctx.lineTo(X(b, z0), Y(h, z0)); ctx.lineTo(X(b, z1), Y(h, z1)); ctx.lineTo(X(a, z1), Y(h, z1)); ctx.closePath();
      ctx.fillStyle = `rgba(255,120,140,${fog})`; ctx.fill();
      ctx.fillStyle = `rgba(255,40,80,${fog})`;
      ctx.fillRect(X(a, z0), Y(h, z0), X(b, z0) - X(a, z0), Y(0, z0) - Y(h, z0));
      ctx.strokeStyle = `rgba(255,200,210,${fog})`; ctx.strokeRect(X(a, z0), Y(h, z0), X(b, z0) - X(a, z0), Y(0, z0) - Y(h, z0));
    });
  };
  const ballSeg = Math.floor(S.dist);
  for (let i = far; i > ballSeg; i--) drawSeg(i);
  // ball
  const r = .35, bz = S.dist, bx = X(S.x, bz), by = Y(r - S.fall, bz), br = r * F / (bz - camZ);
  const g = ctx.createRadialGradient(bx - br * .35, by - br * .35, br * .1, bx, by, br);
  g.addColorStop(0, "#d9fff0"); g.addColorStop(.5, "#39ff88"); g.addColorStop(1, "#0b6b3a");
  const drawBall = () => { ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fillStyle = S.dead === "crash" ? "#ff3355" : g; ctx.fill(); };
  if (S.fall > 0) drawBall();
  for (let i = ballSeg; i >= near; i--) drawSeg(i);
  if (!S.fall) drawBall();
  ctx.fillStyle = "#e9fff3"; ctx.font = "700 20px Rowdies, system-ui, sans-serif";
  ctx.fillText(`${Math.floor(S.dist)} m`, 14, 30);
  ctx.font = "13px system-ui, sans-serif"; ctx.fillStyle = "rgba(233,255,243,.7)";
  ctx.fillText(`Best ${fmt(store.get("best", {}).slope || 0)} m · speed ${Math.round(S.speed * 3.6)} km/h`, 14, 50);
}
function slopeOver() {
  S.running = false;
  const d = Math.floor(S.dist), best = store.get("best", {});
  const nb = !best.slope || d > best.slope;
  if (nb) { best.slope = d; store.set("best", best); }
  const o = document.getElementById("s-over");
  o.innerHTML = `<h2>${S.dead === "crash" ? "Crash!" : "You fell!"}</h2><p class="big money">${d} m</p><p>${nb ? "New best distance!" : `Best: ${fmt(best.slope)} m`}</p><div class="row" style="justify-content:center"><button class="btn go" id="s-go">Play again</button><button class="btn" id="s-menu">Menu</button></div>`;
  o.hidden = false;
  document.getElementById("s-go").addEventListener("click", slopeGo);
  document.getElementById("s-menu").addEventListener("click", showHome);
  document.getElementById("s-go").focus();
}

/* ---------- Timeline ---------- */
function startTimeline() {
  keyHandler = null;
  const st = { next: 0, mistakes: 0, missesHere: 0, pool: shuffle(TIMELINE.map((t, i) => ({ t, i }))) };
  const render = () => {
    if (st.next === TIMELINE.length) return timelineDone(st);
    $app.innerHTML = `
      <div class="panel">
        <div class="topline"><span class="label">Timeline</span><span id="tl-count">${st.next} of ${TIMELINE.length} placed · ${st.mistakes} mistakes</span></div>
        <h2>${st.next === 0 ? "What happened first?" : "What happened next?"}</h2>
        ${st.next ? `<ol class="placed">${TIMELINE.slice(0, st.next).map((t, i) => `<li><b>${i + 1}.</b><span>${esc(t)}</span></li>`).join("")}</ol>` : ""}
        <div class="pool">${st.pool.map(p => `<button data-i="${p.i}" class="${st.missesHere >= 2 && p.i === st.next ? "hint" : ""}">${esc(p.t)}</button>`).join("")}</div>
        ${st.missesHere >= 2 ? `<p class="soft">Hint: the gold card comes next.</p>` : ""}
        <button class="btn" id="home">Back to menu</button>
      </div>`;
    document.getElementById("home").addEventListener("click", showHome);
    $app.querySelectorAll(".pool button").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      if (i === st.next) {
        sfx.right();
        st.pool = st.pool.filter(p => p.i !== i);
        st.next++; st.missesHere = 0;
        render();
      } else {
        sfx.wrong();
        st.mistakes++; st.missesHere++;
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        if (st.missesHere === 2) render();
        else document.getElementById("tl-count").textContent = `${st.next} of ${TIMELINE.length} placed · ${st.mistakes} mistakes`;
      }
    }));
  };
  render();
}
function timelineDone(st) {
  $app.innerHTML = `
    <div class="panel">
      <span class="label">Timeline complete</span>
      <div class="big">${st.mistakes} ${st.mistakes === 1 ? "mistake" : "mistakes"}</div>
      <p>${st.mistakes === 0 ? "Perfect order! You know how the story goes." : "Read the full order once more, then try for zero mistakes."}</p>
      <ol class="placed">${TIMELINE.map((t, i) => `<li><b>${i + 1}.</b><span>${esc(t)}</span></li>`).join("")}</ol>
      <div class="row"><button class="btn go" id="again">Try again</button><button class="btn" id="home">Back to menu</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startTimeline);
  document.getElementById("home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Focus question flashcards ---------- */
function startFocus() {
  keyHandler = null;
  const st = { i: 0, got: 0, practice: [] };
  const render = () => {
    if (st.i === FOCUS.length) return focusDone(st);
    const f = FOCUS[st.i];
    $app.innerHTML = `
      <div class="panel flash">
        <div class="topline"><span class="label">Focus Question ${st.i + 1} of ${FOCUS.length}</span></div>
        <h2>${esc(f.q)}</h2>
        <p class="soft" id="say">Say your answer out loud (or tell a parent), then check it.</p>
        <div id="ans" hidden><h3>A strong answer includes:</h3><ul>${f.a.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="row" id="ctl"><button class="btn gold" id="show">Show answer</button><button class="btn" id="home">Back to menu</button></div>
      </div>`;
    document.getElementById("home").addEventListener("click", showHome);
    document.getElementById("show").addEventListener("click", () => {
      document.getElementById("ans").hidden = false;
      document.getElementById("say").hidden = true;
      document.getElementById("ctl").innerHTML = `<button class="btn go" id="got">I got it</button><button class="btn" id="more">I need more practice</button>`;
      document.getElementById("got").addEventListener("click", () => { st.got++; st.i++; render(); });
      document.getElementById("more").addEventListener("click", () => { st.practice.push(f); st.i++; render(); });
    });
  };
  render();
}
function focusDone(st) {
  $app.innerHTML = `
    <div class="panel">
      <span class="label">Focus Questions</span>
      <div class="big">${st.got} / ${FOCUS.length}</div>
      <p>${st.practice.length ? "Study these again. Try writing each answer in your own words:" : "You can answer every focus question. Great preparation!"}</p>
      ${st.practice.length ? `<div class="missed">${st.practice.map(f => `<div class="miss"><b>${esc(f.q)}</b>${f.a.map(esc).join(" ")}</div>`).join("")}</div>` : ""}
      <div class="row"><button class="btn go" id="again">Go through them again</button><button class="btn" id="home">Back to menu</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startFocus);
  document.getElementById("home").addEventListener("click", showHome);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

showHome();
</script>
