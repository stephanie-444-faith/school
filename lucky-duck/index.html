<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Duck Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Pond world: teal water, duck-yellow, clover green. One bright theme on purpose. */
  --pond:#0E7C86; --pond-deep:#0B4F59; --water:#DDF3F1; --paper:#F6FBFA;
  --sun:#FFC83D; --bill:#F28C28; --clover:#2FA35A; --ink:#12343A; --muted:#55747A;
  --bad:#D9485F; --card:#FFFFFF;
  --display:'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
  /* Layout: top bar, then one view at a time (pond map, round, results, shop, grown-ups) in a centered column. */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 10% 0%,#E6F6F3 0,transparent 40%),radial-gradient(circle at 100% 30%,#FFF6DA 0,transparent 35%);}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--bill);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
.app{max-width:900px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--display);font-size:22px;font-weight:700;color:var(--pond-deep)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid #CFE6E3;border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.tbtn{background:var(--card);border:2px solid #CFE6E3;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.tbtn:hover{border-color:var(--pond)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(160deg,#0E7C86,#0B4F59);color:#fff;border-radius:28px;padding:20px 24px;margin-top:4px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;background:#127F89;border-radius:50%;opacity:.6}
.hero h1{font-size:30px}
.hero p{margin:6px 0 14px;opacity:.92}
.hero .duckwrap{position:relative;z-index:1}
.hero>div{position:relative;z-index:1}
.bigbtn{background:var(--sun);color:var(--ink);border:0;border-radius:18px;padding:14px 22px;font-family:var(--display);font-size:22px;font-weight:600;box-shadow:0 5px 0 #D69C12;transition:transform .08s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #D69C12}
.bigbtn.green{background:var(--clover);color:#fff;box-shadow:0 5px 0 #1F7A40}
.ghost{background:transparent;border:2px solid currentColor;border-radius:16px;padding:10px 18px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.region{background:var(--card);border-radius:24px;padding:18px;margin-top:18px;border:2px solid #E1EFED;position:relative}
.region h2{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.region .blurb{color:var(--muted);margin:2px 0 12px;font-size:16px}
.tag{font-family:var(--body);font-size:13px;font-weight:800;background:#FFF1C2;color:#7A5300;padding:3px 10px;border-radius:999px}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pad{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--water);border:2px solid transparent;border-radius:18px;padding:12px 14px;font-weight:800;font-size:16px;position:relative}
.pad:hover{border-color:var(--pond)}
.pad .lvl{font-size:13px;color:var(--muted);font-weight:700}
.pad.done{background:#E3F5E7}
.stars{display:inline-flex;gap:2px}
.srcdot{position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--bill)}
.legend{font-size:14px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:6px}
.legend .srcdot{position:static}
/* round */
.roundtop{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:10px;border-radius:6px;background:#D6E9E6}
.dots i.ok{background:var(--clover)}.dots i.no{background:#F2A7B3}.dots i.cur{background:var(--sun)}
.qwrap{display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:start}
.qcard{background:var(--card);border-radius:26px;padding:22px;border:2px solid #E1EFED;min-height:300px}
.skilllbl{font-size:14px;font-weight:800;color:var(--pond);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.prompt{font-size:22px;font-weight:700}
.prompt .big,.big{font-family:var(--display);font-size:34px;font-weight:600;margin:8px 0;font-variant-numeric:tabular-nums}
.visual{margin:14px 0;overflow-x:auto}
.pic{max-width:100%;height:auto;display:block}
.svgt{font-family:var(--display);font-size:16px;font-weight:600;fill:var(--ink)}
.coint{font-family:var(--body);font-weight:800;fill:#2A3B3F}
.bars{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.barrow{display:flex;align-items:center;gap:10px}
.barlabel{min-width:44px;text-align:center;font-size:20px;font-weight:800}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .18em}
.fr>span:first-child{border-bottom:.12em solid currentColor}
.gap{display:inline-block;width:.15em}
.qbox{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.4em;border:2.5px dashed var(--bill);border-radius:8px;color:var(--bill);font-weight:800;padding:0 .2em}
.fr .qbox{height:1.25em;min-width:1.3em}
.seq{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-family:var(--display);font-size:30px;font-weight:600}
.seq>span{min-width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center;background:var(--water);border-radius:14px;padding:0 8px}
.seq .qbox{height:56px;background:#FFF4E5}
.shapes{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.sh{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;background:var(--water);border-radius:10px}
.sh.qbox{min-width:42px;height:42px;background:#FFF4E5}
.wordsq{font-family:var(--display);font-size:26px;margin:10px 0;color:var(--pond-deep)}
.calc{display:inline-flex;flex-direction:column;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:700;line-height:1.25;background:var(--water);padding:10px 18px;border-radius:14px;margin:6px 0}
.calc span{white-space:pre}
.calc .rule{border-top:4px solid var(--ink);margin-top:4px;padding-top:2px}
.answer{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.inp{font-family:var(--display);font-size:30px;font-weight:600;width:170px;padding:8px 12px;border:3px solid #BFDCD8;border-radius:16px;background:#fff;color:var(--ink);text-align:center}
.inp:focus{border-color:var(--pond);outline:none}
.inp.sm{width:78px;font-size:26px;padding:4px 6px}
.fracin{display:inline-flex;align-items:center;gap:10px}
.fstack{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fstack hr{width:84px;border:0;border-top:4px solid var(--ink);margin:0}
.unitlbl{font-family:var(--display);font-size:28px;font-weight:600}
.cmpbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-size:34px;font-weight:600}
.cmpbtns .side{font-variant-numeric:tabular-nums}
.sym{width:68px;height:68px;border-radius:50%;border:3px solid #BFDCD8;background:#fff;font-family:var(--display);font-size:34px;font-weight:700}
.sym:hover{border-color:var(--pond)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%}
.choice{background:#fff;border:3px solid #BFDCD8;border-radius:16px;padding:12px;font-weight:800;font-size:18px;text-align:left;min-height:58px;display:flex;align-items:center;justify-content:center}
.choice:hover{border-color:var(--pond)}
.choice[disabled],.sym[disabled]{opacity:.35;cursor:not-allowed}
.feedback{margin-top:16px;border-radius:18px;padding:14px 16px;display:none;font-size:18px}
.feedback.show{display:block}
.feedback.good{background:#E3F5E7}
.feedback.try{background:#FFF4E0}
.feedback.sol{background:#EAF3FF}
.feedback .steps{margin:8px 0;padding-left:22px}
.qactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.side-duck{position:sticky;top:76px;text-align:center}
.bubble{background:#fff;border:2px solid #E1EFED;border-radius:18px;padding:10px 12px;font-weight:700;font-size:15px;position:relative;margin-bottom:6px}
.bubble::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
.askbtn{background:var(--pond);color:#fff;border:0;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;width:100%;margin-top:6px}
.hintbtn{background:#FFF1C2;border:0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px}
/* results, shop, grown-ups */
.panel{background:var(--card);border-radius:26px;padding:22px;border:2px solid #E1EFED;margin-top:16px}
.score{font-family:var(--display);font-size:56px;font-weight:700;color:var(--sun)}
.feel{display:flex;gap:10px;flex-wrap:wrap}
.feel button{background:var(--water);border:3px solid transparent;border-radius:16px;padding:10px 14px;font-weight:800}
.feel button.on{border-color:var(--pond);background:#fff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.item{background:var(--water);border-radius:20px;padding:12px;text-align:center;border:3px solid transparent}
.item.on{border-color:var(--clover);background:#E3F5E7}
.item b{display:block;margin:4px 0}
.item button{border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:var(--sun)}
.item button[disabled]{background:#E3E9E8;color:#7C9296;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #E1EFED;vertical-align:middle}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.chip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.rep{background:#FFE6CC;color:#8A4300}.chip.g4{background:#DDF1E3;color:#1F6B3A}.chip.sup{background:#E4EEF9;color:#28507E}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--water);border-radius:16px;padding:12px}
.stat b{font-family:var(--display);font-size:30px;display:block;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-weight:800;font-size:15px}
.field input{font-family:inherit;font-size:17px;padding:10px 12px;border:2px solid #BFDCD8;border-radius:12px}
.note{white-space:pre-wrap;background:var(--water);border-radius:16px;padding:14px;margin-top:10px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:15px}
/* chat */
.chat{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:center;pointer-events:none}
.chat.open{display:flex}
.chatbox{pointer-events:auto;width:min(620px,100%);max-height:72vh;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(11,79,89,.25);display:flex;flex-direction:column;border:2px solid #CFE6E3;border-bottom:0}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid #EEF5F4}
.chathead h3{font-size:20px;flex:1}
.msgs{overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:160px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:17px;white-space:pre-wrap}
.msg.duck{background:#FFF6D6;align-self:flex-start;border-bottom-left-radius:6px}
.msg.kid{background:var(--pond);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
.sugg button{background:var(--water);border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.chatin{display:flex;gap:8px;padding:10px 14px 14px}
.chatin input{flex:1;font-family:inherit;font-size:17px;padding:10px 14px;border:2px solid #BFDCD8;border-radius:14px}
.chatin button{background:var(--pond);color:#fff;border:0;border-radius:14px;padding:0 16px;font-weight:800}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}70%{transform:translateY(0) rotate(2deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.bounce,.shake{animation:none}}
@media (max-width:640px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr;text-align:center;padding:18px}
  .hero .duckwrap{justify-self:center}
  .qwrap{grid-template-columns:1fr}
  .side-duck{position:static;display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;text-align:left;order:-1}
  .side-duck .bubble::after{display:none}
  .side-duck .askbtn{grid-column:1/-1}
  .prompt{font-size:20px}
  .brand span{display:none}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
  <div class="top">
    <button class="brand" data-go="home" aria-label="Lucky Duck home"><span id="miniDuck"></span><span>Lucky Duck</span></button>
    <div class="spacer"></div>
    <span class="pill" title="Feathers" id="featherPill"></span>
    <span class="pill" title="Day streak" id="streakPill"></span>
    <button class="tbtn" data-go="shop">Duck shop</button>
    <button class="tbtn" data-go="parent">Grown-ups</button>
  </div>
  <main id="view"></main>
</div>
<div class="chat" id="chat" aria-live="polite">
  <div class="chatbox">
    <div class="chathead"><span id="chatDuck"></span><h3>Ask Lucky Duck</h3><button class="x" id="chatClose" aria-label="Close chat">×</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="sugg" id="sugg"></div>
    <form class="chatin" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Type your question…" maxlength="300" aria-label="Message to Lucky Duck"><button type="submit">Send</button></form>
  </div>
</div>
<script>
/* ===== Lucky Duck question engine (no DOM) ===== */
var NAME = (typeof NAME !== 'undefined') ? NAME : 'Dakota';
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fmt=n=>Number(n).toLocaleString('en-US');
const strip=x=>String(x).replace(/<[^>]+>/g,'');
const F=(n,d)=>`<span class="fr" data-t="${strip(n)}/${strip(d)}"><span>${n}</span><span>${d}</span></span>`;
const M=(w,n,d)=> n ? (w ? `${w}<span class="gap"></span>${F(n,d)}` : F(n,d)) : `${w}`;
const toMixed=(N,d)=>({w:Math.floor(N/d),n:N%d,d});
const fracVal=a=>a.w+(a.d?a.n/a.d:0);
const PLACES=['ones','tens','hundreds','thousands','ten thousands','hundred thousands'];
const FNAME={2:'halves',3:'thirds',4:'fourths',5:'fifths',6:'sixths',8:'eighths',10:'tenths',12:'twelfths',100:'hundredths'};
const FNAME1={2:'half',3:'third',4:'fourth',5:'fifth',6:'sixth',8:'eighth',10:'tenth',12:'twelfth'};
const Q=o=>Object.assign({type:'num',hint:[],solution:'',visual:'',nums:[]},o);

/* ---------- pictures ---------- */
const COL={fill:'#2FA35A',fill2:'#F28C28',line:'#12343A',empty:'#FFFFFF'};
function fracBar(n,d,o={}){
  const W=o.w||300,H=o.h||34,seg=W/d,c=o.color||COL.fill;
  let s=`<svg class="pic" viewBox="-2 -2 ${W+4} ${H+4}" width="${W+4}" height="${H+4}" role="img" aria-label="${n} out of ${d} parts shaded">`;
  for(let i=0;i<d;i++){
    let f=COL.empty; if(i<n) f=c; if(o.extra&&i>=n&&i<n+o.extra) f=COL.fill2;
    s+=`<rect x="${i*seg}" y="0" width="${seg}" height="${H}" fill="${f}" stroke="${COL.line}" stroke-width="2"/>`;
  }
  return s+'</svg>';
}
function barRow(label,n,d,o){return `<div class="barrow"><span class="barlabel">${label}</span>${fracBar(n,d,o)}</div>`}
function tape(d,k,part){
  const W=300,seg=W/d;
  let s=`<svg class="pic" viewBox="-4 -26 ${W+8} 90" width="${W+8}" height="90" role="img" aria-label="tape diagram">`;
  for(let i=0;i<d;i++) s+=`<rect x="${i*seg}" y="0" width="${seg}" height="34" fill="${i<k?COL.fill:'#fff'}" stroke="${COL.line}" stroke-width="2"/>`;
  s+=`<path d="M2 -6 v-6 H${k*seg-2} v6" fill="none" stroke="${COL.line}" stroke-width="2"/><text x="${k*seg/2}" y="-15" text-anchor="middle" class="svgt">${part}</text>`;
  s+=`<path d="M2 42 v6 H${W-2} v-6" fill="none" stroke="${COL.line}" stroke-width="2"/><text x="${W/2}" y="64" text-anchor="middle" class="svgt">whole = ?</text>`;
  return s+'</svg>';
}
const COINS={p:{v:1,r:15,c:'#C77B45',name:'penny'},n:{v:5,r:18,c:'#B9C2C6',name:'nickel'},d:{v:10,r:13,c:'#D3D9DC',name:'dime'},q:{v:25,r:21,c:'#C7CFD2',name:'quarter'}};
function coinsSVG(list,labelValue){
  let x=4,s='',H=50;
  list.forEach(k=>{const c=COINS[k];s+=`<g><circle cx="${x+c.r}" cy="25" r="${c.r}" fill="${c.c}" stroke="#5b6b70" stroke-width="2"/><text x="${x+c.r}" y="${labelValue?29:28}" text-anchor="middle" class="coint" font-size="${labelValue?11:(k==='d'?7:8)}">${labelValue?c.v+'¢':c.name.toUpperCase()}</text></g>`;x+=c.r*2+6;});
  return `<svg class="pic" viewBox="0 0 ${x} ${H}" width="${Math.min(x*1.4,520)}" height="${H*1.4}" role="img" aria-label="coins">${s}</svg>`;
}
const SHAPES={circle:{c:'#E5484D',n:'red circle'},tri:{c:'#2F7DE1',n:'blue triangle'},sq:{c:'#F2B705',n:'yellow square'},star:{c:'#8E4EC6',n:'purple star'},heart:{c:'#E86FA6',n:'pink heart'}};
function shapeSVG(k,sz=34){
  const c=SHAPES[k].c;let p='';
  if(k==='circle')p=`<circle cx="17" cy="17" r="13" fill="${c}"/>`;
  if(k==='tri')p=`<polygon points="17,3 31,30 3,30" fill="${c}"/>`;
  if(k==='sq')p=`<rect x="5" y="5" width="24" height="24" rx="3" fill="${c}"/>`;
  if(k==='star')p=`<polygon points="17,2 21,13 32,13 23,20 27,31 17,24 7,31 11,20 2,13 13,13" fill="${c}"/>`;
  if(k==='heart')p=`<path d="M17 30 C3 20 2 11 8 7 C12 4 16 6 17 10 C18 6 22 4 26 7 C32 11 31 20 17 30Z" fill="${c}"/>`;
  return `<svg viewBox="0 0 34 34" width="${sz}" height="${sz}" role="img" aria-label="${SHAPES[k].n}">${p}</svg>`;
}
function calc(a,b,op,res){
  const L=Math.max(String(a).length,String(b).length,res!=null?String(res).length:0)+2;
  return `<div class="calc" aria-label="${a} ${op} ${b}"><span>${String(a).padStart(L)}</span><span>${op} ${String(b).padStart(L-2)}</span><span class="rule">${res!=null?String(res).padStart(L):' '.repeat(L)}</span></div>`;
}
function areaModel(parts,b){
  const tot=parts.reduce((x,y)=>x+y,0);let x=30,s='';const W=320;
  parts.forEach(p=>{const w=Math.max(70,W*p/tot);s+=`<rect x="${x}" y="24" width="${w}" height="60" fill="${p>=100?'#CDEFD9':p>=10?'#E3F4FA':'#FFF1CF'}" stroke="${COL.line}" stroke-width="2"/><text x="${x+w/2}" y="16" text-anchor="middle" class="svgt">${p}</text><text x="${x+w/2}" y="60" text-anchor="middle" class="svgt">${p*b}</text>`;x+=w;});
  s+=`<text x="14" y="60" text-anchor="middle" class="svgt">${b}</text>`;
  return `<svg class="pic" viewBox="0 0 ${x+4} 90" width="${x+4}" height="90" role="img" aria-label="area model">${s}</svg>`;
}

/* ---------- words ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function u1000(n){const h=Math.floor(n/100),r=n%100,s=[];if(h)s.push(ONES[h]+' hundred');if(r)s.push(r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?'-'+ONES[r%10]:''));return s.join(' ')}
function words(n){if(n===0)return 'zero';const t=Math.floor(n/1000),r=n%1000,s=[];if(t)s.push(u1000(t)+' thousand');if(r)s.push(u1000(r));return s.join(' ')}
function relatedNums(n){
  const s=String(n),out=new Set();
  for(let i=0;i<s.length-1;i++){if(s[i]!==s[i+1]){const a=s.split('');[a[i],a[i+1]]=[a[i+1],a[i]];if(a[0]!=='0')out.add(+a.join(''))}}
  if(s.includes('0')){const z=s.replace('0','');if(z.length)out.add(+z);}
  const i0=s.indexOf('0');if(i0>0&&i0<s.length-1){const a=s.split('');a.splice(i0,1);a.push('0');out.add(+a.join(''));}
  out.delete(n);
  let tries=0;while(out.size<3&&tries<20){tries++;const m=n+pick([-1,1])*pick([10,100,90,9,1000]);if(m>0)out.add(m);out.delete(n);}
  return shuffle([...out]).slice(0,3);
}

/* ---------- subtraction / addition steps ---------- */
function subSteps(a,b){
  const da=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);
  while(db.length<da.length)db.push(0);const steps=[];
  for(let i=0;i<da.length;i++){
    if(i>=String(b).length&&da.slice(i).every(x=>x===0))break;
    const P=PLACES[i][0].toUpperCase()+PLACES[i].slice(1);
    if(da[i]<db[i]){
      const before=da[i];let j=i+1;while(da[j]===0)j++;
      for(let k=j;k>i;k--){da[k]-=1;da[k-1]+=10;}
      steps.push(`${P}: ${before} is less than ${db[i]}, so regroup${j>i+1?` (the next place is 0, so go to the ${PLACES[j]} and trade down one place at a time)`:''}. Now ${da[i]} − ${db[i]} = ${da[i]-db[i]}.`);
    }else steps.push(`${P}: ${da[i]} − ${db[i]} = ${da[i]-db[i]}.`);
  }
  return steps;
}
function borrowCount(a,b){const da=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);let c=0,bor=0;for(let i=0;i<da.length;i++){let x=da[i]-bor,y=db[i]||0;if(x<y){c++;bor=1}else bor=0;}return c}
function addSteps(a,b){
  const da=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);const L=Math.max(da.length,db.length);let carry=0;const st=[];
  for(let i=0;i<L;i++){const x=da[i]||0,y=db[i]||0,s=x+y+carry;const P=PLACES[i][0].toUpperCase()+PLACES[i].slice(1);
    st.push(`${P}: ${x} + ${y}${carry?' + 1 (carried)':''} = ${s}.${s>=10?` Write ${s%10}, carry 1 to the ${PLACES[i+1]}.`:''}`);carry=s>=10?1:0;}
  return st;
}
function carryCount(a,b){let c=0,k=0;while(a||b||k){const s=a%10+b%10+k;k=s>=10?1:0;c+=k;a=Math.floor(a/10);b=Math.floor(b/10);}return c}
const ol=a=>'<ol class="steps">'+a.map(x=>`<li>${x}</li>`).join('')+'</ol>';

  const tip=(a,b)=>({2:`Double ${b}.`,3:`${b} + ${b} + ${b}.`,4:`Double ${b}, then double again.`,5:`Count by 5s, or take ${b} × 10 and cut it in half.`,6:`5 × ${b} = ${5*b}, plus one more ${b}.`,7:`5 × ${b} = ${5*b}, plus 2 × ${b} = ${2*b}.`,8:`Double, double, double: ${b} → ${2*b} → ${4*b} → ?`,9:`10 × ${b} = ${10*b}, minus one ${b}.`,10:`Put a zero on the end of ${b}.`}[a]||`Skip count by ${a}.`);
  let a,b;
  if(l===1){a=pick([2,3,4,5,10]);b=R(1,10);}else if(l===2){a=pick([6,7,8,9]);b=R(2,10);}
  else{a=R(3,9);b=R(3,9);const p=a*b;if(Math.random()<.5)return Q({answer:b,prompt:`<div class="big">${a} × <span class="qbox">?</span> = ${p}</div>`,hint:[`Count by ${a}s until you reach ${p}.`,tip(a,b)],solution:`${a} × <b>${b}</b> = ${p}.`});
    return Q({answer:b,prompt:`<div class="big">${p} ÷ ${a} = ?</div>`,hint:[`Think: ${a} times what makes ${p}?`,`Count by ${a}s to ${p}. How many jumps?`],solution:`${a} × ${b} = ${p}, so ${p} ÷ ${a} = <b>${b}</b>.`});}
  const [x,y]=Math.random()<.5?[a,b]:[b,a];
  return Q({answer:a*b,prompt:`<div class="big">${x} × ${y} = ?</div>`,hint:[tip(a,b)],solution:`${tip(a,b)} ${x} × ${y} = <b>${a*b}</b>.`});
}},
{id:'hadd',region:'compute',src:'report',name:'Adding big numbers (across)',gen(l){
  let a,b;
  do{if(l===1){a=R(15,89);b=R(15,89);}else if(l===2){a=R(150,899);b=R(150,899);}else{a=R(1200,8999);b=R(150,999);}}
  while(carryCount(a,b)<(l===1?1:2));
  const s=a+b;
  return Q({answer:s,prompt:`<div class="big">${fmt(a)} + ${fmt(b)} = ?</div>`,commaOk:true,
    hint:[`Stack the numbers so the places line up, ones under ones:${calc(a,b,'+')}`,addSteps(a,b)[0]],
    solution:calc(a,b,'+',s)+ol(addSteps(a,b))});
}},
{id:'borrow',region:'compute',src:'report',name:'Subtracting with regrouping',gen(l){
  let a,b;
  if(l===1){do{a=R(300,999);b=R(100,a-50)}while(borrowCount(a,b)<2||String(a).includes('0'));}
  else if(l===2){do{a=R(3,9)*100+pick([0,0,R(1,9)]);b=R(101,a-11)}while(Math.floor(a/10)%10!==0||a%10>=b%10&&a%10!==0||borrowCount(a,b)<2);}
  else{do{const t=R(2,9);a=t*1000+pick([0,0,R(1,9),R(1,9)*10]);if(Math.floor(a/100)%10!==0)continue;b=R(1001,a-11)}while(borrowCount(a,b)<2||Math.floor(a/100)%10!==0);}
  const d=a-b;
  return Q({answer:d,prompt:`Subtract:`,visual:calc(a,b,'−'),commaOk:true,
    hint:[`Start with the ones. Is there enough to subtract? If not, regroup from the next place.`,subSteps(a,b)[0]],
    solution:calc(a,b,'−',d)+ol(subSteps(a,b))+`<p>Check: ${fmt(d)} + ${fmt(b)} = ${fmt(a)} ✔</p>`,textPrompt:`Subtract: ${a} − ${b}`});
}},
{id:'mult21',region:'compute',src:'report',name:'Multiplying 2-digit × 1-digit',gen(l){
  let a,b;
  do{if(l===1){a=R(12,29);b=R(2,5);}else if(l===2){a=R(23,98);b=R(3,9);}else{a=R(112,489);b=R(3,9);}}while((a%10)*b<10);
  const parts=String(a).split('').map((x,i,s)=>+x*Math.pow(10,s.length-1-i)).filter(x=>x);
  return Q({answer:a*b,prompt:`<div class="big">${a} × ${b} = ?</div>`,commaOk:true,
    hint:[`Break ${a} into ${parts.join(' + ')}.`,`Multiply each part by ${b}: ${parts.map(p=>`${p} × ${b}`).join(' and ')}. Then add.`],
    solution:areaModel(parts,b)+`<p>${parts.map(p=>`${p} × ${b} = ${p*b}`).join('<br>')}<br>${parts.map(p=>p*b).join(' + ')} = <b>${fmt(a*b)}</b></p>`});
}}
];

function ansText(q){
  if(q.type==='frac'){const a=q.answer;return a.n?(a.w?`${a.w} ${a.n}/${a.d}`:`${a.n}/${a.d}`):String(a.w)}

  if(q.type==='mc')return (q.choiceText||q.choices)[q.answer];

}
function checkAnswer(q,r){
  if(q.type==='num')return Math.abs(r-q.answer)<1e-9;

}

const ding=()=>tone([[660,.12],[880,.18]]),bonk=()=>tone([[300,.15],[240,.2]]),fanfare=()=>tone([[523,.14],[659,.14],[784,.14],[1046,.3]]);
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,s:Math.random()*8+4,c:['#FFC83D','#2FA35A','#F28C28','#2F7DE1','#E86FA6'][Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();

function welcomeView(){return `<div class="hero"><div class="duckwrap">${duck(150,'none','happy')}</div><div><h1>Quack! I'm Lucky Duck.</h1><p>I'm your math buddy. We'll practice a little each day, and you'll earn feathers to dress me up.</p></div></div>

const TRYS=['Not yet. Let\'s look again.','Close one! Try another way.','Mistakes help your brain grow. Try again!','Hmm, check that once more.'];

function readAnswer(q){
  if(q.type==='num'||q.type==='money'){const v=$('#aNum').value.replace(/[,$¢\s]/g,'');if(v===''||isNaN(+v))return {err:'Type a number first.'};return {v:+v};}
  if(q.type==='frac'){const w=$('#aW').value.trim(),n=$('#aN').value.trim(),d=$('#aD').value.trim();
    if(!w&&!n&&!d)return {err:'Type your answer first.'};if((n&&!d)||(!n&&d))return {err:'Fill in both the top and the bottom of the fraction.'};
    if(d&&+d===0)return {err:'The bottom number can\'t be 0.'};if([w,n,d].some(x=>x&&!/^\d+$/.test(x)))return {err:'Use whole numbers in each box.'};
    return {v:{w:+w||0,n:n?+n:0,d:d?+d:1}};}
}
function showFb(cls,html){const fb=$('#fb');fb.className='feedback show '+cls;fb.innerHTML=html;}
function setDuck(text,mood){duckSay=text;const b=$('#duckBubble');if(b)b.textContent=text;const d=$('#sideDuck');if(d){d.innerHTML=duck(130,S.wearing,mood);d.firstElementChild.classList.add(mood==='happy'?'bounce':'shake');}}
function submit(resp){
  const it=round.items[round.i],q=it.q;if(it.result!==null)return;
  const r=checkAnswer(q,resp);

  q.tries++;
  if(r===true){it.result=true;const pts=(q.tries===1&&q.hints===0)?2:1;round.earned+=pts;S.feathers+=pts;record(it.skill,true);ding();
    setDuck(pick(CHEERS),'happy');showFb('good',`<b>${pick(CHEERS)}</b> +${pts} feather${pts>1?'s':''}.${q.tries>1?' You kept trying, and that\'s how you get better.':''}${q.tries===1&&q.hints===0?'':`<div style="margin-top:6px">${q.solution}</div>`}`);
    lockAnswers();nextBtn();save();refreshTop();return;}
  bonk();$('#qcard').classList.remove('shake');void $('#qcard').offsetWidth;$('#qcard').classList.add('shake');
  if(q.type==='mc'){const b=document.querySelector(`[data-ch="${resp}"]`);if(b)b.disabled=true;}

  q.lastWrong=q.type==='frac'?(resp.n?`${resp.w?resp.w+' ':''}${resp.n}/${resp.d}`:String(resp.w)):q.type==='mc'?plain((q.choiceText||q.choices)[resp]):String(resp);
  if(q.tries===1&&!(q.type==='cmp')){setDuck(pick(TRYS),'smile');const h=q.hint[Math.min(q.hints,q.hint.length-1)];if(q.hint.length&&q.hints<q.hint.length)q.hints++;

  if(q.type==='cmp'&&q.tries===1){setDuck(pick(TRYS),'smile');showFb('try',`<b>Not that one.</b>${q.hint[0]?' Hint: '+q.hint[0]:''}`);q.hints=Math.max(q.hints,1);return;}
  it.result=false;record(it.skill,false);setDuck('Let\'s learn this one together.','smile');
  showFb('sol',`<b>Here's how to solve it.</b> The answer is <b>${esc(ansText(q))}</b>.<div style="margin-top:8px">${q.solution}</div>`);
  lockAnswers();nextBtn(true);save();
}
function lockAnswers(){document.querySelectorAll('#answerArea input,#answerArea button').forEach(e=>e.disabled=true);const h=$('#hintBtn');if(h)h.remove();}
function nextBtn(explain){const a=$('#qactions');a.innerHTML=`<button class="bigbtn" id="nextBtn">${round.i===round.items.length-1?'See my results':'Next'}</button>${explain&&canAsk()?`<button class="hintbtn" data-chat="explain">Explain it a different way</button>`:''}`;$('#nextBtn').focus();}
function record(id,ok){const s=sk(id);s.tries++;if(ok)s.right++;s.last=today();s.recent.push(ok?1:0);if(s.recent.length>6)s.recent.shift();
  const last5=s.recent.slice(-5),c=last5.reduce((a,b)=>a+b,0);
  if(s.recent.length>=4&&c>=4){const before=s.stars;s.stars=Math.max(s.stars,s.lvl);if(s.stars>before)round.levelUps.push({id,stars:s.stars});s.lvl=Math.min(3,s.lvl+1);s.recent=[];}
  else if(s.lvl>1&&s.recent.length>=4&&s.recent.slice(-4).reduce((a,b)=>a+b,0)<=1){s.lvl--;s.recent=[];}
}
function next(){round.i++;if(round.i>=round.items.length)return finish();makeQ(round.i);makeQ(round.i+1);duckSay=pick(['Take your time. You can do this!','Read it carefully, then go for it!','You\'ve got this.','Think like a math duck!']);renderRound();scrollTo({top:0,behavior:'smooth'});}
function finish(){

  round.session={d:t,title:round.title,right,total:tot,mins,skills:[...new Set(round.items.map(x=>x.skill))]};
  S.sessions.push(round.session);if(S.sessions.length>80)S.sessions=S.sessions.slice(-80);

}

/* ---------- chat with Lucky Duck ---------- */
let chat=[],chatBusy=false;
const SYS=()=>`You are Lucky Duck, a cheerful, patient duck who coaches math inside a practice app for ${S.name}, a 4th grader in Montgomery County, Maryland. Her class uses Amplify Desmos Math, so use its kinds of pictures and words: fraction strips, tape diagrams, number lines, area models, place value, "regroup".
Rules:
- Talk to a 9-year-old: short sentences, 2 to 5 sentences total, warm and encouraging. A little duck humor is fine sometimes, not every message.
- Coach, don't tell. Give one small step or ask one guiding question at a time.
- Do not give the final answer to the current problem. If she has already tried twice and is stuck, you may walk through all the steps.
- If she tells you an answer, say whether it's right and why.
- Praise effort and strategies. Never call anything "easy". If she says she's bad at math, remind her that mistakes help brains grow.
- Only talk about math and learning. If she asks about something else, kindly bring it back to math.
- Never ask for personal information.
- Plain text only: no markdown, no LaTeX, no bullet symbols. Write fractions like 3/4.`;
function openChat(auto){
  if(!canAsk())return;$('#chat').classList.add('open');$('#chatDuck').innerHTML=duck(36);
  if(!chat.length)chat.push({role:'assistant',content:round?`Quack! I'm here. What part of this problem is tricky?`:`Quack! Ask me anything about math. Fractions are my favorite.`,local:true});
  drawChat();if(auto)sendChat(auto);else $('#chatInput').focus();
}
function drawChat(){
  $('#msgs').innerHTML=chat.map(m=>`<div class="msg ${m.role==='user'?'kid':'duck'}">${esc(m.content||'…')}</div>`).join('');$('#msgs').scrollTop=1e6;
  const s=round?['Give me a hint','I don\'t get the question','Explain it a different way','Is my answer right?']:['What is a fraction?','How do I compare fractions?','Help with making change'];
  $('#sugg').innerHTML=s.map(x=>`<button type="button" data-say="${esc(x)}">${esc(x)}</button>`).join('');
}
async function sendChat(text){
  text=text.trim();if(!text||chatBusy)return;chatBusy=true;chat.push({role:'user',content:text});const reply={role:'assistant',content:''};chat.push(reply);drawChat();
  const it=round&&round.items[round.i],q=it&&it.q;
  const ctx=q?`Current problem: ${q.storyText||qText(q)}\nCorrect answer (secret, follow the rules about revealing it): ${ansText(q)}\nHow to solve it: ${plain(q.solution)}\nHer tries so far: ${q.tries}${q.lastWrong?` (her last wrong answer: ${q.lastWrong})`:''}${it.result!==null?'\nThis problem is finished, so you may explain the full solution.':''}`:`She is on the home screen, not working on a problem right now.`;
  let hist=chat.slice(0,-1).filter(m=>!m.local).slice(-10);while(hist.length&&hist[0].role!=='user')hist.shift();
  const msgs=[{role:'user',content:SYS()+'\n\n'+ctx+'\n\nThe conversation with her follows. Reply as Lucky Duck to her latest message.'},{role:'assistant',content:'Quack! Ready to help.'},...hist.map(m=>({role:m.role,content:m.content}))];
  try{await sampleFn(msgs,{cache:false,onText:({text})=>{reply.content=text;const els=document.querySelectorAll('.msg.duck');if(els.length)els[els.length-1].textContent=text;$('#msgs').scrollTop=1e6;}}).then(r=>{reply.content=(r.text||reply.content||'').trim();});}
  catch(e){reply.content=e&&e.code==='rate_limited'?'Lucky Duck needs a quick nap. Try again in a minute!':e&&e.code==='not_granted'?'I can\'t chat right now, but the hints and steps still work.':'Oops, my quack got stuck. Try asking again.';reply.local=true;if(e&&e.code==='not_granted'){sampleOk=false;}}
  chatBusy=false;drawChat();
}
async function progressNote(){
  const b=$('#noteBtn'),n=$('#note');b.disabled=true;n.style.display='block';n.textContent='Lucky Duck is reading the numbers…';
  const rows=SKILLS.map(s=>{const st=sk(s.id);return `${s.name} [${s.src==='report'?'Mathnasium gap':s.src==='g4'?'grade 4 fractions':'support'}]: stars ${st.stars}/3, level ${st.lvl}, ${st.right}/${st.tries} right${st.last?', last '+st.last:''}`}).join('\n');
  const p=`You are writing a short progress note for the parent of ${S.name}, a 4th grader in Montgomery County Public Schools (class uses Amplify Desmos Math). Baseline: a Mathnasium Level 3 (end of 3rd grade) check on Nov 8, 2026 showed 17 of 39 skills mastered. This app practices the gaps from that report plus grade 4 fractions. Today is ${today()}.\nPractice data:\n${rows}\nRounds played: ${S.sessions.length}, minutes: ${S.minutes}, day streak: ${S.streak.count}. Recent confidence check-ins: ${S.sessions.filter(x=>x.feel).slice(-5).map(x=>x.feel).join(', ')||'none'}.\nWrite 3 short paragraphs in plain text (no markdown): what's going well, the 2 or 3 skills to focus on next and why, and one quick at-home idea that uses everyday life (cooking, shopping, coins, measuring). Be honest and specific. If there's very little data yet, say so and suggest how often to practice. Don't overstate: this is practice data, not a diagnosis.`;
  try{await sampleFn(p,{cache:false,onText:({text})=>{n.textContent=text}}).then(r=>{n.textContent=r.text});}
  catch(e){n.textContent=e&&e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Couldn\'t write the note right now. The table above has the details.';}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.start){startRound(t.dataset.start);return;}
  if(t.dataset.chat){openChat(t.dataset.chat==='explain'?'Can you explain this one a different way?':null);return;}
  if(t.dataset.say){sendChat(t.dataset.say);return;}
  if(t.dataset.sym){submit(t.dataset.sym);return;}
  if(t.dataset.ch){submit(+t.dataset.ch);return;}
  if(t.dataset.feel){round.feel=t.dataset.feel;round.session.feel=t.dataset.feel;save();document.querySelectorAll('[data-feel]').forEach(b=>b.classList.toggle('on',b===t));setTimeout(()=>{const msg={worried:'Thanks for telling me. We\'ll keep practicing together!',ok:'Getting it is great. A little more practice and you\'ll be a pro!',great:'Yes! Confidence looks good on you!'}[t.dataset.feel];const h=document.querySelector('.hero p');if(h)h.textContent=msg;},50);return;}
  if(t.dataset.buy){const h=HATS[t.dataset.buy];if(S.feathers>=h.cost){S.feathers-=h.cost;S.owned.push(t.dataset.buy);S.wearing=t.dataset.buy;save();fanfare();confetti();render();}return;}
  if(t.dataset.wear){S.wearing=t.dataset.wear;save();render();return;}
  if(t.id==='checkBtn'){const it=round.items[round.i];const a=readAnswer(it.q);if(a.err){showFb('try',a.err);return;}submit(a.v);return;}
  if(t.id==='hintBtn'){const q=round.items[round.i].q;if(!q.hint.length||q.hints>=q.hint.length){showFb('sol',`<b>Here's how:</b><div style="margin-top:6px">${q.solution}</div><p class="small muted">Now try it! (Since you saw the steps, this one won't count toward your stars.)</p>`);q.sawSolution=true;q.hints=99;return;}
    showFb('try',`<b>Hint ${q.hints+1}:</b> ${q.hint[q.hints]}`);q.hints++;if(q.hints>=q.hint.length)t.textContent='Show me how';else t.textContent='Another hint';return;}
  if(t.id==='nextBtn'){next();return;}
  if(t.id==='chatClose'){$('#chat').classList.remove('open');return;}
  if(t.id==='noteBtn'){progressNote();return;}
  if(t.id==='backupBtn'){const code='LD1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#backupCode').value=code;$('#backupOut').style.display='block';$('#backupCode').select();return;}
  if(t.id==='copyBtn'){const v=$('#backupCode').value;try{navigator.clipboard.writeText(v).then(()=>{$('#copyMsg').textContent='Copied!'},()=>{$('#backupCode').select();$('#copyMsg').textContent='Press Ctrl+C (or Cmd+C) to copy.'});}catch(err){$('#backupCode').select();$('#copyMsg').textContent='Press Ctrl+C (or Cmd+C) to copy.';}return;}
  if(t.id==='restoreBtn'){const m=$('#restoreMsg');try{const raw=$('#restoreCode').value.trim();if(!raw.startsWith('LD1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));if(!o||o.v!==1||typeof o.skills!=='object')throw 0;S=Object.assign(fresh(),o);S.welcomed=true;NAME=S.name;save();render();const m2=$('#restoreMsg');if(m2){m2.textContent='Progress restored!';m2.style.color='var(--clover)';}}catch(err){m.textContent='That code didn\'t work. Check that you copied the whole thing, starting with LD1:';m.style.color='var(--bad)';}return;}
  if(t.id==='resetBtn'){$('#resetConfirm').style.display='block';return;}
  if(t.id==='resetNo'){$('#resetConfirm').style.display='none';return;}
  if(t.id==='resetYes'){const keep={name:S.name,favorites:S.favorites,welcomed:true,sound:S.sound};S=Object.assign(fresh(),keep);save();render();return;}
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='welcomeForm'){S.name=($('#wName').value.trim()||'Dakota').slice(0,30);if($('#wFav'))S.favorites=$('#wFav').value.trim().slice(0,80);S.welcomed=true;NAME=S.name;save();go('home');}
  if(e.target.id==='settingsForm'){S.name=($('#sName').value.trim()||'Dakota').slice(0,30);if($('#sFav'))S.favorites=$('#sFav').value.trim().slice(0,80);S.sound=$('#sSound').checked;NAME=S.name;save();render();}
  if(e.target.id==='chatForm'){const v=$('#chatInput').value;$('#chatInput').value='';sendChat(v);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&view==='round'&&e.target.classList&&e.target.classList.contains('inp')){e.preventDefault();const b=$('#checkBtn');if(b&&!b.disabled)b.click();else{const n=$('#nextBtn');if(n)n.click();}}});
// a hint that showed the full solution means the question can't earn a star
const _record=record;record=function(id,ok){const q=round&&round.items[round.i]&&round.items[round.i].q;if(q&&q.sawSolution&&ok){const s=sk(id);s.tries++;s.right++;s.last=today();return;}_record(id,ok);};
render();initCloud();initSample();
</script>
