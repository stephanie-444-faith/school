<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Team</title>
<meta name="description" content="Build your dream team: buy real players, win matches, open reward packs, train your stars and climb the leagues.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Stadium at night in each sport's colors. One theme per sport on purpose. */
:root{--bg:#06140d;--bg2:#0d2a1a;--panel:rgba(16,40,27,.92);--panel2:#183823;--line:#2a5a3c;--soft:#c8e4d2;--gold:#ffcc33;--gold-d:#a8800f;--accent:#2fbf71;--accent2:#7cf0ad;color-scheme:dark}
body[data-sport="lacrosse"]{--bg:#06122a;--bg2:#0e2550;--panel:rgba(14,34,70,.92);--panel2:#16305a;--line:#2c4a7a;--soft:#c9d6ea;--accent:#ff6a13;--accent2:#ffb27a}
body[data-sport="football"]{--bg:#120a05;--bg2:#2a180c;--panel:rgba(42,26,14,.92);--panel2:#3a2616;--line:#6a4a2a;--soft:#eedfc8;--accent:#e0a526;--accent2:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;color:#fff;font-family:Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lights{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 8% 0,rgba(255,250,220,.22),transparent 30%),radial-gradient(circle at 92% 0,rgba(255,250,220,.22),transparent 30%);animation:flick 5s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.6}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:Bungee,sans-serif;font-weight:400;color:var(--gold);font-size:clamp(22px,4.6vw,34px);margin:0;text-shadow:0 3px 0 #6b4f00,0 0 18px rgba(255,204,51,.35)}
h1 .em{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-3px)}}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.pill.coins{border-color:var(--gold);color:#ffe08a}
.who{color:var(--soft);font-size:14px;margin:2px 0 0}
.tabs{display:flex;gap:6px;margin:12px 0 0;overflow-x:auto}
.tab{flex:1;min-width:max-content;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:900}
.tab.on{background:var(--accent);border-color:var(--accent2);color:#08130c;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 60%,transparent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.panel h2{font-family:Bungee,sans-serif;font-weight:400;font-size:18px;margin:0 0 8px;color:var(--accent2)}
.soft{color:var(--soft)}
.btn{font-family:Bungee,sans-serif;font-weight:400;font-size:18px;border:0;border-radius:14px;padding:12px 22px;background:var(--gold);color:#2a1a00;box-shadow:0 4px 0 var(--gold-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.alt{background:#e7eef5;color:#14202e;box-shadow:0 4px 0 #8a96a8}
.btn.go{background:linear-gradient(var(--accent2),var(--accent));color:#08130c;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.btn.small{font-size:13px;padding:7px 10px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px}
.chip.on{border-color:var(--gold);color:#ffe08a}
/* player cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;border-radius:14px;padding:10px 10px 8px;color:#1b1206;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:150px;box-shadow:0 6px 14px rgba(0,0,0,.35);isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.card.bronze{background:linear-gradient(150deg,#e6a06a,#a8612e)}
.card.silver{background:linear-gradient(150deg,#f0f4f8,#9aa6b4)}
.card.gold{background:linear-gradient(150deg,#ffe580,#d39a10)}
.card.legend{background:linear-gradient(150deg,#ffd7ff,#8a5cff 45%,#2a1a6a);color:#fff;box-shadow:0 0 18px rgba(170,120,255,.6),0 6px 14px rgba(0,0,0,.35)}
.card.legend .pos{background:rgba(255,255,255,.2);color:#fff}
.card .ovr{font-family:Bungee,sans-serif;font-size:30px;line-height:1}
.card .pos{align-self:flex-start;font-weight:900;font-size:11px;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 6px}
.card .nm{font-weight:900;font-size:15px;line-height:1.15;margin-top:2px}
.card .tier{font-size:11px;font-weight:800;opacity:.85}
.card .spt{position:absolute;right:8px;top:6px;font-size:26px;opacity:.9}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.card .acts .btn{box-shadow:0 2px 0 rgba(0,0,0,.35)}
.card .own{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:900;background:rgba(0,0,0,.25);color:#fff;border-radius:6px;padding:1px 6px}
.card.starter::after{content:"⭐ STARTER";position:absolute;left:0;right:0;top:0;text-align:center;font-size:10px;font-weight:900;letter-spacing:1px;background:rgba(0,0,0,.25);color:#fff}
.card.starter{padding-top:18px}
/* the lineup */
.pitch{border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;gap:10px;background:repeating-linear-gradient(90deg,#2b8a3e 0 50px,#33994a 50px 100px);border:3px solid rgba(255,255,255,.7)}
body[data-sport="lacrosse"] .pitch{background:repeating-linear-gradient(90deg,#2b8a3e 0 50px,#2f9444 50px 100px)}
body[data-sport="football"] .pitch{background:repeating-linear-gradient(90deg,#2f9444 0 47px,#ffffff 47px 50px)}
.line{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:118px;min-height:84px;border-radius:12px;border:2px dashed rgba(255,255,255,.8);background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center}
.slot b{font-family:Bungee,sans-serif;font-weight:400;font-size:22px;line-height:1}
.slot small{font-size:12px;font-weight:800;line-height:1.1}
.slot .p{font-size:10px;font-weight:900;opacity:.9;letter-spacing:1px}
.slot.filled{border-style:solid}
.slot.bronze{background:linear-gradient(150deg,#e6a06acc,#a8612ecc)}.slot.silver{background:linear-gradient(150deg,#f0f4f8cc,#9aa6b4cc);color:#14202e}.slot.gold{background:linear-gradient(150deg,#ffe580dd,#d39a10dd);color:#2a1a00}.slot.legend{background:linear-gradient(150deg,#ffd7ffcc,#8a5cffdd 45%,#2a1a6add);box-shadow:0 0 14px rgba(170,120,255,.6)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:900;font-size:14px}
.bar{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
/* match */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;background:#05080f;border:3px solid #33476b;border-radius:16px;padding:10px;box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
.score .tm{font-weight:900;font-size:14px;color:var(--soft)}
.score .num{font-family:Bungee,sans-serif;font-size:42px;letter-spacing:2px;color:#ffd84d;text-shadow:0 0 12px rgba(255,216,77,.7)}
.score .clk{font-family:Bungee,sans-serif;font-size:16px;color:#7cf0ad}
.field{position:relative;height:120px;margin-top:10px;border-radius:14px;overflow:hidden;border:3px solid rgba(255,255,255,.75);background:repeating-linear-gradient(90deg,#2b8a3e 0 40px,#33994a 40px 80px)}
body[data-sport="football"] .field{background:repeating-linear-gradient(90deg,#2f9444 0 37px,#ffffff 37px 40px)}
.field .mid{position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.8)}
.field .goalL,.field .goalR{position:absolute;top:30%;bottom:30%;width:8px;background:rgba(255,255,255,.9);border-radius:3px}
.field .goalL{left:4px}.field .goalR{right:4px}
.field .ball{position:absolute;top:50%;left:50%;font-size:30px;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.4,.1,.3,1),top .9s;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.field .flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,230,120,.65),transparent 70%);opacity:0;pointer-events:none}
.field .flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.prog{height:8px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cf0ad,#ffd84d);transition:width .8s linear}
.feed{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.feed li{background:var(--panel2);border-radius:10px;padding:8px 10px;font-weight:700;animation:in .35s ease-out}
.feed li.good{background:linear-gradient(90deg,#1f6a3a,#174a2b);border-left:5px solid #7cf0ad}
.feed li.bad{background:linear-gradient(90deg,#6a1f2a,#4a1720);border-left:5px solid #ff7a8a}
.feed li.big{font-family:Bungee,sans-serif;font-weight:400;font-size:18px}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.goalbig{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:Bungee,sans-serif;font-size:clamp(40px,11vw,96px);color:#ffd84d;text-shadow:0 6px 0 #6b4f00,0 0 30px rgba(255,216,77,.8);pointer-events:none;z-index:80;animation:boom 1.4s ease-out forwards;white-space:nowrap}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
/* modal, pack, toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.hidden{display:none}
.box{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;width:min(460px,100%);max-height:88vh;overflow-y:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box h3{font-family:Bungee,sans-serif;font-weight:400;font-size:22px;margin:0 0 6px;color:var(--gold)}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{font-family:Bungee,sans-serif;font-weight:400;font-size:18px;padding:14px;border-radius:14px;border:3px solid var(--line);background:var(--panel2)}
.choice:hover{border-color:var(--gold)}
.choice.right{background:#1f6a3a;border-color:#7cf0ad}.choice.wrong{background:#6a1f2a;border-color:#ff7a8a}.choice.theirs{outline:3px dashed #ffd84d}
.pack{perspective:900px;margin:12px auto;width:190px;height:260px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.4,.4,1)}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center}
.face.front{background:linear-gradient(150deg,var(--accent2),var(--accent) 50%,#111);font-size:70px;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 70%,transparent);animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.face.back{transform:rotateY(180deg)}
.face.back .card{width:100%;height:100%;font-size:110%}
.face.back .card .ovr{font-size:48px}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:70;animation:spark 1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.conf{position:fixed;top:-12px;width:8px;height:14px;z-index:75;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#0a1420;border:2px solid var(--gold);color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;z-index:90;opacity:0;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dots{display:flex;gap:6px;margin:8px 0}
.dots i{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:13px}
.dots i.W{background:#1f9d55}.dots i.D{background:#a8800f}.dots i.L{background:#b23a48}
.leagues{display:grid;gap:8px}
.lg{display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
.lg.now{border-color:var(--gold);box-shadow:0 0 12px rgba(255,204,51,.35)}
.lg.locked{opacity:.5}
.note{font-size:12px;color:var(--soft);opacity:.8;text-align:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){.lights,h1 .em,.card::before,.face.front,.feed li,.goalbig,.conf,.spark{animation:none}.goalbig{display:none}}
</style>
</head>

  if (theirs.length) pick(theirs).big = true;
  M = { opp, me, ev, i: 0, you: 0, them: 0, last: null, skip: false };
  $("view").innerHTML = `<div class="panel"><div class="score"><div><div class="tm">${esc(SAVE.name || "Your club")}</div><div class="num" id="sYou">0</div><div class="tm">⭐ ${me.ovr}</div></div><div class="clk" id="clk">${D.clock(0)}</div><div><div class="tm">${esc(opp.name)}</div><div class="num" id="sThem">0</div><div class="tm">⭐ ${opp.ovr}</div></div></div>
    <div class="field"><div class="mid"></div><div class="goalL"></div><div class="goalR"></div><div class="ball" id="ball">${D.emoji}</div><div class="flash" id="flash"></div></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn alt small" id="skip" type="button">⏩ Skip to the end</button></div>
    <ul class="feed" id="feed"></ul></div>`;
  $("skip").onclick = () => { M.skip = true; };
  sWhistle(); line(`📣 Kickoff! ${esc(SAVE.name || "Your club")} vs ${esc(opp.name)}.`);
  setTimeout(nextEvent, 900);
}
function line(t, cls = "") { const li = document.createElement("li"); li.className = cls; li.innerHTML = t; $("feed")?.prepend(li); }
const scorerName = () => { const pool = D.slots.map((pos, i) => ({ pos, p: ownedBy(S.lineup[i]) })).filter(x => x.p && (D.scorers || []).includes(x.pos)); if (D.football) return ownedBy(S.lineup[D.slots.indexOf("QB")])?.name || "Your QB"; const w = pool.flatMap(x => Array(Math.max(1, x.p.ovr - 50)).fill(x.p)); return (pick(w) || { name: "Your team" }).name; };
const catcher = () => { const pool = D.slots.map((pos, i) => ({ pos, p: ownedBy(S.lineup[i]) })).filter(x => x.p && ["WR", "TE", "RB"].includes(x.pos)); return (pick(pool)?.p || { name: "a receiver" }).name; };
const keeper = () => { if (D.football) { const d = D.slots.map((pos, i) => pos === "DEF" ? ownedBy(S.lineup[i]) : null).filter(Boolean).sort((a, b) => b.ovr - a.ovr)[0]; return d ? d.name : "Your defense"; } return ownedBy(S.lineup[D.slots.length - 1])?.name || "Your keeper"; };
function moveBall(toYou) { const b = $("ball"); if (!b) return; b.style.left = (toYou ? rnd(70, 92) : rnd(8, 30)) + "%"; b.style.top = rnd(25, 75) + "%"; }
function scored(you, pts, text) {
  if (you) M.you += pts; else M.them += pts;
  $("sYou").textContent = M.you; $("sThem").textContent = M.them;
  if (you) { $("flash").classList.remove("go"); void $("flash").offsetWidth; $("flash").classList.add("go"); if (!M.skip) { bigText(D.word); sRoar(true); sHorn(); const r = $("ball").getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, 30); } line(text, "good big"); }
  else { if (!M.skip) sAww(); line(text, "bad"); }
}
function nextEvent() {
  if (!M || !$("feed")) return;
  if (M.i >= M.ev.length) return endMatch();
  const e = M.ev[M.i++];
  $("clk").textContent = D.clock(e.t); $("prog").style.width = (e.t * 100) + "%"; moveBall(e.you);
  const go = () => setTimeout(nextEvent, M.skip ? 30 : 1100);
  const time = `<b>${D.clock(e.t)}</b>`;
  if (e.big && !M.skip) return bigChance(e, time, go);
  const att = e.you ? M.me.att : M.opp.att, def = e.you ? M.opp.def : M.me.def;
  const p = clamp(D.base + (att - def) / 50, .08, .65);
  if (D.football) {
    const r = Math.random();
    if (r < p) scored(e.you, 7, e.you ? `🏈 ${time} TOUCHDOWN! ${esc(scorerName())} finds ${esc(catcher())} in the end zone!` : `${time} Touchdown, ${esc(M.opp.name)}.`);
    else if (r < p + .22) { if (e.you) scored(true, 3, `🏈 ${time} Field goal is GOOD! ${esc(ownedBy(S.lineup[D.slots.indexOf("K")])?.name || "Your kicker")} splits the uprights!`); else scored(false, 3, `${time} ${esc(M.opp.name)} kick a field goal.`); }
    else line(e.you ? `${time} Drive stalls for ${esc(scorerName())}. Punt.` : `${time} 🛡️ Your defense forces a punt!`);
  } else {
    if (Math.random() < p) { const who = scorerName(); scored(e.you, 1, e.you ? `${D.emoji} ${time} ${D.word} ${esc(who)} ${pick(["scores!", "finishes it!", "buries it!", "makes no mistake!"])}` : `${time} ${esc(M.opp.name)} score.`); }
    else line(e.you ? `${time} Chance for ${esc(scorerName())}… ${pick(["just wide!", "saved!", "off the post!", "over the bar!"])}` : `${time} 🧤 ${esc(keeper())} ${pick(["makes the save!", "stops it!", "holds on!"])}`);
  }
  go();
}
function bigChance(e, time, go) {
  const [prompt, opts, win, lose] = e.you ? D.big.att : D.big.def;
  const who = e.you ? scorerName() : keeper();
  const box = modal(`<h3>${prompt}</h3><p class="soft">${e.you ? `⭐ ${esc(who)} has the ball!` : `🧤 ${esc(who)} is ready.`}</p><div class="choices">${opts.map((o, i) => `<button class="choice" data-c="${i}" type="button">${o}</button>`).join("")}</div><p class="soft" id="res" style="min-height:1.5em;font-weight:900;margin-top:10px"></p>`);
  tone(700, .15, "triangle", .1); tone(900, .15, "triangle", .1, 0, .15);
  box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    if (box.dataset.done) return; box.dataset.done = 1;
    const mine = +b.dataset.c;
    let ok, theirs;
    if (e.you) {   // you shoot; the keeper guesses (and sometimes remembers your favorite spot)
      theirs = M.last != null && Math.random() < .35 ? M.last : Math.floor(Math.random() * 3);
      const diff = (S.owned.find(p => p.name === who)?.ovr || M.me.att) - M.opp.def;
      ok = mine !== theirs ? Math.random() < clamp(.82 + diff / 100, .6, .97) : Math.random() < clamp(.15 + diff / 80, .05, .35);
    } else {       // they shoot; you guess where
      theirs = Math.floor(Math.random() * 3);
      const diff = M.me.def - M.opp.att;
      ok = mine === theirs ? Math.random() < clamp(.85 + diff / 100, .65, .97) : Math.random() < clamp(.12 + diff / 80, .04, .3);
    }
    M.last = mine;
    box.querySelectorAll("[data-c]").forEach(x => { x.disabled = true; if (+x.dataset.c === theirs) x.classList.add("theirs"); });
    b.classList.add(ok ? "right" : "wrong");
    box.querySelector("#res").textContent = ok ? `✅ ${win}` : `❌ ${lose}`;
    if (ok) { sRoar(!e.you ? false : true); } else sAww();
    setTimeout(() => {
      closeModal();
      if (e.you) { if (ok) scored(true, D.football ? 7 : 1, D.football ? `🏈 ${time} TOUCHDOWN on 4th down! ${esc(who)} calls it perfectly!` : `${D.emoji} ${time} ${D.word} ${esc(who)} picks the perfect spot!`); else line(`${time} ${esc(who)}: ${lose}`, "bad"); }
      else { if (ok) line(`🧤 ${time} ${win} ${esc(who)} reads it!`, "good"); else scored(false, D.football ? 7 : 1, `${time} ${esc(M.opp.name)} score on the big chance.`); }
      go();
    }, 1300);
  });
}
function endMatch() {
  $("clk").textContent = "FULL TIME"; $("prog").style.width = "100%"; sWhistle();
  const res = M.you > M.them ? "W" : M.you === M.them ? "D" : "L", lv = S.league.lv;
  const coins = (res === "W" ? 400 : res === "D" ? 200 : 100) + lv * 120 + Math.min(10, M.you) * (D.football ? 4 : 20);
  S.coins += coins; S.games++; if (res === "W") S.wins++;
  S.league.results.push(res);
  let season = "";
  if (S.league.results.length >= 5) {
    const pts = S.league.results.reduce((t, r) => t + (r === "W" ? 3 : r === "D" ? 1 : 0), 0);
    if (pts >= 9) { S.league.trophies.push(`${LEAGUES[lv][0]} ${LEAGUES[lv][1]} champs`); season = lv < 4 ? `🏆 You won the ${LEAGUES[lv][1]}! Welcome to the ${LEAGUES[lv + 1][1]}!` : "👑 LEGENDS CHAMPIONS! You beat the very best!"; if (lv < 4) S.league.lv++; }
    else season = `This season ended with ${pts} points. You need 9 to move up. New season, new chance!`;
    S.league.results = [];
  }
  save(); header();
  if (res === "W") { confetti(); sFan(); sRoar(true); }
  const title = res === "W" ? "🏆 YOU WIN!" : res === "D" ? "🤝 A DRAW" : "😤 SO CLOSE";
  setTimeout(() => {
    const box = modal(`<h3>${title}</h3><p style="font-family:Bungee,sans-serif;font-size:28px;margin:4px 0">${M.you} – ${M.them}</p><p class="soft">vs ${esc(M.opp.name)}</p><p style="font-weight:900;color:#ffe08a">🪙 +${fmt(coins)} coins</p>${season ? `<p style="font-weight:900">${season}</p>` : ""}<button class="btn go" id="packBtn" type="button">🎁 Open your reward pack</button>`);
    box.querySelector("#packBtn").onclick = () => openPack(res);
  }, M.skip ? 200 : 900);
}
function openPack(res) {
  // better results give better odds for a real star
  const starChance = res === "W" ? .28 : res === "D" ? .14 : .07, have = new Set(S.owned.map(p => p.key));
  const star = Math.random() < starChance, fresh = ALL.filter(p => !have.has(p.key));
  let pool = (fresh.length ? fresh : ALL).filter(p => star ? p.real : !p.real);
  if (!pool.length) pool = fresh.length ? fresh : ALL;
  const weights = pool.map(p => p.real ? Math.max(1, 100 - p.ovr) : Math.max(1, 90 - p.ovr));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), got = pool[0];
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { got = pool[i]; break; } }
  const dup = have.has(got.key);
  const box = modal(`<h3>🎁 Reward pack</h3><p class="soft">Tap the pack to open it!</p><div class="pack"><div class="flip" id="flip"><div class="face front">${D.emoji}</div><div class="face back">${cardHTML(dup ? Object.assign({}, ownedBy(got.key), { ovr: Math.min(99, ownedBy(got.key).ovr + 2) }) : got)}</div></div></div><p id="packMsg" style="font-weight:900;min-height:1.4em"></p><div class="row" style="justify-content:center"><button class="btn go hidden" id="nextM" type="button">▶ Next match</button><button class="btn alt hidden" id="toT" type="button">👕 My team</button></div>`);
  let opened = false;
  box.querySelector(".pack").onclick = () => {
    if (opened) return; opened = true; $("flip").classList.add("open"); tone(400, .3, "sine", .08, 1200);
    setTimeout(() => {
      let msg;
      if (dup) { const p = ownedBy(got.key); p.ovr = Math.min(99, p.ovr + 2); msg = `🔁 Duplicate! ${p.name} gets a training boost to ${p.ovr}!`; }
      else msg = `✨ ${got.name} joined your club!${signPlayer(got)}`;
      save(); header(); box.querySelector("#packMsg").textContent = msg;
      const r = box.querySelector(".pack").getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, got.real ? 46 : 24, got.ovr >= 90 ? ["#ffd7ff", "#8a5cff", "#ffd84d", "#ffffff"] : undefined);
      if (got.real) { sFan(); if (got.ovr >= 90) confetti(); } else sCoin();
      box.querySelector("#nextM").classList.remove("hidden"); box.querySelector("#toT").classList.remove("hidden");
    }, 1000);
  };
  box.querySelector("#nextM").onclick = () => { closeModal(); show("play"); };
  box.querySelector("#toT").onclick = () => { closeModal(); show("team"); };
}
$("modal").addEventListener("click", e => { if (e.target.id === "modal" && !M?.lock) { /* keep big chances open until you choose */ if ($("mbox").querySelector(".choices") || $("mbox").querySelector(".pack")) return; closeModal(); } });

/* ---------- start ---------- */
document.body.dataset.sport = SPORT; document.title = D.name;
$("hEm").textContent = D.emoji; $("hName").textContent = D.name;
show("play");
if (!S.games) setTimeout(() => toast(`👋 Welcome to ${D.name}! Your starters are ready. Win matches to buy real stars!`), 500);
</script>
